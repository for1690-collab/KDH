<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
/* ===== v4.12.42 — 앱 화면은 깃허브 페이지(정적), 첫 데이터만 앱스크립트에서 ==========
 * 이 파일(app.html)은 앱스크립트 밖 정적 호스팅에서 열린다. 그래서 앱스크립트 HTML 껍데기
 * (약 2.3초: /exec TTFB + 구글 껍데기 4홉 + 614K자 파싱)를 기다리지 않고 바로 뜬다.
 *  · 첫 화면 데이터: 읽기 전용 JSONP `?task=bootjs`·`?task=livejs` — 문서 맨 앞에서 동시에 쏜다.
 *  · 저장(쓰기): 뒤에서 뜨는 작은 다리 iframe(`?task=bridge` = 앱스크립트) 안의 google.script.run.
 *  · 앱스크립트가 직접 서빙할 때(롤백 경로 /exec)는 지금처럼 google.script.run 을 그대로 쓴다.
 * ==================================================================== */
(function(){
  var EXEC = 'https://script.google.com/macros/s/AKfycbxLARknNh7EdhMHr73c8M1UW5KeMzrVJw_t4B-zQbpcrVKVEIz_CEghKGiz-bChC0X3/exec';
  var BOOT_KEY = 'okgil-boot-2f7d41c8e6';
  window.__okgilExec = EXEC;
  var P;
  try{ P = window.__okgilPerf = window.__okgilPerf || { t: performance.now(), marks: {} }; }
  catch(e){ P = { t: 0, marks: {} }; }
  var out = window.__okgilEarly = { boot: null, live: null, usedBoot: false, usedLive: false,
                                    sentAt: null, avail: null, waited: 0 };
  /* 앱스크립트가 서빙하는 중인가(롤백 경로). 아니면 정적 호스팅 = JSONP. */
  var GAS = /(^|\.)googleusercontent\.com$/i.test(location.hostname) || location.hostname === 'script.google.com';
  function fire(fn){
    return new Promise(function(resolve){
      try{
        google.script.run
          .withSuccessHandler(function(v){
            try{ if(fn === 'getBootstrap') P.marks.bootResp = performance.now();
                 else if(fn === 'getLive') P.marks.liveResp = performance.now(); }catch(e2){}
            resolve({ ok: true, v: v });
          })
          .withFailureHandler(function(e){ resolve({ ok: false, e: e }); })
          [fn]();
      }catch(e){ resolve({ ok: false, e: e }); }
    });
  }
  function start(){
    try{ P.marks.earlyAvail = performance.now(); }catch(e){}
    out.avail = performance.now();
    out.sentAt = out.avail;
    try{ P.marks.earlySent = performance.now(); }catch(e){}
    out.boot = fire('getBootstrap');
    out.live = fire('getLive');
  }
  /* 런처(같은 오리진 top)가 먼저 받아 둔 약속을 그대로 쓴다 — 앱 HTML 이 도착하기 전에
     요청이 뜨 있어 모바일에서 0.2~0.4초 빨라진다. 없으면 스스로 쏜다. */
  function takeFromHost(which){
    try{
      if(window.top && window.top !== window && window.top.__okgilEarlyTake){
        var p = window.top.__okgilEarlyTake(which);
        if(p) return Promise.resolve(p);
      }
    }catch(e){}
    return null;
  }
  function jsonp(task){
    return new Promise(function(resolve){
      var done = false, tag = null;
      function fin(v, isErr){
        if(done) return; done = true;
        try{ if(tag && tag.parentNode) tag.parentNode.removeChild(tag); }catch(e){}
        try{ if(task === 'bootjs') P.marks.bootResp = performance.now();
             else P.marks.liveResp = performance.now(); }catch(e2){}
        resolve(isErr ? { ok: false, e: v } : { ok: true, v: v });
      }
      var cb = '__okgilJs' + (task === 'bootjs' ? 'B' : 'L') + Math.floor(Math.random() * 1e8);
      window[cb] = function(v){
        fin(v);
        try{ setTimeout(function(){ try{ delete window[cb]; }catch(e){} }, 0); }catch(e){}
      };
      setTimeout(function(){ fin('timeout', true); }, 15000);
      try{
        tag = document.createElement('script');
        tag.async = true;
        tag.src = EXEC + '?task=' + task + '&key=' + BOOT_KEY + '&cb=' + cb + '&_=' + (+new Date());
        tag.onerror = function(){ fin('network', true); };
        (document.head || document.documentElement).appendChild(tag);
      }catch(e){ fin(String(e), true); }
    });
  }
  out.avail = performance.now();
  out.sentAt = out.avail;
  try{ P.marks.earlySent = performance.now(); }catch(e){}
  if(GAS){
    var tries = 0;
    (function wait(){
      if(window.google && google.script && google.script.run){ start(); return; }
      if(++tries > 100){ out.boot = jsonp('bootjs'); out.live = jsonp('livejs'); return; }
      out.waited = tries * 10;
      setTimeout(wait, 10);
    })();
  }else{
    out.boot = takeFromHost('boot') || jsonp('bootjs');
    out.live = takeFromHost('live') || jsonp('livejs');
  }
})();

/* ===== v4.12.42 — 저장(쓰기) 다리 ======================================
 * 정적 페이지에는 google.script.run 이 없다. 저장·조회 중 첫 화면 뒤에 오는 것은 모두
 * 작은 다리 iframe(앱스크립트 `?task=bridge`)으로 보내고, 그 안에서 google.script.run 이
 * 실행된다. 첫 화면을 막지 않게 DOM 준비 뒤에 만든다.
 *   앱 → (window.top) → 런처 → (다리 창) → 다리 → google.script.run
 *   다리 → (window.top) → 런처 → (앱 창) → 앱
 * 런처 없이 app.html 을 직접 열어도 top 이 이 창이라 같은 방식으로 돈다.
 * 실패는 모두 promise reject 로 돌려주고, 45초에 응답이 없으면 기존과 같은 문구로 끊는다.
 * ==================================================================== */
(function(){
  var seq = 0, pend = {}, ready = false, made = false, waiters = [], migrated = false;
  /* 다리 창 — hello 를 보내 온 창. 런처가 중계하면 런처 창이, app.html 을 직접 열면 다리 창이 온다. */
  var bridgeTarget = null;
  function post(msg){
    var w = bridgeTarget || window.top || window;
    try{ w.postMessage(msg, '*'); return true; }catch(e){ return false; }
  }
  function create(){
    if(made) return; made = true;
    /* 앱스크립트가 직접 서빙하는 중(롤백 경로)이면 다리가 필요 없다 — google.script.run 이 그 자리에 있다. */
    try{ if(window.google && google.script && google.script.run) return; }catch(e){}
    try{
      var f = document.createElement('iframe');
      f.id = 'okgil-bridge';
      f.setAttribute('aria-hidden', 'true');
      f.tabIndex = -1;
      f.style.cssText = 'position:fixed;left:-700px;top:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none';
      f.src = window.__okgilExec + '?task=bridge&_=' + (+new Date());
      (document.body || document.documentElement).appendChild(f);
    }catch(e){}
  }
  function onReady(){
    if(ready) return;
    ready = true;
    try{ if(window.__okgilPerf && window.__okgilPerf.marks) window.__okgilPerf.marks.bridgeReady = performance.now(); }catch(e){}
    var w = waiters.slice(0); waiters.length = 0;
    for(var i = 0; i < w.length; i++){ try{ w[i](); }catch(e){} }
    migrate();
  }
  /* 예전(앱스크립트 오리진)에 저장해 둔 기기 값 — 매출 잠금 해제 시각·작성자·읽은 공지·
   * 스냅숏을 다리에서 받아 이 오리진으로 한 번만 옮긴다. 실패하면 다음 실행에 다시 시도. */
  function migrate(){
    if(migrated) return; migrated = true;
    try{ if(localStorage.getItem('okgil.migrated.v1')) return; }catch(e){ return; }
    var id = 'm' + (++seq);
    pend[id] = { mig: true };
    if(!post({ type: 'okgil-migrate-req', id: id })){ delete pend[id]; }
  }
  function applyMigration(id, ok, data){
    var p = pend[id];
    if(!p || !p.mig) return;
    delete pend[id];
    if(!ok || !data) return;
    var n = 0;
    try{
      for(var k in data){
        if(!data.hasOwnProperty(k)) continue;
        if(String(k).indexOf('okgil.') !== 0) continue;
        if(k === 'okgil.migrated.v1') continue;
        try{ if(localStorage.getItem(k) == null){ localStorage.setItem(k, String(data[k])); n++; } }catch(e){}
      }
      localStorage.setItem('okgil.migrated.v1', String(Date.now()));
    }catch(e){}
    try{ if(window.__okgilPerf && window.__okgilPerf.marks) window.__okgilPerf.marks.migrated = n; }catch(e){}
  }
  window.addEventListener('message', function(ev){
    var d = ev.data;
    if(!d || typeof d !== 'object') return;
    if(d.type === 'okgil-bridge-ready'){ if(ev.source) bridgeTarget = ev.source; onReady(); return; }
    if(d.type === 'okgil-migrate-res'){ applyMigration(String(d.id || ''), !!d.ok, d.data); return; }
    if(d.type !== 'okgil-rpc-res') return;
    if(!/^https:\/\/(([a-z0-9-]+\.)*googleusercontent\.com|script\.google\.com)$/i.test(String(ev.origin || '')) && ev.origin !== location.origin) return;
    var id = String(d.id || ''), p = pend[id];
    if(!p || p.mig) return;
    delete pend[id];
    try{ clearTimeout(p.timer); }catch(e){}
    if(d.ok){ p.resolve(d.v); }
    else { p.reject(new Error(String(d.e || '서버 오류'))); }
  });
  function whenReady(){
    return new Promise(function(res, rej){
      if(ready){ res(); return; }
      var over = false;
      waiters.push(function(){ over = true; res(); });
      setTimeout(function(){
        if(over || ready) return;
        rej(new Error('저장 통로가 열리지 않았습니다. 앱을 닫았다 다시 열어 주세요.'));
      }, 20000);
      if(!made) create();
    });
  }
  function call(fn, args){
    return whenReady().then(function(){
      return new Promise(function(resolve, reject){
        var id = 'r' + (++seq) + '_' + (+new Date());
        var timer = setTimeout(function(){
          if(!pend[id]) return;
          delete pend[id];
          reject(new Error('응답 시간 초과 (45초). 서버가 답하지 않습니다.'));
        }, 45000);
        pend[id] = { resolve: resolve, reject: reject, timer: timer };
        if(!post({ type: 'okgil-rpc', id: id, fn: String(fn || ''), args: args || [] })){
          delete pend[id];
          clearTimeout(timer);
          reject(new Error('저장 통로를 열지 못했습니다.'));
        }
      });
    });
  }
  window.__okgilRpc = { call: call, create: create, isReady: function(){ return ready; } };
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ create(); });
  }else{
    create();
  }
})();
</script>

<title>바나프레소·바나커피 옥길점</title>
<style>
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --surface2:#F4F5F6; --cream:#FAFAFA;
  --line:#E6E6E6; --brown:#111214; --brown-d:#0B0C0D; --brown-l:#5B6169;
  --accent:#E24E6B; --text:#111214; --muted:#6E747B; --ok:#1F7D5B; --warn:#A9690A; --danger:#C43350;
  --r:12px; --sh:0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
#fit{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:0 0}
body{
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.45;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%; overscroll-behavior-y:contain;
}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.wrap{position:relative;height:100%;max-width:1080px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}

 
.appbar{
  position:relative;z-index:20;flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(180deg,#111214,#0B0C0D);color:#FFFFFF;
  box-shadow:0 2px 10px rgba(16,24,40,.18);
}
.logo{
  width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:#F4F5F6;color:#111214;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;
}
.brand{flex:1;min-width:0}
.brand .t{font-size:16.5px;font-weight:750;letter-spacing:-.2px}
.brand .s{font-size:12px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:44px;height:44px;flex:0 0 44px;border:0;border-radius:12px;background:rgba(255,255,255,.14);
  color:#FFFFFF;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{background:rgba(255,255,255,.28)}

 
.progress{display:none;align-items:center;gap:10px;padding:8px 14px;background:#F1F2F3;border-bottom:1px solid var(--line);flex:0 0 auto}
.progress.show{display:flex}
.bar{flex:1;height:8px;border-radius:99px;background:#E6E6E6;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#E24E6B,#111214);border-radius:99px;transition:width .25s}
.progress b{font-size:13px;color:var(--brown);white-space:nowrap}

 
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 12px 8px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card.tight{padding:0;overflow:hidden}
.sec-title{font-size:13px;font-weight:750;color:var(--brown);letter-spacing:.2px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:10px}
.field{flex:1;min-width:0}
.field>span{display:block;font-size:12.5px;font-weight:700;color:var(--brown);margin-bottom:4px}
input[type=text],input[type=date],input[type=number],textarea,select{
  width:100%;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:12px;
  background:#FFF;font-size:16px;color:var(--text);outline:none;
}
textarea{height:auto;min-height:76px;padding:10px 12px;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(226,78,107,.14)}
.btn-primary{width:100%;height:54px;border:0;border-radius:14px;background:var(--brown);color:#FFFFFF;font-size:17px;font-weight:750;box-shadow:0 6px 16px rgba(17,18,20,.26)}
.btn-primary:disabled{opacity:.4;box-shadow:none}
.btn-line{height:46px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:#FFF;color:var(--brown);font-size:15px;font-weight:700}
.btn-line:active{background:var(--surface2)}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}

 
.searchbar{position:relative;margin-bottom:12px}
.searchbar input{height:50px;padding-left:42px;background:#FFF;box-shadow:var(--sh);border-color:transparent}
.searchbar .mag{position:absolute;left:14px;top:13px;width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2}
.results{margin-top:6px;background:#FFF;border-radius:var(--r);box-shadow:var(--sh);max-height:44vh;overflow:auto;display:none}
.results.show{display:block}
.result{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);min-height:52px}
.result:last-child{border-bottom:0}
.result .rn{flex:1;font-size:15px;font-weight:650}
.result .rz{font-size:12px;color:var(--muted);margin-top:1px}
.result .plus{width:34px;height:34px;border-radius:10px;background:var(--surface2);color:var(--brown);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.zone{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}

.toast{
  position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-16px);
  z-index:60;background:#111214;color:#FFFFFF;padding:12px 18px;border-radius:12px;font-size:14.5px;font-weight:650;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:90vw;text-align:center;line-height:1.4;
  box-shadow:0 10px 26px rgba(17,18,20,.28);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== v3.6 스플래시 — 바나프레소 브랜드 톤(핑크 #E24E6B / 브라운 #5B6169) ===== */
#splash{
  position:fixed;inset:0;z-index:70;
  background:radial-gradient(120% 62% at 50% 108%,rgba(214,58,92,.55) 0%,rgba(214,58,92,0) 62%),linear-gradient(168deg,#A62E50 0%,#8A2240 46%,#641530 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .3s;
}
#splash.hide{opacity:0;pointer-events:none}

#splash .st{margin-top:18px;font-size:18px;line-height:26px;font-weight:800;color:#FFF;letter-spacing:-.3px}
#splash .sb{margin-top:5px;font-size:11.5px;line-height:16px;font-weight:650;color:rgba(255,255,255,.88);letter-spacing:.16em}
#splash .ss{margin-top:10px;font-size:12.5px;line-height:18px;color:rgba(255,255,255,.92)}
.spin{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#FFF;border-radius:50%;animation:sp .8s linear infinite;margin-top:18px}
@keyframes sp{to{transform:rotate(360deg)}}

 
 
.chip.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.searchbar.inline{margin-bottom:10px}
.ordrow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ordrow:last-child{border-bottom:0}
.ordrow .od{flex:1;min-width:0}
.ordrow .od b{display:block;font-size:14.5px;font-weight:700;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.ordrow .od i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35;font-variant-numeric:tabular-nums}
.ordrow .oq2{flex:0 0 auto;text-align:right}
.ordrow .step{gap:4px;justify-content:flex-end}
.ordrow .step button{width:32px;height:34px;font-size:17px;border-radius:9px}
.ordrow .step input{width:48px;height:34px;font-size:16px;border-radius:9px}
.ordrow .amt{display:block;font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;min-height:13px}
.ordrow.zero{opacity:.55}
.tag.on{background:#E9F5EF;color:#1F7D5B}
.tag.mut{background:#F2F3F4;color:#8A9099}
.lnk{border:0;background:none;color:var(--brown);font-weight:800;font-size:12.5px;text-decoration:underline;padding:0 2px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.setrow b{font-size:14.5px}
.setrow .step button{width:40px;height:40px;font-size:20px}
.setrow .step input{width:54px;height:40px;font-size:16px}
.verline{font-size:11.5px;color:var(--muted);text-align:center;padding:6px 0 2px}

@media (min-width:820px){
  main{padding:16px 18px 8px}
  .zonelist{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .zonelist .zone{margin-bottom:0}
  .menugrid{grid-template-columns:1fr 1fr}
  .sum{grid-template-columns:repeat(3,1fr)}
  .sum .box.wide{grid-column:auto}
}

.addbar .abtx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.addbar .abtx b{display:block;font-size:14.5px;font-weight:800;color:#111214;letter-spacing:-.2px;line-height:1.25}
.addbar .abtx span{display:block;font-size:12px;line-height:1.3;color:#8A9099;margin-top:2px;letter-spacing:-.1px}
.addbar .abgo{
  flex:0 0 32px;width:32px;height:32px;border:0;border-radius:50%;
  background:#E24E6B;color:#FFFFFF;font-size:20px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(226,78,107,.35);cursor:pointer;
  transition:transform .1s,background .15s;
}
.addbar .abgo:active{background:#CE3B54;transform:scale(.94)}
.addbar .abx{
  flex:0 0 24px;width:24px;height:24px;border:0;border-radius:50%;
  background:transparent;color:#A9AEB5;font-size:15px;font-weight:500;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
.addbar .abx:active{color:#666666}
html.pfit .addbar{bottom:70px;padding:10px 15px 10px 13px;border-radius:22px}
html.pfit .addbar .abico{width:44px;height:44px;flex:0 0 44px}
html.pfit .addbar .abtx b{font-size:16px}
html.pfit .addbar .abtx span{font-size:13px}
html.pfit .addbar .abgo{width:36px;height:36px;flex:0 0 36px;font-size:22px}

/* ===== 바로가기 설치 안내 모달 (v3.8) ===== */
.inst-modal{
  position:fixed;inset:0;z-index:90;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
}
.inst-modal[hidden]{display:none !important}
.inst-backdrop{
  position:absolute;inset:0;
  background:rgba(0,0,0,.45);backdrop-filter:blur(2px);
}
.inst-card{
  position:relative;z-index:1;width:100%;max-width:420px;
  background:#FFFFFF;border-radius:20px;padding:22px 20px 18px;
  box-shadow:0 16px 40px rgba(0,0,0,.22);
  animation:popIn .25s cubic-bezier(.16,1,.3,1);
}
@keyframes popIn{
  from{opacity:0;transform:scale(.92) translateY(10px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.inst-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}

.inst-head-tx{flex:1;min-width:0}
.inst-t{font-size:16px;font-weight:800;color:#111214;letter-spacing:-.3px}
.inst-st{font-size:12px;color:#8A9099;margin-top:2px}
.inst-x{
  width:32px;height:32px;border:0;background:#F2F3F4;border-radius:50%;
  font-size:16px;color:#5B6169;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.inst-steps{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.inst-step-row{
  display:flex;align-items:flex-start;gap:10px;
  background:#FCFCFD;border:1px solid #FBE3E8;border-radius:12px;
  padding:11px 12px;
}
.inst-num{
  width:22px;height:22px;flex:0 0 22px;border-radius:50%;
  background:#E24E6B;color:#FFF;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.inst-msg{flex:1;font-size:13.5px;line-height:1.45;color:#111214}
.inst-msg b{color:#E24E6B;font-weight:700}
.inst-msg .badge{
  display:inline-block;background:#FFF;border:1px solid #DDDFE2;
  border-radius:6px;padding:1px 6px;font-size:12px;font-weight:600;vertical-align:middle;
}
.inst-ok-btn{
  width:100%;height:44px;border:0;border-radius:12px;
  background:#E24E6B;color:#FFF;font-size:15px;font-weight:700;
  cursor:pointer;box-shadow:0 4px 12px rgba(226,78,107,.3);
}
.inst-ok-btn:active{background:#CE3B54}



/* --- v4.0 Connected Tabs & Loss Modal Styles --- */
.loss-pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  color: #C43350;
  background: #FCE7EC;
  border-radius: 4px;
  padding: 1px 6px;
  margin-left: 6px;
  vertical-align: middle;
}
.btn-loss-subtle {
  border: 1px solid #F7CCD6;
  background: #FCF2F4;
  color: #C43350;
  font-size: 12px;
  font-weight: 700;
  padding: 5px 9px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.15s ease;
}
.btn-loss-subtle:active {
  background: #F7CCD6;
}
.item-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.loss-modal-wrap {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 9999;
  align-items: center;
  justify-content: center;
}
.loss-modal-wrap.open {
  display: flex;
}
.loss-modal-backdrop {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(2px);
}
.loss-modal-card {
  position: relative;
  width: 90%;
  max-width: 440px;
  background: #FFF;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
  overflow: hidden;
  animation: modalPop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes modalPop {
  0% { transform: scale(0.9); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.loss-modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background: #FCF2F4;
  border-bottom: 1px solid #F7CCD6;
}
.loss-modal-title {
  font-size: 16px;
  font-weight: 800;
  color: #C43350;
}
.loss-modal-x {
  border: none;
  background: none;
  font-size: 18px;
  color: #8A9099;
  cursor: pointer;
  padding: 4px;
}
.loss-modal-body {
  padding: 18px;
}
.loss-item-info {
  background: #F7F8F9;
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 14px;
  border: 1px solid #E4E4E4;
}
.loss-item-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.loss-item-cur {
  font-size: 13px;
  color: var(--muted);
  margin-top: 3px;
}
.loss-field {
  margin-bottom: 14px;
}
.loss-field label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 6px;
}
.loss-field input[type="text"] {
  width: 100%;
  box-sizing: border-box;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
}
.loss-step {
  display: flex;
  align-items: center;
  gap: 8px;
}
.loss-step input {
  width: 80px;
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 6px;
}
.loss-step button {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #F7F8F9;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}
.loss-warn {
  font-size: 12px;
  color: #C43350;
  background: #FCFCFD;
  border-left: 3px solid #C43350;
  padding: 8px 10px;
  border-radius: 4px;
  margin-bottom: 14px;
  line-height: 1.4;
}
.loss-submit-btn {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  font-weight: 800;
  border-radius: 10px;
}
.btn-check-pending {
  border: 1px solid var(--border);
  background: #FFF;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.btn-check-done {
  border: 1px solid #CFE8DC;
  background: #E9F5EF;
  color: #1F7D5B;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
}


/* ===== v4.4 매장현황 [현황] 탭 =========================================
 * 브랜드 브라운 위에 핑크(#E24E6B)를 "지금 살아있는 것"의 강조색으로만 더한다.
 * 카드 컴포넌트는 기존 .card / .zone-head 를 그대로 쓰고, 배지·막대·필터 칩만 새로 만든다.
 * ==================================================================== */
:root{
  --pink:#E24E6B; --pink-d:#CE3B54; --pink-soft:#FCE7EC;
  --ok-bg:#E9F5EF; --warn-bg:#FDF3E2; --dead-bg:#F2F3F4;
}
.tab .badge.pink{background:var(--pink)}

/* 상태 스트립 */
.lv-strip{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r);
  box-shadow:var(--sh);padding:10px 12px;margin-bottom:12px;min-height:56px}
.lv-biz{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:99px;
  font-size:12.5px;font-weight:800;background:var(--dead-bg);color:var(--muted);white-space:nowrap}
.lv-biz.ok{background:var(--ok-bg);color:#1F7D5B}
.lv-biz.warn{background:var(--warn-bg);color:#A9690A}
.lv-biz i{width:7px;height:7px;border-radius:99px;background:currentColor;display:inline-block}
.lv-hours{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lv-age{flex:1;min-width:0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;
  font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-age .dot{width:8px;height:8px;border-radius:99px;flex:0 0 8px;background:#8A9099}
.lv-age .dot.ok{background:#1F7D5B}
.lv-age .dot.warn{background:#D08A16}
.lv-age .dot.bad{background:var(--danger)}
.lv-reload{flex:0 0 44px;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;
  background:var(--cream);color:var(--brown);font-size:20px;line-height:1;display:flex;
  align-items:center;justify-content:center}
.lv-reload.spinning{animation:lspin .9s linear infinite}
@keyframes lspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.lv-warnbar{display:flex;align-items:center;gap:8px;background:var(--pink-soft);color:var(--pink-d);
  border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:700;margin:-4px 0 12px;line-height:1.45}
.lv-post{background:var(--cream);color:var(--x-muted,#8A9099);border-radius:12px;padding:9px 12px;
  font-size:12px;font-weight:650;margin:-4px 0 12px;line-height:1.45}

/* 2열 배치 */
.lv-cols{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:760px){
  .lv-cols{grid-template-columns:57% 43%;gap:12px;align-items:start}
  .lv-col{min-width:0}
}
.lv-col{min-width:0}

/* 카드 머리 */
.lv-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.lv-head .t{font-size:14.5px;font-weight:800;color:var(--brown);letter-spacing:-.2px}
.lv-head .c{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 제조 현황 */
.lv-make{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lv-make .cell{padding:12px;text-align:center;min-height:104px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;background:#FFF}
.lv-make .cell + .cell{border-left:1px solid var(--line)}
.lv-make .cell.hot{background:var(--pink-soft);box-shadow:inset 0 0 0 1px #F7CCD6}
.lv-make .k{font-size:12px;color:var(--muted);font-weight:700}
.lv-make .v{font-size:34px;font-weight:800;color:var(--brown);font-variant-numeric:tabular-nums;line-height:1.1}
.lv-make .cell.hot .v{color:var(--pink-d)}
.lv-make .cell.zero .v{color:var(--muted)}
.lv-make .u{font-size:12px;color:var(--muted)}

/* 필터 칩 · 오늘 주문 */
.lv-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.lv-chips::-webkit-scrollbar{display:none}
.lv-chip{flex:0 0 auto;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);
  background:#FFF;color:var(--text);font-size:12.5px;font-weight:700;white-space:nowrap}
.lv-chip.on{background:var(--brown);border-color:var(--brown);color:#FFFFFF}
.lv-chip em{font-style:normal;opacity:.75;font-size:11.5px;margin-left:3px}

.lv-orders{max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  border:1px solid var(--line);border-radius:12px}
.lv-gh{display:flex;align-items:center;gap:6px;width:100%;border:0;border-bottom:1px solid var(--line);
  background:var(--surface2);padding:9px 11px;text-align:left;font-size:12.5px;font-weight:800;color:var(--brown);
  font-variant-numeric:tabular-nums;position:sticky;top:0;z-index:2}
.lv-gh .ar{width:12px;flex:0 0 12px;color:var(--brown-l);font-size:11px}
.lv-gh .h{flex:0 0 auto}
.lv-gh .m{flex:1;min-width:0;text-align:right;font-weight:700;color:var(--muted);font-size:12px}
.lv-gh .m b{color:var(--text);font-weight:800}
.lv-row{padding:9px 11px;border-bottom:1px solid var(--line);position:relative;background:#FFF}
.lv-row:last-child{border-bottom:0}
.lv-row.new:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pink)}
.lv-r1{display:flex;align-items:center;gap:7px}
.lv-t{font-size:15px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;flex:0 0 46px}
.lv-t.now{color:var(--pink-d)}
.lv-chipc{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;
  font-size:11px;font-weight:800;background:var(--line);color:var(--text);white-space:nowrap}
.lv-chipc.del{background:var(--pink-soft);color:var(--pink-d)}
.lv-chipc.kiosk{background:var(--surface2);color:var(--brown-l)}
.lv-chipc.app{background:#F2F3F4;color:#5B6169}
.lv-chipc.pos{background:var(--dead-bg);color:var(--muted)}
.lv-chipc.shop{background:var(--line);color:var(--text)}
.lv-amt{margin-left:auto;font-size:16px;font-weight:800;color:var(--brown);font-variant-numeric:tabular-nums}
.lv-newtag{font-size:9px;font-weight:800;color:#FFF;background:var(--pink);border-radius:5px;padding:1px 4px;margin-left:4px}
/* v4.12.23 — 잔 수만큼 메뉴 이름을 반복해 넣으므로 줄 수 제한을 두지 않는다(잘리지 않게). */
.lv-r2{margin-top:3px;font-size:13px;color:var(--text);line-height:1.45;padding-left:53px;
  white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.lv-r3{margin-top:2px;font-size:12px;color:var(--muted);padding-left:53px;line-height:1.45}
.lv-r3 .req{color:var(--brown-l)}
.lv-row.tap{cursor:pointer}
.lv-tail{padding:10px 11px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}

/* 당일 매출 */
.lv-today{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.lv-today .big{font-size:34px;font-weight:800;color:var(--brown);font-variant-numeric:tabular-nums;letter-spacing:-.8px;line-height:1}
.lv-today .big small{font-size:15px;font-weight:800;margin-left:2px}
.lv-today .date{font-size:12px;color:var(--muted);white-space:nowrap;padding-bottom:3px}
.lv-split{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.lv-split>div{padding:0 6px;border-left:1px solid var(--line);min-width:0}
.lv-split>div:first-child{border-left:0;padding-left:0}
.lv-split .k{font-size:11.5px;color:var(--muted);font-weight:700}
.lv-split .v{font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;margin-top:2px}
.lv-ratio{display:flex;height:6px;border-radius:99px;overflow:hidden;margin-top:10px;background:var(--surface2)}
.lv-ratio i{display:block;height:100%;background:var(--brown)}
.lv-ratio i.del{background:var(--pink)}

/* 시간대 막대 */
.lv-bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:4px}
.lv-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;
  background:linear-gradient(180deg,transparent 0,#F2F3F4 100%);border-radius:4px 4px 0 0;border:0;padding:0;overflow:hidden}
.lv-bar .dl{width:100%;background:var(--pink)}
.lv-bar .hl{width:100%;background:var(--brown)}
.lv-bar.sel:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--brown);border-radius:2px 2px 0 0}
.lv-bar.now{background-image:repeating-linear-gradient(45deg,#F2F3F4,#F2F3F4 4px,#F2F3F4 4px,#F2F3F4 8px)}
.lv-x{display:flex;gap:3px;margin-top:4px}
.lv-x span{flex:1;text-align:center;font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lv-x span.sel{color:var(--brown);font-weight:800}
.lv-hdet{margin-top:10px;padding:9px 11px;background:var(--surface2);border-radius:10px;font-size:12.5px;
  color:var(--text);line-height:1.5;font-variant-numeric:tabular-nums}
.lv-hdet b{color:var(--brown)}
.lv-seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lv-seg button{height:30px;padding:0 12px;border:0;background:#FFF;color:var(--brown);font-size:12.5px;font-weight:800}
.lv-seg button.on{background:var(--brown);color:#FFFFFF}

/* 메뉴 랭킹 */
.lv-mrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);min-height:44px}
.lv-mrow:last-child{border-bottom:0}
.lv-mrow .rk{flex:0 0 22px;font-size:15px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.lv-mrow .rk.top{color:var(--pink-d)}
.lv-mrow .nm{flex:1;min-width:0;font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-mrow .nm span{font-size:11px;color:var(--muted);font-weight:700;margin-left:4px}
.lv-mrow .qt{font-size:15px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.lv-mrow .qt i{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:700;margin-left:1px}
.lv-mrow .am{flex:0 0 auto;text-align:right;font-size:13px;font-weight:700;color:var(--brown);font-variant-numeric:tabular-nums;min-width:74px}
.lv-note{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.lv-more{width:100%;height:40px;margin-top:8px;border:1px solid var(--line);border-radius:11px;background:var(--cream);
  color:var(--brown);font-size:13px;font-weight:800}

/* 고객 메모 */
.lv-memo{padding:9px 0;border-bottom:1px solid var(--line)}
.lv-memo:last-child{border-bottom:0}
.lv-memo .who{display:flex;align-items:baseline;gap:6px;font-size:13.5px;font-weight:800;color:var(--text)}
.lv-memo .who i{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:600}
.lv-memo .tx{font-size:12.5px;color:var(--text);margin-top:3px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lv-memo .mt{font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.lv-empty{padding:14px 4px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.6}

/* 고객 메모 시트 */
.lv-ms-row{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.lv-ms-row .t,.lv-ms-row .a{padding-top:1px}
.lv-ms-row:last-child{border-bottom:0}
.lv-ms-row .t{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 44px}
.lv-ms-row .n{flex:1;min-width:0;font-size:13.5px;color:var(--text);white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.lv-ms-row .a{font-size:13.5px;font-weight:800;color:var(--brown);font-variant-numeric:tabular-nums}
.lv-ms-cust{padding:10px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.lv-ms-cust .w{flex:1;min-width:0}
.lv-ms-cust .w b{font-size:14.5px;font-weight:800}
.lv-ms-cust .w i{font-style:normal;display:block;font-size:12px;color:var(--muted);margin-top:2px}
.lv-ms-cust .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lv-phone-btn{height:28px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:#FFF;
  color:var(--brown);font-size:11.5px;font-weight:800}
.lv-dl{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}

/* 첫 진입 공지 팝업 */
.npop{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.npop[hidden]{display:none}
.npop-bd{position:absolute;inset:0;background:rgba(17,18,20,.52)}
.npop-card{position:relative;width:100%;max-width:520px;max-height:82vh;overflow-y:auto;background:var(--surface);
  border-radius:18px;box-shadow:0 18px 50px rgba(16,24,40,.3);padding:18px 18px 16px}
.npop-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.npop-badge{height:24px;padding:0 10px;border-radius:99px;background:var(--pink);color:#FFF;font-size:11.5px;
  font-weight:800;display:inline-flex;align-items:center}
.npop-badge.doc{background:var(--brown)}
.npop-date{flex:1;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.npop-x{width:36px;height:36px;border:0;border-radius:10px;background:var(--surface2);color:var(--brown);font-size:16px}
.npop-title{font-size:17px;font-weight:800;color:var(--text);line-height:1.4;letter-spacing:-.3px}
.npop-body{margin-top:10px;font-size:13.5px;line-height:1.62;color:#5B6169;white-space:pre-wrap}
.npop-more{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5}
.npop-acts{display:flex;gap:8px;margin-top:16px}
.npop-acts button{flex:1;height:48px;border-radius:13px;font-size:14.5px;font-weight:800;border:1px solid var(--line);
  background:#FFF;color:var(--brown)}
.npop-acts button.primary{background:var(--brown);border-color:var(--brown);color:#FFFFFF;flex:1.4}

/* 휴대폰: 한 줄로 쌓고 순서를 상태 → 제조 → 당일매출 → 주문 → 시간대 → 메뉴 → 메모로 */
@media (max-width:759px){
  .lv-cols{display:flex;flex-direction:column}
  .lv-col{display:contents}
  .lv-card-make{order:1}
  .lv-card-today{order:2}
  .lv-card-orders{order:3}
  .lv-card-hour{order:4}
  .lv-card-menu{order:5}
  .lv-card-memo{order:6}
  .lv-orders{max-height:none}
  .lv-today .big{font-size:30px}
  .lv-make .v{font-size:28px}
  .lv-strip{position:sticky;top:0;z-index:12}
  .lv-bars{height:96px}
}

/* ===== v4.5 발주 · 입고 · 재고 연결 =====================================
 * 발주 탭 = [발주 흐름] + [품목별 발주 수량]. 기존 .card / .lv-head / .btn-* 위에
 * 발주 전용 부품(세그먼트·규칙·우유·입고·이력)만 새로 얹는다.
 * ==================================================================== */
.of-seg{display:flex;gap:6px;padding:4px;background:var(--surface2);border-radius:12px;margin-bottom:12px}
.of-seg-b{flex:1;height:38px;border:0;border-radius:9px;background:transparent;color:var(--brown-l);
  font-size:13.5px;font-weight:800}
.of-seg-b.on{background:var(--brown);color:#FFFFFF;box-shadow:0 1px 3px rgba(91,97,105,.25)}

.of-badge{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:7px;
  font-size:11px;font-weight:800;white-space:nowrap;background:var(--line);color:var(--muted)}
.of-badge.ok{background:var(--ok-bg);color:#1F7D5B}
.of-badge.warn{background:var(--warn-bg);color:#A9690A}
.of-badge.bad{background:var(--pink-soft);color:var(--pink-d)}
.of-badge.mut{background:var(--dead-bg);color:var(--muted)}

/* 규칙 */
.of-rule{padding:10px 0;border-top:1px dashed var(--line)}
.of-rule:first-of-type{border-top:0;padding-top:2px}
.of-r1{display:flex;align-items:center;gap:8px}
.of-r1 b{font-size:14.5px;color:var(--text)}
.of-r2{font-size:13px;color:var(--text);margin-top:3px}
.of-r2 b{color:var(--brown);font-variant-numeric:tabular-nums}
.of-r3{font-size:13px;color:var(--brown-l);margin-top:2px}
.of-r3 b{color:var(--pink-d);font-weight:800}
.of-r4{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.of-r4 b{color:var(--brown)}

/* 우유 */
.of-milk{border:1.5px solid var(--line)}
.of-milk.low{border-color:#F7CCD6;background:#FCFCFD}
.of-milk.unknown{border-color:#F3DFC2;background:#F7F8F9}
.of-milk-main{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.of-milk-main b{font-size:32px;font-weight:800;color:var(--brown);font-variant-numeric:tabular-nums;line-height:1}
.of-milk.low .of-milk-main b{color:var(--pink-d)}
.of-milk-main small{font-size:12px;color:var(--muted);font-weight:700}
.of-milk-eta{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.of-milk-reason{font-size:12.5px;color:var(--text);margin-top:7px;line-height:1.45}
.of-milk-act{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;margin-top:9px}
.of-need{font-size:13px;color:var(--pink-d);font-weight:800}
.of-need b{font-size:15px}
.of-milk-src{font-size:11.5px;color:var(--muted);margin-top:7px}
.of-btn{flex:0 0 auto;width:auto;height:34px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:800;margin-left:auto;white-space:nowrap}
.of-btn2{height:32px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:800}

/* 입고 예정 */
.of-pend{border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden;background:#FFF}
.of-pend-h{display:flex;align-items:center;gap:8px;padding:10px 11px;background:var(--surface2);cursor:pointer}
.of-pend-t{flex:1;min-width:0}
.of-pend-t b{font-size:13.5px;color:var(--brown)}
.of-pend-m{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.of-ar{color:var(--brown-l);font-size:11px;width:12px;text-align:center}
.of-pend-a{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;padding:9px 11px;border-top:1px solid var(--line)}
.of-amt{flex:0 0 auto;white-space:nowrap;font-size:12.5px;font-weight:800;color:var(--brown);font-variant-numeric:tabular-nums}
.of-pend-a .of-btn2{flex:0 0 auto;width:auto;white-space:nowrap}
.of-pend-a .of-mini{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.of-pend-a .of-btn2:first-of-type{margin-left:auto}
.of-mini{font-size:11.5px;color:var(--muted)}

/* 품목 줄 */
.of-lines{border-top:1px solid var(--line)}
.of-line{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line);font-size:13px}
.of-line:last-child{border-bottom:0}
.of-line.in{background:#FBFDFC}
.of-ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.of-lq{font-weight:800;color:var(--brown);font-variant-numeric:tabular-nums;flex:0 0 auto}
.of-lq input{width:66px;height:28px;text-align:center;border:1px solid var(--line);border-radius:7px;
  font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;background:#FFF}
.of-lu{flex:0 0 auto;font-size:11px;color:var(--muted);min-width:34px;text-align:right}

/* 수동 발주 */
.of-msearch input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;
  font-size:14px;background:#FFF}
.of-hits{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.of-hit{display:flex;flex-direction:column;gap:1px;text-align:left;border:1px solid var(--line);
  border-radius:10px;background:#FFF;padding:9px 11px}
.of-hit b{font-size:13.5px;color:var(--text)}
.of-hit span{font-size:11.5px;color:var(--muted)}
.of-cart{margin-top:10px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.of-crow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:#FFF}
.of-crow:last-child{border-bottom:0}
.of-cn{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.of-cstep{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.of-cstep button{width:30px;height:30px;border:0;background:var(--surface2);color:var(--brown);font-size:15px;font-weight:800}
.of-cq{width:46px;height:30px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);
  text-align:center;font-size:13px;font-weight:800;background:#FFF;font-variant-numeric:tabular-nums}
.of-cx{width:28px;height:28px;border:0;background:transparent;color:var(--muted);font-size:16px;font-weight:800}
.of-eta{margin-top:8px;font-size:12.5px;color:var(--brown);font-weight:800}
.of-save{display:flex;gap:8px;margin-top:9px}
.of-save input{flex:0 0 96px;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:13px}
.of-save .of-btn{margin-left:0;flex:1;height:36px}
.of-sub{font-size:12px;font-weight:800;color:var(--muted);margin:14px 0 6px}
.of-mlist{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.of-mrow{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;background:#FFF}
.of-mrow:last-child{border-bottom:0}
.of-md{color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto}
.of-mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.of-me{color:var(--muted);font-size:11.5px;flex:0 0 auto}

/* 발주 이력 */
.of-hist-row{border:1px solid var(--line);border-radius:11px;margin-top:8px;overflow:hidden;background:#FFF}
/* 펼친 품목 줄 — 이름/수량·단가(아래 줄) + 금액(오른쪽) */
.of-hli{display:flex;align-items:flex-start;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line);font-size:13px}
.of-hli:last-child{border-bottom:0}
.of-hli.in{background:#FBFDFC}
.of-hlc{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.of-hln{font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.of-hls{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.of-hlinb{color:#1F7D5B;font-weight:700}
.of-hla{flex:0 0 auto;min-width:72px;text-align:right;font-size:13px;font-weight:800;color:var(--brown);
  font-variant-numeric:tabular-nums}
.of-hlna{color:var(--muted);font-weight:700;font-size:11.5px}
.of-hlt{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:9px 11px;
  background:#F7F8F9;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:700}
.of-hlt b{font-size:14.5px;color:var(--brown);font-variant-numeric:tabular-nums}
.of-hlnote{padding:0 11px 9px;background:#F7F8F9;font-size:11px;color:var(--muted)}
.of-hh{display:flex;align-items:center;gap:7px;padding:9px 11px;cursor:pointer}
.of-hd{font-size:13px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.of-hm{flex:1;min-width:0;font-size:11.5px;color:var(--muted);text-align:right;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.of-more{width:100%;margin-top:9px}
.of-help{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px}
.of-help b{color:var(--brown)}
.of-empty{font-size:12.5px;color:var(--muted);line-height:1.55;padding:4px 0}
.of-err{color:var(--danger)}

/* v4.5 현황 — 메뉴별 판매 분류 */
.lv-menu-kinds{margin-top:-2px}
.lv-mtot{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:10px;
  padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:700}
.lv-mtot b{font-size:14px;color:var(--brown);font-variant-numeric:tabular-nums}

/* ===== v4.6 ============================================================
 * ① [발주] 입고 예정 — 품목별 체크박스 · 체크분만 반영(부분 반영) · 미도착 유지
 * ② [재고] 품목마다 오픈 · 사용 · 마감 세 숫자를 옆에 나란히
 * ==================================================================== */
/* --- ① 입고 체크박스 --- */
.of-sel{display:flex;align-items:center;gap:8px;padding:7px 11px;background:#F7F8F9;border-bottom:1px solid var(--line)}
.of-seln{flex:1;min-width:0;font-size:11.5px;color:var(--muted)}
.of-seln b{font-size:13px;color:var(--brown);font-variant-numeric:tabular-nums}
.of-cmdsm{flex:0 0 auto;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:7px;
  background:#FFF;color:var(--brown-l);font-size:11.5px;font-weight:800}
.of-cb{flex:0 0 auto;width:26px;height:26px;border:1.5px solid #D8DADD;border-radius:8px;background:#FFF;
  color:#FFF;font-size:14px;font-weight:900;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.of-cb.on{background:var(--brown);border-color:var(--brown)}
.of-lchk .of-ln{color:var(--text)}
.of-lchk.off .of-ln{color:var(--muted)}
.of-lchk.off .of-lq input{background:var(--surface2);color:var(--muted)}
.of-cbi{flex:0 0 auto;width:26px;text-align:center;color:#1F7D5B;font-size:13px;font-weight:900}
.of-inb-at{flex:0 0 auto;font-size:11px;color:#1F7D5B;font-weight:700;white-space:nowrap}

/* --- ② 재고 3용어 --- */
.sd-strip{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:5px}
.sd-c{display:inline-flex;align-items:baseline;gap:3px;padding:1px 7px;border-radius:7px;
  background:var(--surface2);font-variant-numeric:tabular-nums}
.sd-c i{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:700}
.sd-c b{font-size:13px;color:var(--brown);font-weight:800;line-height:1.5}
.sd-c.use b{color:var(--pink-d)}
.sd-c.use.nil b{color:var(--muted);font-weight:700}
.sd-c.use.neg b{color:var(--danger)}
.sd-c em.sd-src{font-style:normal;font-size:9.5px;color:var(--brown-l);font-weight:700;letter-spacing:-.2px;white-space:nowrap}
/* v4.7.0 박스+낱개 — 수치 아래에 낱개 환산 */
.stepwrap{display:flex;flex-direction:column;align-items:stretch;gap:2px;flex:0 0 auto}
.pkg-eq{font-size:11px;font-weight:800;color:var(--brown-l);text-align:center;line-height:1.2;
  font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.3px}
.pkg-eq.nil{color:var(--muted);font-weight:700}
.sd-x{font-size:10.5px;color:var(--muted);white-space:nowrap}
.sd-legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:11px;color:var(--muted);line-height:1.5}
.sd-legend span{white-space:nowrap}
.sd-legend b{color:var(--brown)}
.sd-legend em{font-style:normal;color:var(--brown-l)}
@media (max-width:430px){
  .sd-strip{gap:4px}
  .sd-c{padding:1px 5px}
  .sd-c b{font-size:12px}
  .sd-x{display:none}
}

/* 발주 이력 품목 줄 — 반영 취소 */
.of-cxl{display:block;margin:4px 0 0 auto;height:24px;padding:0 8px;border:1px solid var(--line);
  border-radius:7px;background:#FFF;color:var(--muted);font-size:11px;font-weight:800;white-space:nowrap}
.of-hla{min-width:84px}

/* 저장 바가 떠 있을 때 설치 안내 카드가 저장 버튼을 가리지 않게 위로 올린다 */
body.saveon .addbar{bottom:136px}
/* v4.6.4 — 발주 마감 임박 팝업 (첫 진입 공지 팝업 .npop 부품을 그대로 쓰고 색만 바꾼다) */
.npop.oap .npop-card{border-top:5px solid #D08A16}
.npop.oap .npop-badge{background:#A9690A}
.npop.oap .npop-title{font-size:18px;letter-spacing:-.4px}
.npop.oap .npop-body{font-size:14px}
.oap-note{margin-top:9px;padding:9px 11px;border-radius:10px;background:#F7F8F9;border:1px solid #F3DFC2;
  font-size:12.5px;font-weight:700;color:#82550C;line-height:1.5}
.oap-note:empty{display:none}
.oap-acts{display:flex;gap:8px;margin-top:15px}
.oap-acts button{flex:1;height:46px;border-radius:13px;font-size:14.5px;font-weight:800;font-family:inherit;
  border:1px solid var(--line);background:#FFF;color:var(--brown)}
.oap-acts button.primary{background:var(--brown);border-color:var(--brown);color:#FFFFFF;flex:1.5}

/* v4.6.5 주문 제조 상태 뱃지 및 터치 필터링 */
.lv-st-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  padding: 3px 6px;
  border-radius: 4px;
  margin-right: 5px;
  vertical-align: middle;
}
.lv-st-badge.st-make {
  background: #FDF3E2;
  color: #A9690A;
  border: 1px solid #F6DFB4;
  animation: pulse-make 2s infinite ease-in-out;
}
@keyframes pulse-make {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.75; }
}
.lv-st-badge.st-wait {
  background: #F2F3F4;
  color: #111214;
  border: 1px solid #E9E9E7;
}
.lv-st-badge.st-ready {
  background: #E9F5EF;
  color: #1F7D5B;
  border: 1px solid #BFEBD5;
}
.lv-st-badge.st-done {
  background: #F2F3F4;
  color: #5B6169;
  border: 1px solid #E6E6E6;
}
.lv-st-badge.st-cancel {
  background: #FCE7EC;
  color: #C43350;
  border: 1px solid #F7CCD6;
}
.lv-row.is-make {
  border-left: 3.5px solid #D08A16 !important;
  background: #FFFFFF !important;
}
.lv-row.is-wait {
  border-left: 3.5px solid #E24E6B !important;
  background: #F7F8F9 !important;
}
.lv-make .cell.tap {
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, box-shadow 0.15s;
}
.lv-make .cell.tap:active {
  transform: scale(0.97);
}
.lv-make .cell.selected {
  outline: 2px solid #A9690A;
  background: #FDF9F3 !important;
}
.lv-chip.chip-make {
  border-color: #D08A16;
  color: #A9690A;
}
.lv-chip.chip-make em {
  background: #D08A16;
  color: #FFF;
}
/* ===== v4.9.0 — 4탭 셸 (새로 그린 표현 계층) ==============================
 * 아이보리 바탕 · 흰 카드 · 강조는 브라운 한 가지.
 * 상태 색은 부족(빨강) / 마감·주의(앰버) / 정상(초록) 세 가지만 포인트로 쓴다.
 * 클래스는 모두 x- 접두사 — 기존 화면(레시피 뷰어·자료실 등)의 CSS와 섞이지 않게.
 * ==================================================================== */
:root{
  --x-line:#E9E9E7; --x-ink:#111214; --x-muted:#6E747B;
  --x-brand:#111214; --x-brand2:#5B6169;
  --x-warn:#A9690A; --x-warn-bg:#FDF3E2;
  --x-bad:#C43350; --x-bad-bg:#FCE7EC;
  --x-ok:#1F7D5B; --x-ok-bg:#E9F5EF;
  --x-pink:#CE3B54; --x-pink-bg:#FCE7EC; --x-pink-fill:#E24E6B;
  --x-shadow:0 1px 2px rgba(16,24,40,.04);
}
body{background:#FAFAFA}
.wrap{max-width:640px}
/* ── 상단 바 ─────────────────────────────────────────────── */
.x-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  background:#FFFFFF;color:#111214;border-bottom:1px solid #E9E9E7;
  padding:calc(9px + env(safe-area-inset-top)) 14px 9px;min-height:0;
}
.x-bar-t{flex:1;min-width:0;padding-left:4px}
.x-bar-t b{display:block;font-size:16.5px;font-weight:750;letter-spacing:-.3px;line-height:1.25}
.x-bar-t span{display:block;font-size:11.5px;opacity:.85;line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-bar-t span i{font-style:normal;display:inline-block;width:5px;height:5px;border-radius:99px;background:#37C48A;margin-right:4px;vertical-align:1px}
.x-ib{
  position:relative;width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:0;
  background:rgba(255,255,255,.13);color:#FFFFFF;display:flex;align-items:center;justify-content:center;
}
.x-ib:active{background:rgba(255,255,255,.26)}
.x-ib .x-i{width:21px;height:21px}
.x-dot{
  position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;
  background:#E24E6B;color:#FFF;font-size:10px;font-weight:800;line-height:17px;text-align:center;
  font-style:normal;border:1.5px solid #111214;
}
/* ── 아이콘 (한 세트: 24 격자 · 선 1.75) ──────────────────── */
.x-i{
  width:20px;height:20px;flex:0 0 auto;display:block;
  fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.x-i.xf{fill:currentColor;stroke:none}
/* ── 본문 ───────────────────────────────────────────────── */
#main{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px;
}
#main>*{flex:0 0 auto}
/* ── 진행률 ─────────────────────────────────────────────── */
#progress{
  display:none;align-items:center;gap:9px;padding:9px 14px 9px 14px;
  background:#FFF;border-bottom:1px solid var(--x-line);flex:0 0 auto;
}
#progress.on{display:flex}
#progress .bar{flex:1;height:5px;border-radius:99px;background:#ECEDEF;overflow:hidden}
#progress .bar i{display:block;height:100%;width:0;background:#111214;border-radius:99px;transition:width .18s}
#progress b{font-size:11.5px;font-weight:800;color:var(--x-muted);white-space:nowrap}
/* ── 카드 ───────────────────────────────────────────────── */
.x-card{background:#FFF;border:1px solid var(--x-line);border-radius:16px;overflow:hidden;box-shadow:var(--x-shadow)}
.x-ch{display:flex;align-items:center;gap:7px;padding:12px 14px 9px}
.x-ch .x-ct{font-size:14px;font-weight:750;letter-spacing:-.2px}
.x-ch .x-cn{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--x-muted)}
.x-ch .x-cn.bad{color:var(--x-bad);background:var(--x-bad-bg);border-radius:99px;padding:2px 8px}
.x-more{margin-left:auto;display:inline-flex;align-items:center;gap:1px;background:none;border:0;color:var(--x-brand2);font-size:12px;font-weight:750;padding:2px 0}
.x-more .x-i{width:15px;height:15px}
/* ── 줄(목록) ───────────────────────────────────────────── */
.x-li{
  display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;
  border:0;border-top:1px solid #F0F0F0;background:none;text-align:left;color:var(--x-ink);
}
.x-li:first-of-type{border-top:0}
button.x-li:active{background:#FDF8F1}
.x-li>.x-i{color:var(--x-brand2)}
.x-li-t{flex:1;min-width:0}
.x-li-t b{display:block;font-size:14.5px;font-weight:650;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-li-t span{display:block;font-size:11.5px;color:var(--x-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-li-r{font-size:13.5px;font-weight:750;white-space:nowrap;text-align:right;color:var(--x-ink)}
.x-li-r small{display:block;font-size:10.5px;font-weight:650;color:var(--x-muted);margin-top:1px}
.x-li .x-go{width:16px;height:16px;color:#C3C6CC}
/* ── 배지(항상 한글 문구와 함께) ──────────────────────────── */
.x-bg{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:-.1px;font-style:normal;white-space:nowrap}
.x-bg.bad{background:var(--x-bad-bg);color:var(--x-bad)}
.x-bg.warn{background:var(--x-warn-bg);color:var(--x-warn)}
.x-bg.ok{background:var(--x-ok-bg);color:var(--x-ok)}
.x-bg.mut{background:#F2F3F4;color:#8A9099}
.x-bg.new{background:var(--x-pink-bg);color:var(--x-pink)}
/* v4.10.8 — 단종예정 한 줄(뱃지 + 기한). 목록은 그대로 두고 표시만 덧붙인다. */
.x-dcl{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px;line-height:1.35}
.x-dcl .x-bg{height:18px;padding:0 6px;font-size:10.5px}
.x-dcl b{font-size:11px;font-weight:700;color:var(--x-muted);letter-spacing:-.1px}
.x-mrow .x-dcl{margin-top:2px}
.x-li .x-dcl{margin-top:3px}
.r-dc{margin:0 0 10px}
/* ── 홈: 오늘 매출 ───────────────────────────────────────── */
.x-hero{background:#111214;color:#FFFFFF;border-radius:18px;padding:14px 16px 12px}
.x-hero-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:750;color:rgba(255,255,255,.85)}
.x-hero-h .x-i{width:16px;height:16px;opacity:.9}
.x-hero-h .x-bg{margin-left:auto;background:rgba(255,255,255,.16);color:#FFFFFF}
.x-hero-h .x-bg.ok{background:rgba(55,196,138,.22);color:#BFEBD5}
.x-hero-h .x-bg.warn{background:rgba(249,168,88,.22);color:#FFD8B0}
.x-hero-v{font-size:31px;font-weight:800;letter-spacing:-1.2px;line-height:1.12;margin-top:7px}
.x-hero-v small{font-size:16px;font-weight:700;letter-spacing:-.3px;margin-left:2px;opacity:.92}
.x-hero-s{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.74);margin-top:3px}
.x-hero-f{
  display:flex;align-items:center;gap:8px;width:100%;margin-top:11px;padding:10px 0 0;
  border:0;border-top:1px solid rgba(255,255,255,.16);background:none;color:#FFFFFF;
  font-size:12.5px;font-weight:750;text-align:left;
}
.x-hero-f span{flex:1}
.x-hero-f .x-i{width:17px;height:17px;opacity:.8}
/* ── 세그먼트 ───────────────────────────────────────────── */
.x-top{display:flex;align-items:center;gap:8px}
.x-seg{flex:1;display:flex;background:#F2F3F4;border-radius:13px;padding:3px}
.x-seg button{
  flex:1;height:38px;border:0;background:none;border-radius:10px;
  font-size:13.5px;font-weight:750;color:#8A9099;display:flex;align-items:center;justify-content:center;gap:5px;
}
.x-seg button.on{background:#FFF;color:var(--x-brand);box-shadow:0 1px 3px rgba(16,24,40,.13)}
.x-seg .x-n{font-size:10.5px;font-weight:800;background:var(--x-bad);color:#FFF;border-radius:99px;padding:1px 6px}
/* ── 버튼 ───────────────────────────────────────────────── */
.x-btn{
  height:46px;padding:0 18px;border-radius:13px;border:0;background:#111214;color:#FFF;
  font-size:15px;font-weight:800;letter-spacing:-.2px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.x-btn:active{background:#0B0C0D}
.x-btn:disabled{background:#C9CCD1;color:#FFF}
.x-btn .x-i{width:18px;height:18px}
.x-btn2{
  height:42px;padding:0 13px;border-radius:12px;border:1px solid var(--x-line);background:#FFF;color:var(--x-brand);
  font-size:13px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:5px;
}
.x-btn2 .x-i{width:16px;height:16px}
.x-lnk{background:none;border:0;color:var(--x-muted);font-size:12.5px;font-weight:750;padding:10px 6px;text-decoration:underline;text-underline-offset:2px}
/* ── 검색 ───────────────────────────────────────────────── */
.x-sw{position:relative}
.x-search{display:flex;align-items:center;gap:8px;background:#FFF;border:1px solid var(--x-line);border-radius:13px;padding:0 12px;height:44px}
.x-search .x-i{width:18px;height:18px;color:var(--x-muted)}
.x-search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px;color:var(--x-ink)}
.x-search input::placeholder{color:#A9AEB5}
/* ── 품목 줄(재고) ───────────────────────────────────────── */
.x-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #F0F0F0}
.x-row:first-child{border-top:0}
.x-row.done{background:#FCFCFD}
.x-row-l{flex:1;min-width:0}
.x-row-n{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:650;letter-spacing:-.2px}
.x-row-n i{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-row-m{font-size:11.5px;color:var(--x-muted);margin-top:2px}
.x-row-m b{font-weight:800;color:var(--x-ink)}
.x-row-m b.bad{color:var(--x-bad)}
.x-row-m b.good{color:var(--x-ok)}
.x-qin{
  width:76px;height:44px;flex:0 0 76px;border:1.5px solid var(--x-line);border-radius:12px;
  text-align:center;font-size:16px;font-weight:750;color:var(--x-ink);background:#FFF;outline:0;
}
.x-qin:focus{border-color:var(--x-brand);background:#FFFFFF}
.x-qin.has{border-color:#C3C6CC;background:#FFFFFF}
.x-qin.bad{border-color:var(--x-bad);background:var(--x-bad-bg)}
/* v4.9.9 — 품목 이름 아래 한 줄(배송단위·낱개 환산)과 실사 입력 두 칸([박스][낱개]) */
.u-n2{flex:1;min-width:0}
.u-m{font-size:10.5px;font-weight:750;color:#8A9099;letter-spacing:-.1px;margin-top:2px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-in{display:flex;flex-direction:column;align-items:flex-end;flex:0 0 auto}
.u-split{display:flex;gap:4px}
.u-f{display:flex;flex-direction:column;align-items:center;gap:1px}
.u-f em{font-style:normal;font-size:10px;font-weight:800;color:#8A9099;letter-spacing:-.1px;line-height:1.1}
.x-qin.x-qs{width:54px;flex:0 0 54px;height:38px;font-size:15px}
/* ── v4.9.5 재고 3칸: 기준 · 입고 · 사용량 · 실재고 ─────────────
 * 동환 님 지시(2026-11-15): "입고 재고와 사용량, 그다음에 실 재고,
 * 이 세 가지가 구분되어 있는 화면이 없어." 네 숫자를 품목마다 한 줄에 나란히 둔다. */
.u-row{display:block;padding:9px 14px 10px}
.u-top{display:flex;align-items:center;gap:8px}
.u-n{flex:1;min-width:0;display:flex;align-items:center;gap:6px;min-height:22px;font-size:14.5px;font-weight:650;letter-spacing:-.2px}
.u-n i{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-diff{display:inline-flex;flex:0 0 auto}
.u-g{display:flex;align-items:center;flex-wrap:wrap;gap:5px 8px;margin-top:5px}
.u-c{display:inline-flex;align-items:baseline;gap:4px;min-width:0;position:relative}
.u-c + .u-c::before{content:'·';position:absolute;left:-6px;top:0;color:#C9CCD1;font-size:12px;font-weight:700}
.u-c .k{font-style:normal;font-size:10px;font-weight:800;color:#8A9099;letter-spacing:-.1px;white-space:nowrap}
.u-c .v{font-style:normal;font-size:13px;font-weight:800;letter-spacing:-.3px;color:var(--x-ink);white-space:nowrap}
.u-c .v.mut{color:#B3B8BF;font-weight:700}
.u-c .s{font-style:normal;font-size:9px;font-weight:800;color:#8A9099;letter-spacing:-.1px;white-space:nowrap}
.u-c.use{border:1px dashed #D3D5D9;background:#FAFBFC;border-radius:9px;padding:2px 6px 3px;font-family:inherit;margin-left:2px}
.u-c.use .k{color:var(--x-brand2)}
.u-c.use .v{color:var(--x-brand)}
.u-c.use.on{border-style:solid;border-color:#B9BDC3;background:#FDF2F5}
.u-c.close .v{color:#1F7D5B;font-size:14.5px}
.u-c.close.low .v{color:var(--x-bad)}
.u-c.close.low .s{color:var(--x-bad)}
.u-c .v.na,.u-c .s.na{color:#C9CCD1}
.u-c .s.warn{color:var(--x-warn)}
.u-note{font-size:10.5px;line-height:1.45;color:#8A9099;margin-top:5px;padding-bottom:2px}
/* 폰 폭에서는 띠가 줄바꾸면서 앞에 점(·)이 남으므로 점을 빼고 간격으로 나눈다. */
@media (max-width:430px){
  .u-c + .u-c::before{content:none}
  .u-g{gap:5px 10px}
}
.u-calc{padding:2px 14px 12px}
.u-calc .r{display:flex;align-items:baseline;gap:6px;padding:5px 0;border-top:1px dashed #F0F0F0;font-size:13px}
.u-calc .r:first-child{border-top:0}
.u-calc .r i{font-style:normal;color:var(--x-muted);font-weight:700;font-size:12px;flex:0 0 62px}
.u-calc .r b{font-weight:800;color:var(--x-ink);margin-left:auto;text-align:right}
.u-calc .r.sum b{color:#1F7D5B;font-size:16px}
.u-calc .r em{font-style:normal;font-size:10.5px;font-weight:800;color:#8A9099;margin-left:4px}
/* ── 발주 줄 ─────────────────────────────────────────────── */
.x-ol{display:flex;align-items:center;gap:9px;padding:10px 14px;border-top:1px solid #F0F0F0;flex-wrap:wrap}
.x-ol:first-child{border-top:0}
.x-ol-l{flex:1;min-width:0}
.x-ol-n{font-size:14.5px;font-weight:650;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-ol-m{font-size:11.5px;color:var(--x-muted);margin-top:2px}
.x-stepper{display:flex;align-items:center;height:40px;border:1px solid var(--x-line);border-radius:11px;overflow:hidden;background:#FFF}
.x-stepper button{
  width:38px;height:100%;border:0;background:#F5F6F7;color:var(--x-brand);
  display:flex;align-items:center;justify-content:center;
}
.x-stepper button:active{background:#ECEDEF}
.x-stepper button .x-i{width:15px;height:15px}
.x-stepper input{
  width:46px;height:100%;border:0;border-left:1px solid var(--x-line);border-right:1px solid var(--x-line);
  text-align:center;font-size:14.5px;font-weight:750;color:var(--x-ink);background:#FFF;outline:0;
}
.x-amt{width:76px;text-align:right;font-size:13.5px;font-weight:750;letter-spacing:-.3px;white-space:nowrap}
.x-amt.nil{color:#A9AEB5;font-weight:650}
.x-amt:empty{display:none}          /* v4.9.1 — 수량 0이면 금액 자리를 비워 품목 이름이 넓게 보이게 */
/* v4.9.1 — 부족 참고 줄(작은 회색 글씨)과 목록 구분 머리 */
.x-ol-ref{flex:0 0 100%;font-size:11px;line-height:1.45;color:#8A9099;letter-spacing:-.1px;margin-top:1px}
.x-ol-ref b{font-weight:800;color:var(--x-bad)}
.x-sub{display:flex;align-items:center;gap:6px;padding:8px 14px 6px;border-top:1px solid #F0F0F0;background:#F7F8F9;font-size:11.5px;font-weight:800;color:#8A9099;letter-spacing:-.1px}
/* ── 하단 액션 바 ────────────────────────────────────────── */
.x-act{
  display:none;flex:0 0 auto;align-items:center;gap:10px;
  padding:9px 12px;background:#FFF;border-top:1px solid var(--x-line);
}
.x-act.on{display:flex}
.x-act-t{flex:1;min-width:0}
.x-act-t b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.2px}
.x-act-t span{display:block;font-size:11px;color:var(--x-muted);margin-top:1px}
.x-act .x-btn{min-width:118px}
/* ── 하단 탭 ─────────────────────────────────────────────── */
.x-tabs{
  flex:0 0 auto;display:flex;background:#FFF;border-top:1px solid var(--x-line);
  padding-bottom:env(safe-area-inset-bottom);
}
.x-tab{
  flex:1;height:56px;border:0;background:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;color:#8A9099;font-size:11px;font-weight:750;letter-spacing:-.2px;
}
.x-tab .x-i{width:22px;height:22px}
.x-tab.on{color:#CE3B54}
/* ── 전면 화면(시트) — 탭 → 시트 2단까지만 ────────────────── */
#xsheet{
  position:fixed;inset:0;z-index:60;background:#FAFAFA;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
#xsheet[hidden]{display:none}
.x-sb{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;width:100%;max-width:640px;margin:0 auto}
.x-sh-h{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#FFF;border-bottom:1px solid var(--x-line)}
.x-sh-h b{font-size:16px;font-weight:750;letter-spacing:-.3px}
.x-back{width:42px;height:42px;border:0;background:none;color:var(--x-brand);display:flex;align-items:center;justify-content:center}
.x-back .x-i{width:21px;height:21px}
.x-sh-b{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:12px 12px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;
}
.x-sh-b>*{flex:0 0 auto}
/* 시트 안 부품 */
.x-note{font-size:11.5px;line-height:1.5;color:var(--x-muted);padding:2px 3px}
.x-hint{display:flex;gap:8px;align-items:flex-start;background:var(--x-warn-bg);border:1px solid #F3DFC2;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.45;color:#7C5A17}
.x-hint .x-i{width:16px;height:16px;margin-top:1px;color:var(--x-warn)}
.x-hint.ok{background:var(--x-ok-bg);border-color:#CFE8DC;color:#1B6A4D}
.x-hint.ok .x-i{color:var(--x-ok)}
.x-empty{padding:26px 16px;text-align:center;font-size:13px;color:var(--x-muted);line-height:1.6}
.x-empty b{display:block;font-size:14px;color:var(--x-ink);margin-bottom:3px}
/* 입고 검수 */
.x-line{display:flex;align-items:center;gap:9px;padding:9px 14px;border-top:1px solid #F0F0F0;font-size:14px}
.x-line:first-child{border-top:0}
.x-cb{
  width:26px;height:26px;flex:0 0 26px;border:1.5px solid #D4D6DA;border-radius:8px;background:#FFF;
  color:#FFF;display:flex;align-items:center;justify-content:center;
}
.x-cb.on{background:#111214;border-color:#111214}
.x-cb .x-i{width:15px;height:15px;stroke-width:2.6}
.x-line-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-line-q{font-size:13px;font-weight:750;color:var(--x-muted);white-space:nowrap}
.x-line-q input{width:58px;height:34px;border:1.5px solid var(--x-line);border-radius:9px;text-align:center;font-size:14px;font-weight:750}
.x-line.in{color:#8A9099}
/* 폼 */
.x-field{display:flex;flex-direction:column;gap:5px}
.x-field>span{font-size:11.5px;font-weight:750;color:var(--x-muted)}
.x-in,.x-sel,.x-ta{
  width:100%;border:1px solid var(--x-line);border-radius:11px;background:#FFF;
  padding:11px 12px;font-size:14.5px;color:var(--x-ink);outline:0;font-family:inherit;
}
.x-ta{resize:vertical;line-height:1.5}
.x-chips{display:flex;gap:6px;flex-wrap:wrap}
.x-chip{
  height:36px;padding:0 13px;border-radius:99px;border:1px solid var(--x-line);background:#FFF;
  font-size:13px;font-weight:700;color:#5B6169;
}
.x-chip.on{background:#111214;border-color:#111214;color:#FFF}
/* 판매메뉴 */
.x-mrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #F0F0F0}
.x-mrow:first-child{border-top:0}
.x-mrow-l{flex:1;min-width:0}
.x-mrow-n{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:650;letter-spacing:-.2px}
.x-mrow-n i{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-mrow-m{font-size:11px;color:var(--x-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-mthumb{width:50px;height:50px;flex:0 0 50px;border-radius:12px;object-fit:cover;background:#F0F0F0;display:block}
.x-mrow-d{font-size:11px;color:var(--x-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-price{font-size:13.5px;font-weight:750;white-space:nowrap}
/* 공지·문서 */
.x-doc{border-top:1px solid #F0F0F0;padding:12px 14px}
.x-doc:first-child{border-top:0}
.x-doc-h{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--x-muted)}
.x-doc-t{font-size:14.5px;font-weight:700;letter-spacing:-.2px;line-height:1.35;margin-top:4px}
.x-doc-c{font-size:13px;line-height:1.55;color:#5B6169;margin-top:6px;white-space:pre-wrap}
.x-doc-f{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.x-doc-f .x-btn2{height:34px;font-size:12px;padding:0 10px}
.x-trunc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 하단 액션 바가 있으면 설치 안내 카드는 그 위로 */
body.xact .addbar{bottom:calc(64px + 58px)}
html.pfit body.xact .addbar{bottom:calc(70px + 60px)}
/* 오늘 현황 시트는 시트 폭(최대 640px)에 맞춰 항상 한 줄로 쌓는다 */
#xsheet .lv-cols{display:flex;flex-direction:column;gap:10px}
#xsheet .lv-col{display:contents}
#xsheet .lv-card-make{order:1}
#xsheet .lv-card-today{order:2}
#xsheet .lv-card-orders{order:3}
#xsheet .lv-card-hour{order:4}
#xsheet .lv-card-menu{order:5}
#xsheet .lv-card-memo{order:6}
#xsheet .lv-orders{max-height:none}
#xsheet .lv-strip{position:static}

/* ===== v4.11.0 — UI 리뉴얼 (A안 페이퍼리스 그레이 + 홈 B안 매출 카드) ========
 * 색·아이콘·간격만 교체한다. 화면 구조와 데이터 로직은 v4.10.8 그대로.
 * 크림·브라운 2색 톤을 버리고 중성 회색 바탕 + 검정 잉크 + 브랜드 핑크 1색으로.
 * ==================================================================== */
body{background:#FAFAFA}
.wrap{background:#FAFAFA}
#main{padding:12px 14px 18px;gap:10px}
/* ── 상단 바 ─────────────────────────────────────────────── */
.x-bar-t{padding-left:2px;gap:0}
.x-bar-t b{font-size:16px;font-weight:700;letter-spacing:-.3px}
.x-bar-t span{font-size:11px;color:#8A9099;opacity:1;margin-top:2px}
.x-bar-t span i{width:5px;height:5px;background:#B9BEC5;vertical-align:1px}
.x-ib{width:34px;height:34px;flex:0 0 34px;border:1px solid #E9E9E7;border-radius:9px;background:#fff;color:#3C4249}
.x-ib .x-i{width:18px;height:18px}
.x-ib:active{background:#F4F5F6}
.x-dot{top:-3px;right:-4px;border-color:#fff;background:#E24E6B;font-size:9.5px;min-width:16px;height:16px;line-height:16px;padding:0 3px}
/* ── 진행률 ─────────────────────────────────────────────── */
#progress{background:#fff;border-bottom:1px solid #E9E9E7;padding:8px 14px}
#progress .bar{height:5px;background:#ECEDEF}
#progress .bar i{background:#E24E6B}
#progress b{color:#8A9099;font-weight:650;font-size:11px}
/* ── 카드 ───────────────────────────────────────────────── */
.x-card{border:1px solid #E9E9E7;border-radius:12px;box-shadow:none}
.x-ch{padding:13px 14px 6px}
.x-ch .x-ct{font-size:13px;font-weight:650;letter-spacing:-.1px}
.x-ch .x-cn{font-weight:600;color:#8A9099;font-size:11.5px}
.x-ch .x-cn.bad{color:#C43350;font-weight:700}
.x-li{padding:11px 14px;border-top:1px solid #F0F0F0}
button.x-li:active{background:#FAFAFA}
.x-li-t b{font-size:13.5px;font-weight:600}
.x-li-t span{font-size:11.5px;color:#8A9099;margin-top:2px}
.x-li-r{font-size:13px;font-weight:650}
.x-li-r small{font-size:10.5px;color:#6E747B}
.x-bg{font-size:10.5px;font-weight:700;padding:0 7px}
/* ── 세그먼트 ───────────────────────────────────────────── */
.x-seg{background:#F2F3F4;border-radius:10px;padding:4px;gap:4px}
.x-seg button{height:36px;font-size:12.5px;font-weight:650;color:#606771;border-radius:8px}
.x-seg button.on{color:#111214;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.x-seg .x-n{background:#E24E6B;font-size:10px}
/* ── 버튼 ───────────────────────────────────────────────── */
.x-btn{background:#CE3B54;border-radius:9px;height:44px;font-size:14px;font-weight:700;letter-spacing:-.2px}
.x-btn:active{background:#B8324A}
.x-btn:disabled{background:#EDEEF0;color:#7A8087}
/* v4.12.22 — 입고 반영 진행 표시 */
.x-spin{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid #D6D9DE;border-top-color:#8A9099;animation:xspin .8s linear infinite}
@keyframes xspin{to{transform:rotate(360deg)}}
.x-btn2{border:1px solid #E9E9E7;border-radius:9px;height:40px;font-size:12.5px;font-weight:650;color:#3C4249}
.x-btn2:active{background:#F4F5F6}
.x-lnk{color:#5B6169;font-size:12px;font-weight:600}
/* ── 검색 ───────────────────────────────────────────────── */
.x-search{border:1px solid #E9E9E7;border-radius:9px;height:42px;padding:0 11px}
.x-search .x-i{width:16px;height:16px;color:#6E747B}
.x-search input{font-size:14px}
.x-search input::placeholder{color:#A9AEB5}
.results{border:1px solid #E9E9E7;border-radius:12px;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.result{border-bottom:1px solid #F0F0F0}
.result .plus{background:#F4F5F6;color:#3C4249}
/* ── 홈: B안 매출 카드 ──────────────────────────────────── */
.x-kpi{padding:14px 15px 12px}
.x-kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.x-kpi-l{font-size:11.5px;font-weight:650;color:#8A9099;letter-spacing:.1px}
.x-kpi-v{font-size:31px;font-weight:780;letter-spacing:-1.2px;line-height:1.12;margin-top:4px;color:#111214;font-variant-numeric:tabular-nums}
.x-kpi-v em{font-style:normal;font-size:16px;font-weight:650;color:#5B6169;margin-left:2px}
.x-kpi-s{font-size:11.5px;font-weight:600;color:#5B6169;margin-top:7px;line-height:1.45;font-variant-numeric:tabular-nums}
.x-kpi.mut .x-kpi-v{color:#5B6169}
.x-bars{display:flex;align-items:flex-end;gap:4px;height:44px;margin-top:12px}
.x-bars i{flex:1;min-width:4px;background:#F6D8DF;border-radius:3px 3px 0 0}
.x-bars i.hi{background:#E24E6B}
.x-barlbl{display:flex;justify-content:space-between;font-size:10px;color:#8A9099;margin-top:5px;font-variant-numeric:tabular-nums}
.x-kpi-f{display:flex;align-items:center;gap:6px;width:100%;margin-top:12px;padding:11px 0 1px;border:0;border-top:1px solid #F0F0F0;background:none;color:#5B6169;font-size:12px;font-weight:600;text-align:left}
.x-kpi-f span{flex:1}
.x-kpi-f .x-i{width:15px;height:15px;color:#C3C6CC}
/* 판매메뉴 이름은 줄임표 대신 두 줄까지 — 직원이 메뉴를 잘못 고르지 않게 */
.x-mrow-n{align-items:flex-start;line-height:1.32}
.x-mrow-n i{white-space:normal;overflow:visible;text-overflow:clip;word-break:keep-all;overflow-wrap:anywhere}
.x-mrow .x-bg.new{align-self:center}
/* ── 재고 줄 ─────────────────────────────────────────────── */
.x-row{border-top:1px solid #F0F0F0}
.x-row.done{background:#FCFCFD}
.u-row{padding:11px 14px 12px}
.u-n{font-size:13.5px;font-weight:600;letter-spacing:-.1px}
.u-m{font-size:10.5px;color:#6E747B}
.u-g{align-items:baseline;flex-wrap:wrap;gap:4px 9px;margin-top:7px}
.u-c .k{font-size:9.5px;font-weight:700;color:#7A8087;letter-spacing:0}
.u-c .v{font-size:12.5px;font-weight:700}
.u-c .s{font-size:9px;font-weight:600;color:#7A8087}
.u-c.close .k{color:#5B6169}
.u-c.close .v{font-size:16px;font-weight:750;letter-spacing:-.4px;color:#111214}
.u-c.close .s{font-size:9.5px}
.u-c.use{border:1px dashed #DFE2E6;background:#FAFBFC;border-radius:8px;padding:2px 7px 3px}
.u-c.use.on{border-style:solid;border-color:#EFBFC9;background:#FDF2F5}
.u-c.use .k,.u-c.use .v{color:#3C4249}
/* v4.11.0 — 재고 줄 계층: 품목명 → 실재고 큰 숫자 → 근거(기준·입고·사용량) */
.u-now{display:flex;align-items:baseline;gap:7px;margin-top:9px;flex-wrap:wrap}
.u-now .k{font-size:10px;font-weight:700;color:#8A9099;letter-spacing:-.1px}
.u-now .v{font-size:19px;font-weight:750;letter-spacing:-.5px;color:#111214;font-variant-numeric:tabular-nums;line-height:1.15}
.u-now .v.na{color:#7A8087;font-weight:650}
.u-now.low .v{color:#C43350}
.u-now .s{font-size:10.5px;font-weight:600;color:#6E747B}
.u-now .s.warn{color:#A9690A}
.u-g{margin-top:7px;gap:4px 10px}
.u-g .u-c .k{font-size:9px;color:#7A8087}
.u-g .u-c .v{font-size:11px;font-weight:700}
.u-g .u-c .s{font-size:9px;color:#8A9099}
.u-g .u-c.use{padding:1px 6px 2px;border-radius:7px}
.u-g .u-c.use .k{color:#5B6169}
.u-g .u-c.use .v{font-size:11px}
.u-note{font-size:10.5px;color:#8A9099;line-height:1.5}
.x-qin{border:1px solid #E9E9E7;border-radius:9px;background:#fff}
.x-qin:focus{border-color:#CE3B54;background:#fff;box-shadow:0 0 0 3px rgba(226,78,107,.12)}
.x-qin.has{border-color:#C3C6CC;background:#fff}
.u-f em{color:#8A9099;font-size:9.5px;font-weight:600}
/* ── 발주 줄 ─────────────────────────────────────────────── */
.x-ol{border-top:1px solid #F0F0F0;padding:11px 14px}
.x-ol-n{font-size:13.5px;font-weight:600}
.x-ol-m{font-size:11px;color:#6E747B}
.x-ol-ref{font-size:10.5px;color:#6E747B}
.x-sub{background:#FAFAFA;border-top:1px solid #F0F0F0;color:#8A9099;font-weight:650;padding:8px 14px 6px}
.x-stepper{border:1px solid #E9E9E7;border-radius:9px;height:38px}
.x-stepper button{background:#F5F6F7;color:#3C4249;width:34px}
.x-stepper button:active{background:#ECEDEF}
.x-stepper input{width:44px;border-left:1px solid #E9E9E7;border-right:1px solid #E9E9E7;font-size:14px;font-weight:700}
.x-amt{font-size:13px;font-weight:700}
.x-amt.nil{color:#7A8087}
/* ── 하단 액션 바 ────────────────────────────────────────── */
.x-act{background:#fff;border-top:1px solid #E9E9E7;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.x-act-t b{font-size:13px;font-weight:700}
.x-act-t span{font-size:10.5px;color:#6E747B}
/* ── 하단 탭 ─────────────────────────────────────────────── */
.x-tabs{background:#fff;border-top:1px solid #E9E9E7;box-shadow:none}
.x-tab{height:56px;gap:3px;color:#6E747B;font-size:10.5px;font-weight:600}
.x-tab.on{color:#CE3B54}
/* ── 시트 ───────────────────────────────────────────────── */
#xsheet{background:#FAFAFA}
.x-sh-h{background:#fff;border-bottom:1px solid #E9E9E7}
.x-sh-h b{font-size:15.5px;font-weight:700}
.x-back{color:#3C4249}
.x-hint{background:#FDF3E2;border:1px solid #F3DFC2;color:#7C5A17;border-radius:10px}
.x-hint.ok{background:#E9F5EF;border-color:#CFE8DC;color:#1B6A4D}
