function lockDigest(txt){
  var enc = null, p = null;
  try{ enc = new TextEncoder().encode(txt); }catch(e){ enc = null; }
  if(enc && typeof Promise !== 'undefined' && window.crypto && window.crypto.subtle && window.crypto.subtle.digest){
    try{ p = window.crypto.subtle.digest('SHA-256', enc); }catch(e){ p = null; }
    if(p && typeof p.then === 'function'){
      return p.then(function(buf){
        var b = new Uint8Array(buf), s = '', i;
        for(i = 0; i < b.length; i++) s += ('0' + b[i].toString(16)).slice(-2);
        return s;
      }).catch(function(){ return lockSha256Hex(txt); });
    }
  }
  var hex = lockSha256Hex(txt);
  return (typeof Promise !== 'undefined') ? Promise.resolve(hex) : hex;
}

/* 홈은 S.live를 그리므로, 매출이 늦게 도착하면 홈도 다시 그려야 한다
 * (v4.11.2는 'live' 탭에서만 다시 그렸다 — 홈 첫 화면이 '불러오는 중'으로 남던 원인). */
function loadLive(silent){
  if(S.liveLoading) return;
  S.liveLoading = true;
  S.liveErr = null;
  /* v4.12.33 — 스크립트 맨 앞에서 보낸 매출 요청이 있으면 그 응답을 쓴다(두 번 보내지 않는다). */
  var lp = (function(){
    try{
      if(__okgilEarly && __okgilEarly.live && !__okgilEarly.usedLive){
        __okgilEarly.usedLive = true;
        return __okgilEarly.live.then(function(r){ return (r && r.ok) ? r.v : call('getLive'); });
      }
    }catch(e0){}
    return call('getLive');
  })();
  lp.then(function(res){
    if(!res || res.ok === false) throw new Error((res && (res.error || res.reason)) || '자료를 받지 못했습니다');
    var prev = {};
    var had = !!(S.live && S.live.orders && S.live.orders.length);
    if(had){ (S.live.orders || []).forEach(function(o){ prev[o.id] = 1; }); }
    var fresh = {};
    if(had){ (res.orders || []).forEach(function(o){ if(!prev[o.id]) fresh[o.id] = 1; }); }
    S.liveNewIds = fresh;
    var before = S.liveSig;
    var wasCached = !!S.liveCached;          /* v4.12.24 — 저장값으로 그린 화면이면 이번에 한 번 다시 그린다 */
    S.liveSig = liveSig(res);
    S.live = res;
    S.liveCached = false;
    S.liveLoading = false;
    S.liveAt = Date.now();
    /* 값이 그대로면 다시 쓰지 않는다 — 2분마다 저장소에 쓰는 일을 줄인다. */
    if(wasCached || !before || before !== S.liveSig){
      snapSave(LS_LIVE_SNAP, { at: Date.now(), ver: APP_VER, res: res });
    }
    if(wasCached){
      render();
    } else if(S.tab === 'home'){
      if(before && before === S.liveSig) liveTouchStrip(); else render();
    } else if(S.tab === 'live'){
      if(before && before === S.liveSig) liveTouchStrip(); else render();
    } else syncChrome();
  }).catch(function(e){
    S.liveLoading = false;
    S.liveErr = errMsg(e);
    if(S.tab === 'live' || S.tab === 'home') render(); else syncChrome();
    if(!silent) toast('매장현황 갱신 실패 — ' + S.liveErr, 'err');
  });
}

function xHomeSales(){
  if(lockOn()) return xHomeLocked();          /* v4.12.16 — 잠금이면 금액 대신 자물쇠 */
  if(!S.live){
    if(S.liveErr){
      return '<div class="b-hero"><div class="l">오늘 매출</div>'
        + '<div class="b-bigv" style="font-size:34px;letter-spacing:-1.4px">—</div>'

        + '<button class="b-more" data-act="liveRefresh"><span>다시 시도</span>' + ic('chev') + '</button></div>';
    }
    return '<div class="b-hero"><div class="l">오늘 매출</div>'
      + '<div class="b-bigv" style="font-size:34px;letter-spacing:-1.4px">불러오는 중…</div>'
      + '<div class="b-herometa">잠시만 기다려 주세요</div></div>';
  }
  if(S.live.empty){
    return '<div class="b-hero"><div class="l">오늘 매출</div>'
      + '<div class="b-bigv">0<em>원</em></div>'
      + '<div class="b-herometa">아직 수집된 매출이 없습니다</div></div>';
  }
  var t = S.live.today || {};
  var stale = liveStale();
  var rawTot = Number(t.total || 0);
  var tot = stale ? 0 : rawTot, del = stale ? 0 : Number(t.delivery || 0);
  var hall = stale ? 0
    : ((t.hall === null || t.hall === undefined) ? Math.max(0, tot - del) : Number(t.hall));
  var bl = liveBizLabel(S.live.biz || {});
  var sub;
  if(stale){
    sub = '아직 오늘 매출 없음' + (rawTot > 0 ? ' · 어제 마감 ' + fmtNum(rawTot) + '원' : '');
  } else if(tot > 0){
    sub = Number(t.cnt || 0) + '건 · 객단가 ' + fmtNum(t.aov) + '원 · 홀 ' + fmtNum(hall) + '원 / 배달 ' + fmtNum(del) + '원';
  } else {
    sub = '영업 전 · 아직 매출이 없습니다';
  }
  /* v4.12.24 — 저장해 둔 값으로 먼저 그린 경우, 언제 수집된 값인지 밝힌다. */
  if(S.liveCached && !stale){
    var hj = liveGenHHMM();
    if(hj) sub += ' · ' + hj + ' 수집';
  }
  /* 시간대 미니 막대 — 매출이 있는 시간대만, 두 시간대 미만이면 그리지 않는다 */
  var bars = '', lbl = '', hv = [];
  if(!stale){
    (S.live.hourly || []).forEach(function(r){
      var v = Number(r.total || 0);
      if(v > 0) hv.push({ h: Number(r.from), v: v });
    });
  }
  if(hv.length >= 2){
    var mx = 0;
    hv.forEach(function(x){ if(x.v > mx) mx = x.v; });
    hv.forEach(function(x){
      /* v4.12.7 — 시간대 색: 오전 골드 · 점심 코랄 · 오후 민트 · 저녁 라일락 / 최고 시간대 흰색 */
      var hb = x.h < 11 ? 'am' : (x.h < 14 ? 'lunch' : (x.h < 17 ? 'pm' : 'eve'));
      bars += '<i class="hb ' + hb + (x.v === mx ? ' hi' : '') + '" style="height:' + Math.max(5, Math.round(x.v / mx * 100)) + '%"></i>';
    });
    var mid = hv[Math.floor((hv.length - 1) / 2)].h, last = hv[hv.length - 1].h;
    lbl = '<div class="b-hlg"><span class="am">오전</span><span class="lunch">점심</span>'
      + '<span class="pm">오후</span><span class="eve">저녁</span><span class="pk">최고</span></div>'
      + '<div class="b-hx"><span>' + hv[0].h + '시</span>'
      + (mid !== hv[0].h && mid !== last ? '<span>' + mid + '시</span>' : '')
      + '<span>' + last + '시</span></div>';
  }
  return '<div class="b-hero">'
    + '<div class="l">오늘 매출</div>'
    + '<div class="b-bigv">' + fmtNum(tot) + '<em>원</em></div>'
    + '<div class="b-herometa">' + esc(sub) + '</div>'
    + (bars ? '<div class="b-hbars">' + bars + '</div>' + lbl : '')
    + xLockRow()                                /* v4.12.16 — 남은 시간 + 잠그기 */
    + '<button class="b-more" data-act="xSheet" data-v="today"><span>오늘 현황 자세히 보기</span>' + ic('chev') + '</button>'
    + '</div>';
}

    if(!sh.length){
      return h + '<div class="x-card"><div class="x-empty"><b>부족 품목 없음</b>모든 품목이 안전재고 이상입니다</div></div>';
    }
    h += '<div class="x-card">';
    sh.forEach(function(s){
      h += '<button class="x-li" data-act="xGoStock" data-name="' + esc(s.n) + '">'
        + '<div class="x-li-t"><b>' + esc(s.n) + '</b><span>실재고 ' + xQty(s.cur, s.it)
        + ' · 안전재고 ' + xQty(s.sf, s.it) + '</span></div>'
        + '<div class="x-li-r"><i class="x-bg bad">' + xQty(s.lack, s.it) + ' 부족</i></div></button>';
    });
    h += '</div><div class="x-note">줄을 누르면 그 품목의 실사 화면으로 넘어갑니다.</div>';
    return h;
  }

  var list = bAuditList();
  if(!list.length){
    return h + '<div class="x-card"><div class="x-empty"><b>실사 목록이 없습니다</b>새로고침한 뒤 다시 열어 주세요</div></div>';
  }
  if(S.xIdx >= list.length) S.xIdx = 0;
  if(S.xIdx < 0) S.xIdx = 0;
  try{ document.body.setAttribute('data-b-flow', S.xFlow ? '1' : '0'); }catch(e){}
  return h + (S.xFlow ? bStockFlow(list) : bStockList(list));
}

/* 품목 1개 = 화면 1장 */
function bStockFlow(list){
  var i = S.xIdx, n = list.length;
  var it = list[i];
  var m = uModel(it);
  var filled = touchedQty(it.n) !== null;
  var v = filled ? valueOf(it) : '';
  var done = 0;
  list.forEach(function(x){ if(touchedQty(x.n) !== null) done++; });
  var sf = num(it.sf);
  var low = (m.close !== null && sf !== null && sf > 0 && m.close < sf);
  var zone = String(it.z || '');
  var p0 = packOfItem(it);
  var pk = (p0 && p0.k !== 'ea') ? p0 : null;
  var nm = esc(it.n);

  var cmp = '<div class="cmp"><b>실재고 ' + (m.close === null ? '—' : uQtyFull(m.close, it)) + '</b>'
    + '기준 ' + (m.base === null ? '—' : uQty1(m.base, it))
    + ' · 입고 ' + (m.inb ? uInbTxt(m.inb, it) : '0') + '<br>'
    + '로스 ' + (m.loss ? uQty1(m.loss, it) : '0')
    + ' · 사용량 ' + (m.use === null ? '—' : uQty1(m.use, it))
    + (low ? '<br><i>안전재고 ' + xQtyC(sf, it) + ' 미달</i>' : '')
    + '</div>';

  var big, split = '';
  if(pk){
    var sp = filled ? qtySplit(v, pk) : null;
    big = '<div class="b-bigv2' + (filled ? '' : ' na') + '" id="bBigV" data-name="' + nm + '">'
      + (filled ? (fmtNum(num(v)) + '<u>' + esc(pk.label) + '</u>') : '—') + '</div>';
    split = '<div class="b-pk">'
      + '<label><input class="x-qin x-qs" id="bBigP" type="text" inputmode="decimal" autocomplete="off"'
      + ' data-name="' + nm + '" data-bpart="b" value="' + esc(sp ? sp.b : '') + '"'
      + ' placeholder="0" aria-label="' + nm + ' ' + esc(pk.label) + ' 수"><em>' + esc(pk.label) + '</em></label>'
      + '<label><input class="x-qin x-qs" type="text" inputmode="decimal" autocomplete="off"'
      + ' data-name="' + nm + '" data-bpart="e" value="' + esc(sp ? sp.e : '') + '"'
      + ' placeholder="—" aria-label="' + nm + ' 낱개(' + esc(pk.u) + ') 수"><em>' + esc(pk.u) + '</em></label>'
      + '</div>';
  } else {
    big = '<input class="b-biginp q" id="bBigQ" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"'
      + ' data-name="' + nm + '" value="' + esc(v) + '" placeholder="숫자 입력"'
      + ' aria-label="' + nm + ' 현장 실사 수량">';
  }

  var h = '<div class="b-stk">';
  h += '<div class="b-pg"><div class="r"><b id="bDone">' + done + '<em>/' + n + '</em></b>'
    + '<span id="bLeft">' + (zone ? esc(zone) + ' · ' : '') + '남은 ' + (n - done) + '품목</span></div>'
    + '<div class="bar"><i id="bBar" style="width:' + bPct(done, n) + '%"></i></div></div>';

  h += '<div class="b-card"><div class="nm">' + nm + '</div>'
    + '<div class="sp">' + esc([it.spec || '', zone, it.note || ''].filter(function(x){ return !!x; }).join(' · ')) + '</div>'
    + '<div class="val">' + big + cmp + '</div>'
    + split
    + '<div class="df" id="bDiff">' + (filled ? xDiffTag(m.close, v, it) : '') + '</div>'
    + '</div>';

  h += '<div class="b-side">';      /* v4.12.3 — 다음 품목 + 이동 버튼 묶음 */
  var nxt = list.slice(i + 1, i + 4);
  if(nxt.length){
    h += '<div class="b-next"><div class="t">이 구역 다음 품목</div>';
    nxt.forEach(function(x){
      var mm = uModel(x);
      h += '<div class="r"><b>' + esc(x.n) + '</b><span>실재고 ' + (mm.close === null ? '—' : uQty1(mm.close, x)) + '</span></div>';
    });
    h += '<div class="hint">입력하고 다음을 누르면 이 순서로 넘어갑니다</div></div>';
  }

  h += '<div class="b-nav">'
    + '<button class="gh" data-act="xbPrev"' + (i === 0 ? ' disabled' : '') + '>' + ic('back') + '이전</button>'
    + '<button class="go" data-act="xbNext">' + (i === n - 1 ? '마지막 품목 · 앞으로' : '입력하고 다음') + ic('chev') + '</button>'
    + '</div>';
  h += '</div>';                    /* /b-side */
  return h + '</div>';
}

/* 목록 — 한 눈에 보고 고칠 때 */

      : '<div class="u-in"><div class="u-split"><input class="x-qin q' + (filled ? ' has' : '') + '" type="text"'

      + '<button class="b-jump" data-act="xbJump" data-v="' + i + '" style="flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;color:inherit;font-family:inherit">'

  return h;

/* 큰 숫자·진행률을 입력하는 대로 갱신 */
function updateProgress(){
  var list = bAuditList();
  var done = 0;
  list.forEach(function(it){ if(touchedQty(it.n) !== null) done++; });
  var total = list.length;
  var pct = bPct(done, total);
  var bar = $('#progressBar');
  if(bar) bar.style.width = pct + '%';
  var txt = $('#progressText');
  if(txt) txt.textContent = total ? (done + '/' + total + ' 입력') : '실사 품목 없음';
  var bd = $('#bDone');
  if(bd) bd.innerHTML = done + '<em>/' + total + '</em>';
  var bb = $('#bBar');
  if(bb) bb.style.width = pct + '%';
  var bl = $('#bLeft');
  if(bl){
    var i0 = Math.max(0, Math.min(total - 1, S.xIdx || 0));
    var z0 = list[i0] ? String(list[i0].z || '') : '';
    bl.textContent = (z0 ? z0 + ' · ' : '') + '남은 ' + Math.max(0, total - done) + '품목';
  }
    var bv = $('#bBigV');
    if(bv){
      var nm = bv.getAttribute('data-name');
      var itB = itemByName(nm);
      var q = touchedQty(nm);
      var pB = itB ? packOfItem(itB) : null;
      if(pB && pB.k === 'ea') pB = null;
      if(q === null){ bv.className = 'b-bigv2 na'; bv.innerHTML = '—'; }
      else { bv.className = 'b-bigv2'; bv.innerHTML = fmtNum(q) + (pB ? '<u>' + esc(pB.label) + '</u>' : ''); }
    }
    var df = $('#bDiff');
    if(df){
      var bq = $('#bBigQ');
      var dnm = bq ? bq.getAttribute('data-name') : (bv ? bv.getAttribute('data-name') : '');
      var dIt = dnm ? itemByName(dnm) : null;
      var dQ = dnm ? touchedQty(dnm) : null;
      var dM = dIt ? uModel(dIt) : null;
      df.innerHTML = (dQ !== null && dM) ? xDiffTag(dM.close, dQ, dIt) : '';
    }
  xSaveBar();
}

/* 다음/이전 품목으로 — 입력값은 이미 S.touched/S.cur에 있으므로 이동만 한다 */
function bFocusNow(){
  var el = $('#bBigQ') || $('#bBigP');
  if(!el) return;
  try{ el.focus(); if(el.select) el.select(); }catch(e){}
}
function bGoStep(d){
  var list = bAuditList();
  if(!list.length) return;
  if(!S.xFlow){ S.xFlow = true; }
  var i = (S.xIdx || 0) + d;
  if(i < 0) i = 0;
  if(i > list.length - 1){
    toast('마지막 품목입니다 · 아래 [저장]을 누르면 시트에 기록됩니다', 'ok');
    i = list.length - 1;
  }
  S.xIdx = i;
  render();
  var mn = $('#main');
  if(mn) mn.scrollTop = 0;
  bFocusNow();
}

/* ================================================================ 발주 */
function renderOrder(){
  bTabMark();
  xPrefillOrder();
  var t = orderTotals();
  var need = 0;
  orderRows().forEach(function(r){ if(xOrdGroup(r) === 'need') need++; });
  var h = '';
  if(S.xLastOrder){
    h += '<div class="x-hint ok">' + ic('check') + '<div><b>발주 신청 완료</b>'
      + S.xLastOrder.n + '품목 · ' + fmtNum(S.xLastOrder.sum) + '원 · ' + esc(S.xLastOrder.at)
      + '<div style="margin-top:2px">도착하면 [입고 확인]에서 반영하세요.</div></div></div>';
  }
  h += bOrderHead(t, need);
  var inc = xInboundCard();
  if(inc) h += inc;
  h += '<div class="x-sw"><div class="x-search">' + ic('search')
    + '<input type="text" id="xOrdQ" placeholder="발주 품목 검색" value="' + esc(S.xOrdQ || '') + '" autocomplete="off">'
    + '</div></div>';
  h += '<div id="xOrdBody">' + xOrderListBody() + '</div>';
  h += '<div class="x-note">부족은 안전재고에 모자란 양입니다. 목표재고는 주간소진 × 1.2(약 8일분)이고 안전재고가 더 크면 그 값이 하한입니다. '
    + '발주불가 ' + blockedCount() + '종은 목록에서 제외했습니다. 금액은 부가세 포함입니다.'
    + (PRICE_TBD.length ? ' 단가 미확인 ' + PRICE_TBD.length + '품목(' + PRICE_TBD.join('·') + ')은 본사 출고가가 아직 공개되지 않아 금액을 비워 두었습니다.' : '') + '</div>';
  return h;
}
function bOrderHead(t, need){
  var nx = xNextCut();
  var rt = xRecTotal();
  var dl;
  if(nx){
    dl = '<div class="dl">' + ic('clock') + '<b>' + esc(nx.label) + ' ' + esc(nx.cutText) + ' 마감</b>'
      + '<span>' + xLeft(nx.leftMin) + ' 남음 · ' + ofEtaLabel(nx.eta) + ' 입고</span></div>';
  } else if(S.flow){
    dl = '<div class="dl">' + ic('clock') + '<b>지금은 발주 마감 시간이 아닙니다</b><span>다음 발주일에 신청</span></div>';
  } else {
    dl = '<div class="dl">' + ic('clock') + '<b>' + (S.flowErr ? '발주 일정을 불러오지 못했습니다' : '발주 일정을 불러오는 중…') + '</b><span></span></div>';
  }
  var tbdNote = t.tbd ? '<i class="tbd">단가 미확인 ' + t.tbd + '품목 제외</i>' : '';
  var recTbd = rt.tbd ? ' · 단가 미확인 ' + rt.tbd + '품목' : '';
  return '<div class="b-ordhead">'
    + '<div class="sum"><div class="n">' + fmtNum(t.sum) + '<em>원</em>' + tbdNote + '</div>'
    + '<div class="rt"><b>' + t.count + '품목 입력</b>추천 ' + rt.cnt + '품목 · ' + fmtNum(rt.sum) + '원' + recTbd + '</div></div>'
    + dl + '</div>';
}
function xOrderListBody(){
  var rows = orderRows();
  if(!rows.length){
    return '<div class="x-card"><div class="x-empty"><b>발주 가능 품목 없음</b>발주 가능한 품목이 없습니다</div></div>';
  }
  var q = String(S.xOrdQ || '').trim().toLowerCase();
  var groups = { new: [], need: [], near: [], rest: [] };
  rows.forEach(function(r){
    if(q && String(r.n || '').toLowerCase().indexOf(q) < 0) return;
    groups[xOrdGroup(r)].push(r);
  });
  groups.need.sort(function(a, b){
    var sa = (a.sf && a.sf > 0) ? a.sf : 1;
    var sb = (b.sf && b.sf > 0) ? b.sf : 1;
    return (xSafeLack(b) / sb) - (xSafeLack(a) / sa);
  });
  groups.near.sort(function(a, b){ return xRecGap(b) - xRecGap(a); });
  var h = '';
  var heads = [
    ['new', xOrdNewHead(groups.new)],
    ['need', '부족 ' + groups.need.length + '품목 · 안전재고 미달'],
    ['near', '목표 미달 ' + groups.near.length + '품목 · 약 8일분'],
    ['rest', '그 외 ' + groups.rest.length + '개 · 재고 충분']
  ];
  heads.forEach(function(hd){
    var list = groups[hd[0]];
    if(!list.length) return;
    h += '<div class="b-sub" data-sec="' + hd[0] + '">' + hd[1] + '</div><div class="b-grp">';
    list.forEach(function(r){ h += xOrderRow(r); });
    h += '</div>';
  });
  if(!groups.new.length && !groups.need.length && !groups.near.length){
    h += '<div class="x-note" style="padding:10px 3px">'
      + (q ? '검색 결과에 부족 품목이 없습니다.' : '부족 품목이 없습니다. 필요하면 아래 목록에서 골라 발주하세요.')
      + '</div>';
  }
  h += '<div class="x-note" style="padding:8px 3px 2px">수량은 0에서 시작합니다. 참고 줄을 보고 필요한 만큼만 넣으면 그 품목만 신청됩니다. '
    + '포장 품목은 박스·팩 단위로 입력합니다(예: 0.5 = 반 박스).</div>';
  return h;
}
function xOrderRow(r){
  var q = S.ord.hasOwnProperty(r.n) ? num(S.ord[r.n]) : 0;
  if(q === null) q = 0;
  var pk = packOf(r.n, r.u || r.spec);
  var meta = [];
  if(pk) meta.push('1' + pk.label + ' = ' + perLabel(pk));
  else if(r.u || r.spec) meta.push(r.u || r.spec);
  if(r.price !== null) meta.push(fmtWon(r.price));   /* v4.12.5 — fmtWon 이 이미 '원'을 붙인다 */
  else if(isPriceTbd(r.n)) meta.push('단가 미확인');  /* v4.12.9 — 단가를 지어내지 않는다 */
  var amt = (r.price === null || q <= 0) ? null : Math.round(q * r.price);
  var lack = xSafeLack(r);
  var ref = '이론재고 ' + (r.cur === null ? '미확인' : esc(xRefQ(r.cur, r)));
  if(r.sf !== null && r.sf > 0) ref += ' · 안전 ' + esc(xRefQ(r.sf, r));
  if(lack > 0) ref += ' · <u>부족 ' + esc(xRefQ(lack, r)) + '</u>';
  else if(xRecGap(r) > 0) ref += ' · 목표까지 ' + esc(xRefQ(xRecGap(r), r));
  else if(r.cur !== null) ref += ' · 충분';
  return '<div class="b-oi' + (q > 0 ? ' on' : '') + '" data-name="' + esc(r.n) + '">'
    + '<div class="tx"><b>' + esc(r.n) + '</b>'
    + '<span>' + esc(meta.join(' · ')) + '</span>'
    + dcItemTag(r.n) + '</div>'
    + '<div class="b-stp">'
    + '<button data-act="ordStep" data-name="' + esc(r.n) + '" data-d="-1" aria-label="' + esc(r.n) + ' 줄이기">' + ic('minus') + '</button>'
    + '<input class="oqin" inputmode="decimal" data-name="' + esc(r.n) + '" data-i="' + r.i + '" value="' + esc(q) + '" aria-label="' + esc(r.n) + ' 발주 수량">'
    + '<button class="p" data-act="ordStep" data-name="' + esc(r.n) + '" data-d="1" aria-label="' + esc(r.n) + ' 늘리기">' + ic('plus') + '</button>'
    + '</div>'
    + '<div class="amt' + (amt === null ? ' nil' : '') + '" data-amt="' + r.i + '" data-name="' + esc(r.n) + '">'
    + (amt === null ? (isPriceTbd(r.n) ? (q > 0 ? '단가 미확인' : '') : (r.price === null ? '단가 없음' : '')) : fmtNum(amt) + '원') + '</div>'
    + '<div class="rf">' + ref + '</div>'
    + '</div>';
}

    return false;
  });
  h += '<div class="x-chips" style="flex-wrap:nowrap;overflow-x:auto;padding:2px 1px 4px">';
  cats.forEach(function(c){
    h += '<button class="x-chip' + (S.menuCat === c ? ' on' : '') + '" data-act="menuCat" data-v="' + esc(c) + '" style="flex:0 0 auto">' + esc(c) + '</button>';
  });
  h += '</div>';
  h += '<div id="menuListBody">' + renderMenuListBody() + '</div>';
  return h;
}
function renderMenuListBody(){
  var q = String(S.menuQ || '').trim().toLowerCase();
  var list = MENU.filter(function(m){
    if(!menuHasCat(m, S.menuCat)) return false;
    if(!q) return true;
    return String(m.n || '').toLowerCase().indexOf(q) >= 0 || String(m.en || '').toLowerCase().indexOf(q) >= 0;
  });
  if(!list.length){
    return '<div class="x-card"><div class="x-empty"><b>검색 결과 없음</b>다른 이름으로 찾아보세요</div></div>';
  }
  var lim = S.menuLimit || 40;
  var h = '<div class="b-mgrid">' + list.slice(0, lim).map(bMenuCard).join('') + '</div>';
  h += '<div class="b-mgrid-note">' + list.length + '개 메뉴 · 사진을 누르면 레시피가 열립니다</div>';
  if(list.length > lim){
    h += '<div style="padding:10px 0 2px"><button class="x-btn2" style="width:100%" data-act="xMoreMenu">더 보기 ('
      + (list.length - lim) + '개)</button></div>';
  }
  return h;
}
function bMenuCard(m){
  var meta = [];
  if(m.temp) meta.push(m.temp);
  if(m.cat) meta.push(m.cat);
  var canR = hasRecipe(m.n);
  var img = m.img
    ? '<img src="' + esc(m.img) + '" alt="" loading="lazy" decoding="async"'
      + ' onerror="var p=this.parentNode;this.remove();if(p)p.classList.add(\'noimg\')">'
    : '<div class="phx">사진 없음</div>';
  return '<button class="b-mcard"' + (canR ? ' data-act="recipe" data-name="' + esc(m.n) + '"' : '') + '>'
    + '<div class="ph">' + img + (m.isNew ? '<span class="tg">NEW</span>' : '') + '</div>'
    + '<div class="cp"><b>' + esc(m.n) + '</b>'
    + '<div class="r"><span>' + esc(meta.join(' · ')) + '</span><em>' + fmtWon(m.p) + '</em></div>'
    + dcMenuTag(m.n)
    + '</div></button>';
}

/* ================================================================ 동작 */
document.addEventListener('click', function(ev){
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if(!el) return;
  var act = el.getAttribute('data-act') || '';
  if(act.indexOf('xb') !== 0) return;
  var v = el.getAttribute('data-v');
  if(act === 'xbNext'){ bGoStep(1); }
  else if(act === 'xbPrev'){ bGoStep(-1); }
  else if(act === 'xbJump'){
    var i0 = Number(v);
    if(!isNaN(i0)) S.xIdx = i0;
    S.xFlow = true;
    render();
    var mn = $('#main');
    if(mn) mn.scrollTop = 0;
    bFocusNow();
  }
  else if(act === 'xbList'){ S.xFlow = !S.xFlow; render(); }
  else if(act === 'xbStart'){
    S.xFlow = true;
    if(S.tab !== 'stock' || S.xSeg !== 'audit'){ S.xSeg = 'audit'; setTab('stock'); }
    render();
    var m2 = $('#main');
    if(m2) m2.scrollTop = 0;
    bFocusNow();     /* 탭 누른 그 손가락 안에서 포커스 → iOS 숫자 키보드가 바로 올라온다 */
  }
  else if(act === 'xbRes'){ S.resSeg = (v || 'notice'); setTab('resources'); }
  else if(act === 'xbLib'){ openLib(); libGroup(Number(v)); }
});

/* 숫자 키패드의 Enter/이동 — 입력하고 바로 다음 품목 */
document.addEventListener('keydown', function(ev){
  if(ev.key !== 'Enter') return;
  var t = ev.target;
  if(!t || !t.getAttribute) return;
  if(t.id === 'bBigQ' || t.getAttribute('data-bpart')){
    ev.preventDefault();
    bGoStep(1);
  }
});

/* 발주 카드 — 수량이 들어간 카드는 테두리로 표시 · 헤더 합계도 같이 센다 */
function bSyncOrdHead(){
  var t = orderTotals();
  var n1 = document.querySelector('.b-ordhead .n');
  /* v4.12.11 — 수량을 입력하는 동안에도 단가 미확인 품목을 합계에서 뺐다는 표시를 유지한다. */
  if(n1) n1.innerHTML = fmtNum(t.sum) + '<em>원</em>'
    + (t.tbd ? '<i class="tbd">단가 미확인 ' + t.tbd + '품목 제외</i>' : '');
  var c1 = document.querySelector('.b-ordhead .rt b');
  if(c1) c1.textContent = t.count + '품목 입력';
}
function bPackInput(el){
  var nm = el.getAttribute('data-name');
  var it = itemByName(nm);
  if(!it) return;
  var p = packOfItem(it);
  if(!p) return;
  var clean = String(el.value || '').replace(/[^0-9.]/g, '');
  var dot = clean.indexOf('.');
  if(dot >= 0) clean = clean.slice(0, dot + 1) + clean.slice(dot + 1).replace(/\./g, '');
  if(clean !== el.value){ el.value = clean; }
  var card = el.closest ? el.closest('.b-card') : null;
  var bEl = card ? card.querySelector('[data-bpart="b"]') : null;
  var eEl = card ? card.querySelector('[data-bpart="e"]') : null;
  var bs = bEl ? String(bEl.value || '').trim() : '';
  var es = eEl ? String(eEl.value || '').trim() : '';
  if(bs === '' && es === ''){
    delete S.cur[nm];
    delete S.touched[nm];
    updateProgress();
    return;
  }
  var bv = num(bs), ev = num(es);
  var q = (bv === null ? 0 : bv) + ((ev === null ? 0 : ev) / p.n);
  S.cur[nm] = String(Math.round(q * 1000) / 1000);
  S.touched[nm] = true;
  updateProgress();
}
document.addEventListener('input', function(ev){
  var t = ev.target;
  if(!t || !t.getAttribute) return;
  if(t.getAttribute('data-bpart')){ bPackInput(t); return; }
  if(!t.classList || !t.classList.contains('oqin')) return;
  var row = t.closest ? t.closest('.b-oi') : null;
  if(row){
    var n = num(t.value);
    row.classList.toggle('on', !!(n && n > 0));
  }
  bSyncOrdHead();
});
/* 스테퍼(ordStep) 뒤에도 헤더 합계를 맞춘다 — 기존 핸들러는 실행됐을 뿐 화면은 부분 갱신이다. */
document.addEventListener('click', function(ev){
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if(!el) return;
  if(el.getAttribute('data-act') === 'ordStep') setTimeout(bSyncOrdHead, 0);
});

/* ====================================================================
 * v4.12.2 — 레시피 「제조 이미지」에 단계 번호·설명 붙이기 (표현 계층만)
 * --------------------------------------------------------------------
 * 동환 님 지시: "레시피 자료 가로화면은 좋은데 이미지에 내용이 안붙어 있어."
 *   → 제조 이미지(단계 사진이 한 줄로 이어진 띠) 바로 아래에, 사진과 같은
 *     왼쪽→오른쪽 순서로 단계 번호와 설명을 붙인다.
 *
 * 원칙
 *  - 데이터는 이미 있는 RECIPE_DATA 의 v.st 만 읽는다. 새 데이터·API 없음.
 *    (시트 쓰기·발주 신청 경로는 한 줄도 건드리지 않는다)
 *  - 단계 설명이 없으면 아무것도 그리지 않는다 → 사진만 있는 기존 상태.
 *  - 설명이 있으면 [텍스트 레시피 보기] 안의 단계 줄은 빼고, 대신 한 줄 안내만
 *    남긴다(같은 문장이 두 번 보이지 않게).
 * ==================================================================== */

/* 단계 문장 다듬기 — 앞 번호("1. ", "2) ")와 끝 화살표(▶)만 정리하고 내용은 그대로 */
function rstepClean(s){
  var t = String(s === null || s === undefined ? '' : s);
  t = t.replace(/\r/g, '');
  t = t.replace(/^\s*\d+\s*[.)]\s*/, '');
  t = t.replace(/\s*[▶►]\s*$/, '');
  t = t.replace(/[ \t\u00a0]+/g, ' ');
  t = t.replace(/^\s+|\s+$/g, '');
  return t;
}

/* 이 카드의 제조 이미지에 붙일 단계 묶음 — 카드가 한 가지 제조법만 보여 줄 때만 고른다. */
function rstepBandVariant(it, e){
  var v = (e && e.v) || {};
  if(it.t && v[it.t]) return v[it.t];
  var ks = [];
  for (var k in v){ if (Object.prototype.hasOwnProperty.call(v, k)) ks.push(k); }
  if (ks.length === 1) return v[ks[0]];
  return null;
}

/* v4.12.2 — 단계 설명이 사진에 인쇄돼 있지 않은 자료.
   고구마4종·흑임자3종 PDF는 제조 이미지를 「사진만」 잘라 쓰고 있어서
   (사진 아래 단계 글이 잘려 나간다) 그 카드들에만 단계 띠를 붙인다.
   생귤3종·홍콩·바나나처럼 사진과 단계 글이 한 장에 같이 인쇄된 자료는
   띠를 붙이지 않는다(같은 글이 두 번 보이거나, 사진 수와 단계 수가 어긋나기 쉽다). */
var RSTEP_PHOTOS_ONLY_PDF = {
  '고구마4종_레시피_2026-11-30출시': 1,
  '흑임자3종_레시피_2026-11-23출시': 1
};

/* v4.12.2 — 제조 이미지가 『사진만』 있는 카드에만 단계 띠를 붙인다.
   - 자료 종류가 개별 레시피이고,
   - 사진이 띠처럼 얇게 잘렸거나(cr 높이 20% 이하) 사진만 있는 자료이면 붙인다.
   - 한 사진에 HOT·ICE 두 벌이 같이 있는 카드는 어느 사진의 단계인지 정할 수 없어 그대로 둔다. */
function rstepBandFor(it, e){
  if (!it || !it.im || !e) return '';
  if (String(e.s || '') !== '개별 레시피') return '';
  var cr = it.cr || [];
  var strip = (cr.length === 4 && Number(cr[3]) > 0 && Number(cr[3]) <= 0.20);
  if (!strip && !RSTEP_PHOTOS_ONLY_PDF[String(e.pdf || '')]) return '';
  return rstepBand(rstepBandVariant(it, e));
}

/* 제조 이미지 아래 단계 띠 — 설명이 하나도 없으면 '' (기존 화면 그대로) */
function rstepBand(tv){
  var raw = (tv && tv.st) || [];
  var out = [];
  for (var i = 0; i < raw.length; i++){
    var s = rstepClean(raw[i]);
    if (s) out.push(s);
  }
  if (!out.length) return '';
  var h = '<div class="rstep-band">'
        + '<div class="rstep-hd"><b>제조 순서</b><i>사진 왼쪽부터 순서대로</i></div>'
        + '<ol class="rstep-list">';
  for (var j = 0; j < out.length; j++){
    h += '<li><em class="rstep-no">' + (j + 1) + '</em>'
       + '<span class="rstep-tx">' + dshot(esc(out[j])) + '</span></li>';
  }
  h += '</ol></div>';
  return h;
}


/* ====================================================================
 * v4.12.3 — 화면 정리 도우미 (표현 계층만)
 * --------------------------------------------------------------------
 * ① 화면에서 걷어낸 공지 5건 — 목록에서 빼고, 기기에 이미 저장된 사본도
 *    함께 지운다(앱 기본값만 지우면 기기 캐시에 남아 계속 보인다).
 *    원문 데이터는 index_v4.12.2.src 에 그대로 남아 있어 되살릴 수 있다.
 * ② 공지 카드 제목에서 분류 뱃지와 겹치는 접두어([본사공문] 등)를 한 번만 뺀다.
 * ==================================================================== */

var DOC_RETIRED = {
  doc_hq_pos_popup: '11/10 긴급 실행허용 팝업 — 11/10 POS 업데이트 공지가 같은 내용을 담고 있음',
  doc_hq_1331_kiosk_update: '11/06 키오스크 업데이트 완료 — 매장이 할 일 없음',
  doc_hq_1329_corn_lemon: '11/09 출시 완료 — 레시피는 [레시피] 개별 레시피·[매뉴얼]에 그대로 있음',
  doc_hq_1136_tangerine: '11/19 출시 완료 — 레시피는 [레시피] 생귤 3종에 그대로 있음',
  doc_hq_1343_ingredients: '11/16·11/17 발주일 안내 — 기한 지남, 단가·발주일은 발주 탭에 반영됨'
};

function dropRetiredDocs(list){
  var out = [], changed = false;
  (list || []).forEach(function(d){
    if(d && DOC_RETIRED[d.id]){ changed = true; return; }
    out.push(d);
  });
  if(changed){
    try{ hostSet(LS_DOCS, JSON.stringify(out.slice(0, 120))); }catch(e){}
  }
  return out;
}

/* 제목 앞의 분류 접두어([본사공문] 등)를 뺀다 — 바로 위 뱃지와 같은 말이 두 번 보이지 않게.
   앞에 이모지·기호만 있으면 그 이모지는 남기고 태그만 지운다. 다른 말이면 그대로 둔다. */
function docTitleClean(n){
  var t = String((n && n.title) || '');
  var c = String((n && n.cat) || '');
  if(!c) return t;
  var tag = '[' + c + ']';
  var i = t.indexOf(tag);
  if(i < 0) return t;
  var head = t.slice(0, i).replace(/\s+$/, '');
  if(head && !/^[^가-힣A-Za-z0-9]*$/.test(head)) return t;
  return (head + ' ' + t.slice(i + tag.length)).replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
}


/* v4.12.5 — 하위 화면 뒤로가기: 버튼이 없는 화면 보완 + OS/브라우저 뒤로 제스처.
 * 데이터·저장 로직은 건드리지 않는다. */
(function(){
  var pushed = 0;

  function topView(){
    try{
      if(window.S && S.xSheet) return 'sheet';
      var ids = ['#rlib', '#rview', '#rmodal', '#noticePop', '#ordAlert', '#instModal', '#lossModalWrap'];
      for(var i = 0; i < ids.length; i++){
        var e = document.querySelector(ids[i]);
        if(e && !e.hidden) return ids[i];
      }
    }catch(e){}
    return null;
  }

  function closeTop(){
    var t = topView();
    if(!t) return false;
    try{
      if(t === 'sheet'){ S.xSheet = null; xPaintSheet(); }
      else if(t === '#rlib'){ closeLib(); }
      else if(t === '#rview'){ closeViewer(); }
      else if(t === '#rmodal'){ closeRecipe(); }
      else if(t === '#noticePop'){ noticePopAck(); }
      else if(t === '#ordAlert'){ oapClose(); }
      else if(t === '#instModal'){
        var b = document.getElementById('instBk');
        if(b) b.click(); else document.getElementById('instModal').hidden = true;
      }
      else if(t === '#lossModalWrap'){
        var w = document.getElementById('lossModalWrap');
        if(w){ w.hidden = true; w.innerHTML = ''; }
      }
      return true;
    }catch(e){ return false; }
  }

  function sync(){
    var t = topView();
    if(t && !pushed){
      /* v4.12.22 — 이미 우리가 만든 항목이 남아 있으면 또 쌓지 않는다. */
      var mine = false;
      try{ mine = !!(history.state && history.state.pv === 'view'); }catch(e){}
      if(!mine){
        try{ history.pushState({ pv: 'view' }, ''); }catch(e){}
      }
      pushed = 1;
    } else if(!t && pushed){
      /* v4.12.22 — 예전에는 여기서 history.back() 을 불렀다.
       * 시트가 코드로 닫힐 때(입고 반영 성공 등) 그 이동이 앱 프레임의 문서를 건너가
       * 화면이 바깥으로 튕겨 나갔다(iOS 홈화면 앱에서 특히). 이제는 되돌아가지 않고
       * 표시만 지운다. 남은 항목은 다음에 OS 뒤로가기를 누를 때 조용히 소비된다(화면은 그대로). */
      pushed = 0;
    }
  }

  /* 버튼·탭 조작 뒤 한 박자 늦춰 상태를 맞춘다 */
  document.addEventListener('click', function(){ setTimeout(sync, 30); }, true);

  window.addEventListener('popstate', function(){
    if(pushed){ pushed = 0; if(topView()) closeTop(); }
    else if(topView()){ closeTop(); }
  });

  /* 자동으로 뜨는 팝업(공지·발주 마감)도 잡는다 */
  setInterval(sync, 1000);
  if(document.readyState !== 'loading') setTimeout(sync, 800);
  else window.addEventListener('DOMContentLoaded', function(){ setTimeout(sync, 800); });
})();
