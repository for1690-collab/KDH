/* ===== v4.6.4 발주 마감 임박 팝업 =====================================
 * 동환 님 요구(2026-11-11): 발주 마감 1시간 전에 직원들이 웹앱에서 직접 보도록 알린다.
 *   · 우유     — 월~금 09:00 마감 → 08:00~09:00 사이에 앱을 열면 팝업
 *   · 일반 물품 — 화·목·금 14:00 마감 → 13:00~14:00 사이에 앱을 열면 팝업
 * 그날 마감분을 이미 발주했으면(그 발주가 오늘 마감으로 접수되는 건이 있으면) 띄우지 않는다.
 * 기기마다 하루 한 번만. [닫기]·[발주 탭에서 주문] 을 누르면 그날은 다시 띄우지 않는다.
 * 재고(실사)가 입력되어 있으면 권장 수량까지 한 줄 덧붙인다. 미입력이면 마감 안내만.
 *
 * 검증용 시간 강제(직원 화면에는 영향 없음): 서버 doGet 이 ?oaptest=1&key=<갱신키> 일 때만
 *   window.OAP_TEST 를 심는다. 그 값은 ?now=13:30 ?date=2026-11-12 ?reset=1 로 준다.
 *   (앱스 스크립트 화면은 샌드박스 iframe 안에서 돌아 주소의 쿼리를 읽을 수 없어 서버가 넘긴다)
 * ==================================================================== */
var OAP_MILK_ITEM = '바나프레소우유1L(16ea/BX)';
var LS_OAP_SEEN = 'okgil.ordAlertSeen.v1';
var OAP_RULES = {
  milk: { kind:'milk', label:'우유', icon:'🥛', cutMin:540, fromMin:480, toMin:540, days:[1,2,3,4,5],
          cutLabel:'오전 9시', cutText:'09:00' },
  gen:  { kind:'gen', label:'일반 물품', icon:'📦', cutMin:840, fromMin:780, toMin:840, days:[2,4,5],
          cutLabel:'오후 2시', cutText:'14:00' }
};
var OAP_ORDER = ['milk', 'gen'];

function oapParam(k){
  try {
    /* 서버가 ?oaptest=1&key=… 로 심어 준 검증용 값(평상 접속에는 없음) */
    var T = (typeof window !== 'undefined' && window.OAP_TEST) ? window.OAP_TEST : null;
    if(T){
      if(k === 'oapnow' && T.now) return String(T.now);
      if(k === 'oapdate' && T.date) return String(T.date);
      if(k === 'oapreset' && T.reset) return '1';
      if(k === 'oap' && T.off) return 'off';
    }
    var s = String((window.location && window.location.search) || '');
    if(!s) return '';
    var m = new RegExp('[?&]' + k + '=([^&]*)').exec(s);
    return m ? decodeURIComponent(m[1]) : '';
  } catch(e){ return ''; }
}
function oapDow(ymd){
  var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd || ''));
  if(!p) return 0;
  var w = new Date(Date.UTC(+p[1], +p[2] - 1, +p[3])).getUTCDay();
  return w === 0 ? 7 : w;                       /* 1=월 … 7=일 (서버 isoDow_와 같음) */
}
function oapAddDay(ymd, n){
  var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd || ''));
  if(!p) return ymd;
  var t = new Date(Date.UTC(+p[1], +p[2] - 1, +p[3]));
  t.setUTCDate(t.getUTCDate() + n);
  return t.toISOString().slice(0, 10);
}
/** 발주일시('YYYY-MM-DD HH:mm') → 그 건이 접수되는 날. 서버 etaOf_ 와 같은 규칙. */
function oapAccept(rule, at){
  var s = String(at || '');
  var ymd = s.slice(0, 10), hm = s.slice(11, 16);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ymd)) return '';
  var mins = hm ? (+hm.slice(0, 2)) * 60 + (+hm.slice(3, 5)) : 0;
  if(rule.days.indexOf(oapDow(ymd)) >= 0 && mins < rule.cutMin) return ymd;
  for(var i = 1; i <= 12; i++){
    var c = oapAddDay(ymd, i);
    if(rule.days.indexOf(oapDow(c)) >= 0) return c;
  }
  return '';
}
function oapClock(){
  var now = new Date();
  var ymd = todayStr();
  var min = now.getHours() * 60 + now.getMinutes();
  var ov = oapParam('oapnow');
  if(/^\d{1,2}:\d{2}$/.test(ov)){ var a = ov.split(':'); min = (+a[0]) * 60 + (+a[1]); }
  var od = oapParam('oapdate');
  if(/^\d{4}-\d{2}-\d{2}$/.test(od)) ymd = od;
  return { ymd: ymd, min: min, dow: oapDow(ymd) };
}
/** 지금이 어느 품목군의 '마감 1시간 전 창'인가. 아니면 null. */
function oapTarget(){
  var c = oapClock();
  for(var i = 0; i < OAP_ORDER.length; i++){
    var r = OAP_RULES[OAP_ORDER[i]];
    if(r.days.indexOf(c.dow) < 0) continue;
    if(c.min >= r.fromMin && c.min < r.toMin){
      return { rule: r, leftMin: r.cutMin - c.min, clock: c };
    }
  }
  return null;
}
function oapSeenMap(){
  try { return JSON.parse(hostGet(LS_OAP_SEEN) || '{}') || {}; } catch(e){ return {}; }
}
function oapSeenKey(kind, ymd){ return String(ymd) + '|' + kind; }
function oapIsSeen(kind, ymd){ return !!oapSeenMap()[oapSeenKey(kind, ymd)]; }
function oapMarkSeen(kind, ymd){
  var m = oapSeenMap();
  m[oapSeenKey(kind, ymd)] = 1;
  var keys = Object.keys(m);
  if(keys.length > 60){
    keys.sort();
    for(var i = 0; i < keys.length - 60; i++) delete m[keys[i]];
  }
  try { hostSet(LS_OAP_SEEN, JSON.stringify(m)); } catch(e){}
}
/** 그날 마감분을 이미 발주했는가 — 발주 이력에서 그 마감으로 접수되는 건을 찾는다. */
function oapOrderedFor(rule, ymd, flow){
  if(!flow || !flow.orders) return false;
  for(var i = 0; i < flow.orders.length; i++){
    var o = flow.orders[i] || {};
    if(String(o.kind || '') !== rule.kind) continue;
    if(oapAccept(rule, o.at) === ymd) return true;
  }
  return false;
}
function oapLeftText(min){
  var m = Math.max(0, Math.round(Number(min) || 0));
  var h = Math.floor(m / 60), r = m % 60;
  if(h <= 0) return r + '분';
  return h + '시간' + (r ? ' ' + r + '분' : '');
}
/** 팝업에 덧붙일 사실 한 줄 — 재고가 입력되어 있으면 권장 수량까지. */
function oapDetail(rule, flow){
  if(rule.kind === 'milk'){
    if(!flow) return '';
    var m = flow.milk || null;
    if(!m) return '';
    if(m.level === 'low' && num(m.needQty) > 0)
      return '지금 우유 ' + qtyUnit(m.stock, m.item, '박스') + ' · ' + qtyUnit(m.needQty, m.item, '박스') + ' 발주를 권합니다';
    if(m.level === 'unknown')
      return '우유 현재고가 아직 입력되지 않았습니다 — 실사하면 권장 수량이 계산됩니다';
    if(m.stock !== null && m.stock !== undefined)
      return '지금 우유 ' + qtyUnit(m.stock, m.item, '박스') + ' 남아 있습니다';
    return '';
  }
  var list = (S.order || []).filter(function(r){
    if(!r) return false;
    var n = String(r.n || '');
    if(n === OAP_MILK_ITEM || n.indexOf('우유') >= 0) return false;
    if(String(r.flag || '').indexOf('제외') >= 0) return false;
    return num(r.rec) > 0;
  });
  if(!list.length) return '';
  var amt = 0;
  list.forEach(function(r){ amt += (num(r.amt) || (num(r.rec) * num(r.price)) || 0); });
  return '지금 발주 추천 ' + list.length + '품목' + (amt > 0 ? ' · 예상 ' + fmtWon(amt) : '');
}
function oapShow(rule, flow, leftMin, ymd){
  var el = $('#ordAlert');
  if(!el) return false;
  el.innerHTML = '<div class="npop-bd" data-act="oapClose"></div>'

    + '<div class="npop-top"><span class="npop-badge">발주 알림</span>'
    + '<span class="npop-date">' + esc(rule.cutLabel) + ' 마감 · ' + oapLeftText(leftMin) + ' 남음</span>'
    + '<button class="npop-x" data-act="oapClose" aria-label="닫기">✕</button>'
    + '<button class="npop-bk" data-act="oapClose" aria-label="뒤로">' + ic('back') + '</button></div>'
    + '<div class="npop-title">' + rule.icon + ' ' + esc(rule.label) + ' 주문 마감이 다가옵니다</div>'
    + '<div class="npop-body">' + esc(rule.cutLabel) + ' 마감입니다. 필요하시면 발주 탭에서 주문해 주세요.</div>'
    + '<div class="oap-note" id="oapNote">' + esc(oapDetail(rule, flow)) + '</div>'
    + '<div class="npop-acts oap-acts">'
    + '<button data-act="oapClose">닫기</button>'
    + '<button class="primary" data-act="oapOrder">발주 탭에서 주문</button>'
    + '</div></div>';
  el.hidden = false;
  S.oapOpen = { kind: rule.kind, ymd: ymd, rule: rule };
  return true;
}
function oapFillDetail(rule, flow){
  var el = $('#oapNote');
  if(!el || el.textContent) return;
  var d = oapDetail(rule, flow);
  if(d) el.textContent = d;
}
function oapClose(){
  var el = $('#ordAlert');
  if(el){ el.hidden = true; el.innerHTML = ''; }
  if(S.oapOpen){ oapMarkSeen(S.oapOpen.kind, S.oapOpen.ymd); }
  S.oapOpen = null;
  S.oapPending = null;
}
/** 지금 띄워야 하는가 — 동기 판정(발주 이력은 이미 받아 둔 것으로만 본다). */
function oapGate(){
  if(oapParam('oap') === 'off') return null;
  var t = oapTarget();
  if(!t) return null;
  if(oapIsSeen(t.rule.kind, t.clock.ymd) && oapParam('oapreset') !== '1') return null;
  if(oapOrderedFor(t.rule, t.clock.ymd, S.flow)) return null;
  return { rule: t.rule, leftMin: t.leftMin, ymd: t.clock.ymd };
}
/**
 * 앱이 준비된 뒤 한 번 부른다.
 * 발주 이력(getOrderFlow)은 3.5초까지만 기다리고, 그 안에 못 받으면 팝업을 먼저 띄운 뒤 도착하면 한 줄만 채운다.
 */
function oapCheck(){
  try {
    var g = oapGate();
    if(!g) return Promise.resolve(false);
    var t = { rule: g.rule, leftMin: g.leftMin, clock: { ymd: g.ymd } };

    var shown = false;
    function show(flow){
      if(shown) return false;
      shown = true;
      if(oapOrderedFor(t.rule, t.clock.ymd, flow)){
        oapMarkSeen(t.rule.kind, t.clock.ymd);     /* 이미 발주함 — 오늘은 다시 묻지 않는다 */
        return false;
      }
      var np = $('#noticePop');
      if(np && !np.hidden){                        /* 공지 팝업이 떠 있으면 그것부터 */
        S.oapPending = { rule: t.rule, leftMin: t.leftMin, ymd: t.clock.ymd };
        return false;
      }
      return oapShow(t.rule, flow, t.leftMin, t.clock.ymd);
    }

    var p = S.flow ? Promise.resolve(S.flow) : call('getOrderFlow');
    return new Promise(function(resolve){
      var done = false;
      var timer = setTimeout(function(){
        if(done) return; done = true;
        resolve(show(S.flow || null));
      }, 3500);
      p.then(function(flow){
        if(flow && !S.flow) S.flow = flow;
        if(done){ if(S.oapOpen) oapFillDetail(t.rule, flow); return; }
        done = true; clearTimeout(timer);
        resolve(show(flow || S.flow || null));
      }).catch(function(){
        if(done) return; done = true; clearTimeout(timer);
        resolve(show(S.flow || null));
      });
    });
  } catch(e){ return Promise.resolve(false); }
}

/* 앱이 처음 준비된 뒤: 공지 팝업 + 현황 한 번 읽기 */

/* ---------------------------------------------------- 현황 전용 클릭 처리 */
document.addEventListener('click', function(ev){
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if(!el) return;
  var act = el.getAttribute('data-act');
  if(act.indexOf('live') !== 0 && act.indexOf('noticePop') !== 0 && act.indexOf('oap') !== 0) return;
  var v = el.getAttribute('data-v');
  if(act === 'liveRefresh'){
    var now = new Date().getTime();
    if(S.liveCool && now - S.liveCool < LIVE_COOL_MS){ toast('잠시 뒤에 다시 눌러 주세요'); return; }
    S.liveCool = now;
    el.classList.add('spinning');
    loadLive();
    setTimeout(function(){ el.classList.remove('spinning'); }, 900);
    toast('최신 상태로 불러왔습니다');
  }
  else if(act === 'liveFilter'){ S.liveFilter = v; render(); }
  else if(act === 'liveGroup'){
    if(!S.liveOpen) S.liveOpen = {};
    S.liveOpen['h' + v] = !liveOpenState(Number(v));
    render();
  }
  else if(act === 'liveHour'){ S.liveHour = Number(v); render(); }
  else if(act === 'liveHourTable'){ S.liveHourTable = !S.liveHourTable; render(); }
  else if(act === 'liveMenuSort'){ S.liveMenuSort = v; render(); }
  else if(act === 'liveMenuMore'){ S.liveMenuMore = !S.liveMenuMore; render(); }
  else if(act === 'liveOrder'){
    var id = el.getAttribute('data-name');
    var o = null;
    (S.live.orders || []).forEach(function(x){ if(String(x.id) === String(id)) o = x; });
    if(!o) return;
    liveOpenMemo(liveKeyOf(o));
  }
  else if(act === 'liveMemoAll'){ liveOpenMemo(null); }
  else if(act === 'liveMemoOne'){ liveOpenMemo(el.getAttribute('data-name')); }
  else if(act === 'liveMemoClose'){ liveCloseMemo(); }
  else if(act === 'livePhone'){
    if(!S.livePhone) S.livePhone = {};
    S.livePhone[v] = !S.livePhone[v];
    liveOpenMemo(v);
  }
  else if(act === 'noticePopAck'){ noticePopClose(true); }
  else if(act === 'noticePopList'){ noticePopClose(true); setTab('notice'); }
  else if(act === 'oapClose'){ oapClose(); }
  else if(act === 'oapOrder'){ oapClose(); setTab('order'); }
});

/* ---------------------------------------------------------------- 작은 도우미 */
function ofDow(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '').slice(0, 10));
  if(!m) return '';
  var d = new Date(+m[1], +m[2] - 1, +m[3]);
  return ['일','월','화','수','목','금','토'][d.getDay()];
}
function ofShort(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '').slice(0, 10));
  return m ? (+m[2]) + '/' + (+m[3]) : String(iso || '');
}
function ofEtaLabel(iso){
  var s = String(iso || '').slice(0, 10);
  if(!s) return '—';
  return ofShort(s) + '(' + ofDow(s) + ') 오전';
}
function ofLeftText(min){
  var m = Math.max(0, Math.round(Number(min) || 0));
  var h = Math.floor(m / 60), r = m % 60;
  if(h <= 0) return r + '분';
  return h + '시간' + (r ? ' ' + r + '분' : '');
}
function ofAtLabel(at){
  var s = String(at || '');
  if(s.length >= 16) return ofShort(s.slice(0,10)) + ' ' + s.slice(11,16);
  return s;
}
function ofKindName(k){ return k === 'milk' ? '우유' : '일반'; }
function ofStateText(st, kind){
  var v = Number(st);
  if(v === 40) return '완료';
  if(v === 25) return kind === 'milk' ? '직배송' : '진행';
  if(v === 35) return '배송중';
  if(v === 30) return '배송준비';
  if(v === 20) return '확인';
  if(v === 10) return '접수';
  if(v === 0) return '대기';
  return '상태 ' + st;
}
function ofComma(v){ return String(Math.round(Number(v) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function ofWon(v){ return ofComma(v); }

/* ------------------------------------------------------------ 본사 발주 이력 */
/* 품목 줄 금액 — 시트에 금액이 있으면 그것을, 없으면 수량×단가로 계산한다. */
function ofLineAmt(l){
  var am = num(l.amount);
  if(am && am > 0) return Math.round(am);
  var q = num(l.qty) || 0, pr = num(l.price) || 0;
  return (q > 0 && pr > 0) ? Math.round(q * pr) : 0;
}
/* 배지 — 입고 여부는 오직 웹앱 자체 입고 기록으로만 판단한다.
 * 본사 상태(40=완료 등)는 '본사가 보냈다'는 표시일 뿐 실제 수령과 다르므로 배지에 쓰지 않는다. */
function ofHistBadge(o){
  if(o.done) return { cls: 'ok', text: '입고됨' };
  if(o.recordOnly) return { cls: 'mut', text: '입고 기록 없음' };
  var eta = String(o.eta || '').slice(0, 10);
  return { cls: o.due ? 'warn' : 'mut',
           text: eta ? '입고 예정 ' + ofShort(eta) + ' 오전' : '입고 예정' };
}
function ofHistoryCard(){
  var f = ofFlow();
  /* v4.12.4 — 흰 시트가 열리지 않게 안내를 남긴다(자료는 그대로) */
  if(!f) return '<div class="x-hint">' + ic('clock') + '<div><b>발주 이력을 불러오는 중…</b>'
    + '<div style="margin-top:2px">잠시 뒤 다시 열어 주세요.</div></div></div>';
  var all = f.orders || [];

  var html = '<div class="card of-hist">'
    + '<div class="lv-head"><div class="t">본사 발주 이력</div><div class="c">'
    + (f.meta && f.meta.lastCollect ? '마지막 수집 ' + esc(ofAtLabel(f.meta.lastCollect)) : '아직 수집 전')
    + (all.length ? ' · 총 ' + all.length + '건' : '')
    + '</div></div>';
  if(!all.length){
    html += '<div class="of-empty">발주 이력이 아직 없습니다. 매일 아침 본사 발주 내역을 자동으로 받아 옵니다.'
      + (S.flowErr ? '<br><span class="of-err">' + esc(S.flowErr) + '</span>' : '') + '</div></div>';
    return html;
  }
  list.forEach(function(o){
    var open = !!S.ofOpen['O:' + o.id];
    var lines = o.lines || [];
    var sum = 0;
    for(var li = 0; li < lines.length; li++) sum += ofLineAmt(lines[li]);
    var headAmt = num(o.amount) || 0;
    var hb = ofHistBadge(o);
    html += '<div class="of-hist-row">'
      + '<div class="of-hh" data-act="ofTogglePend" data-key="O:' + esc(o.id) + '">'
      + '<span class="of-hd">' + ofAtLabel(o.at) + '</span>'
      + '<span class="of-badge ' + hb.cls + '">' + hb.text + '</span>'
      + '<span class="of-hm">' + lines.length + '품목 · ' + ofWon(headAmt || sum) + '원</span>'
      + '<span class="of-ar">' + (open ? '▴' : '▾') + '</span>'
      + '</div>';
    if(open){
      html += '<div class="of-lines">';
      lines.forEach(function(l){
        var q = num(l.qty) || 0, pr = num(l.price) || 0, am = ofLineAmt(l);
        html += '<div class="of-hli' + (l.inbound ? ' in' : '') + '">'
          + '<div class="of-hlc">'
          +   '<div class="of-hln">' + esc(l.name) + '</div>'
          +   '<div class="of-hls">' + esc(qtyUnit(q, l.name, l.unit || ''))
          +     (pr > 0 ? ' × ' + ofWon(pr) + '원' : ' · 단가 없음')
          +     (l.inbound ? ' · <span class="of-hlinb">입고 ' + ofShort(l.inbound.at) + '</span>' : '')
          +   '</div>'
          + '</div>'
          + '<div class="of-hla">' + (am > 0 ? ofWon(am) + '원' : '<span class="of-hlna">—</span>')
          +   (l.inbound ? '<button class="of-cxl" data-act="ofCancelInb" data-key="' + esc(l.inbound.key) + '" title="이 품목의 입고 반영을 취소합니다">반영 취소</button>' : '')
          + '</div>'
          + '</div>';
      });
      html += '</div>';
      html += '<div class="of-hlt"><span>합계 · ' + lines.length + '품목</span><b>'
        + ofWon(sum || headAmt) + '원</b></div>';
      if(headAmt > 0 && sum > 0 && Math.abs(headAmt - sum) >= 1){
        html += '<div class="of-hlnote">본사 기록 금액 ' + ofWon(headAmt) + '원 · 품목 합계와 '
          + ofWon(Math.abs(headAmt - sum)) + '원 차이</div>';
      }
      html += '<div class="of-pend-a"><span class="of-mini">본사 상태 ' + esc(ofStateText(o.state, o.kind))
        + (o.staff ? ' · 담당 ' + esc(o.staff) : '') + (o.direct ? ' · 직배송' : '') + '</span>'
        + (o.done ? '' : '<button class="btn-line of-btn2" data-act="ofApply" data-kind="' + esc(o.kind) + '" data-id="' + esc(o.id) + '" data-key="O:' + esc(o.id) + '">전부 입고 반영</button>')
        + '</div>';
    }
    html += '</div>';

  if(all.length > show){
    html += '<button class="btn-line of-more" data-act="ofMore">더 보기 (' + (all.length - show) + '건)</button>';

  html += '</div>';
  return html;
}

/* --------------------------------------------------------------- 이벤트 처리 */
function ofFlowAct45(act, el){
  if(act === 'liveMenuKind'){
    S.liveMenuKind = el.getAttribute('data-v') || 'all';
    S.liveMenuMore = false;
    render();
    return true;
  }
  if(!act || act.indexOf('of') !== 0) return false;
  var f = ofFlow();

  if(act === 'ofView'){
    S.ordView = el.getAttribute('data-v') === 'items' ? 'items' : 'flow';
    scrollMainTop();
    render();
    return true;
  }
  if(act === 'ofReload'){ loadOrderFlow(false); return true; }
  if(act === 'ofMore'){ S.ofShow = (S.ofShow || 6) + 12; render(); return true; }
  if(act === 'ofTogglePend'){
    var k = el.getAttribute('data-key');
    S.ofOpen[k] = !S.ofOpen[k];
    render();
    return true;
  }
  if(act === 'ofMilkCart'){
    var m = f && f.milk;
    if(!m) return true;
    S.ofCart = [{ name: m.item, qty: String(m.needQty || 1) }];
    S.ofQ = '';
    render();
    toast('수동 발주에 담았습니다 (' + qtyUnit(m.needQty || 1, m.item, '박스') + ')', 'ok');
    var card = $('.of-manual');
    if(card && card.scrollIntoView) card.scrollIntoView({ block:'start', behavior:'smooth' });
    return true;
  }
  if(act === 'ofAddCart'){
    var nm = el.getAttribute('data-name');
    var cart = S.ofCart || [];
    var found = null;
    for(var i=0;i<cart.length;i++) if(cart[i].name === nm) found = cart[i];
    if(found) found.qty = String((num(found.qty) || 0) + 1);
    else cart.push({ name: nm, qty: '1' });
    S.ofCart = cart;
    S.ofQ = '';
    render();
    return true;
  }
  if(act === 'ofCartStep'){
    var idx = Number(el.getAttribute('data-i'));
    var d = Number(el.getAttribute('data-d'));
    var cart2 = S.ofCart || [];
    if(cart2[idx]){
      var v = (num(cart2[idx].qty) || 0) + d;
      if(v < 1) v = 1;
      cart2[idx].qty = String(v);
      S.ofCart = cart2;
      render();
    }
    return true;
  }
  if(act === 'ofCartDel'){
    var i2 = Number(el.getAttribute('data-i'));
    S.ofCart = (S.ofCart || []).filter(function(c, i){ return i !== i2; });
    render();
    return true;
  }
  if(act === 'ofSaveManual'){ ofSaveManual(); return true; }
  if(act === 'ofApply'){
    ofApply(el.getAttribute('data-kind'), el.getAttribute('data-id'));
    return true;
  }
  if(act === 'ofCancelInb'){
    var key2 = el.getAttribute('data-key');
    if(!confirm('이 입고 반영을 취소할까요? 재고에서 다시 빠집니다.')) return true;
    call('cancelInbound', { key: key2 }).then(function(res){
      if(!res || !res.ok) throw new Error((res && res.error) || '취소 실패');
      toast('반영을 취소했습니다 (' + res.name + ' ' + fmtNum(res.qty) + ')', 'ok');
      return loadOrderFlow(true);
    }).then(function(){ return loadBootstrap(true); }).catch(function(e){
      toast('취소 실패 — ' + errMsg(e), 'err');
    });
    return true;
  }
  return false;
}

/** 입고 반영: 화면에 입력된 수량(수정값)이 있으면 그 값으로. */
function ofApply45(kind, id){
  var edits = $$('.of-edit[data-id="' + id + '"][data-kind="' + kind + '"]');
  var lines = null;
  if(edits.length){
    lines = edits.map(function(inp){
      return { name: inp.getAttribute('data-name'), qty: num(inp.value) || 0 };
    });
  }
  if(!confirm('이 건을 재고에 반영할까요?\n재고실사 현재고에 수량이 더해집니다.')) return;
  call('applyInbound', { kind: kind, id: String(id), author: S.author || '', lines: lines }).then(function(res){
    if(!res || !res.ok) throw new Error((res && res.error) || '반영 실패');
    var n = res.applied || 0;
    toast(n ? (n + '개 품목 재고 반영 완료') : '이미 반영된 건입니다', n ? 'ok' : '');
    return loadOrderFlow(true);
  }).then(function(){ return loadBootstrap(true); }).catch(function(e){
    toast('반영 실패 — ' + errMsg(e), 'err');
  });
}

function ofSaveManual(){
  var cart = S.ofCart || [];
  if(!cart.length){ toast('담은 품목이 없습니다', 'err'); return; }
  var a = $('#ofAuthor');
  var author = String((a && a.value) || S.author || '').trim();
  if(!author){ toast('작성자 이름을 넣어 주세요', 'err'); if(a) a.focus(); return; }
  S.author = author;
  var lines = cart.map(function(c){
    return { name: c.name, qty: num(c.qty) || 0, price: priceOf(c.name) || 0, kind: ofCartKind(c.name) };
  });
  call('saveManualOrder', { author: author, lines: lines }).then(function(res){
    if(!res || !res.ok) throw new Error((res && res.error) || '저장 실패');
    S.ofCart = [];
    toast('수동 발주 ' + res.saved + '건 저장 · ' + ofEtaLabel((res.lines[0] || {}).eta) + ' 입고', 'ok');
    return loadOrderFlow(true);
  }).then(function(){ return loadBootstrap(true); }).catch(function(e){
    toast('저장 실패 — ' + errMsg(e), 'err');
  });
}


/* ===== v4.5 [현황] 메뉴별 판매 — 전체 / 커피 음료 / 디저트 =================
 * 수량은 하루 전체 메뉴통계(bana_app_franchisee_sales_menu_stat) 값이다.
 * 분류는 ① 본사 메뉴통계의 nDrink(1 음료 / 0 푸드) ② 웹앱 판매 탭 메뉴의 카테고리 순으로 판단한다.
 * ==================================================================== */
S.liveMenuKind = S.liveMenuKind || 'all';

var LIVE_DESSERT_CATS = { '디저트': 1, '상품': 1 };

function liveMenuByName(n){
  var nm = String(n || '');
  for(var i = 0; i < MENU.length; i++){ if(MENU[i].n === nm) return MENU[i]; }
  return null;
}
function liveMenuKindOf(m){
  var d = m.drink;
  if(d === 0 || d === '0') return 'dessert';
  if(d === 1 || d === '1') return 'coffee';
  var cat = String(m.cat || '');
  if(!cat){
    var it = liveMenuByName(m.name);
    cat = it ? String(it.cat || '') : '';
  }
  if(LIVE_DESSERT_CATS[cat]) return 'dessert';
  if(cat) return 'coffee';
  var nm = String(m.name || '');
  if(/(빵|케이크|쿠키|떡|타르트|베이글|머핀|마들렌|크로플|와플|샌드|부리또|파니니|토스트|스콘|마카롱)/.test(nm)) return 'dessert';
  return 'coffee';
}
function liveMenuKindStats(list){
  var s = { all: list.length, coffee: 0, dessert: 0, qty: { all: 0, coffee: 0, dessert: 0 }, amt: { all: 0, coffee: 0, dessert: 0 } };
  list.forEach(function(m){
    var k = m.kind;
    s[k]++;
    s.qty.all += m.qty; s.amt.all += (m.amt || 0);
    s.qty[k] += m.qty; s.amt[k] += (m.amt || 0);
  });
  return s;
}

function liveMenuCard45(){
  if(lockOn()) return xLockCard('메뉴별 판매', '메뉴별 판매 수량·금액', 'lv-card-menu');
  var raw = (S.live.menu || []).slice();
  var list = raw.map(function(m){
    var of = livePriceOf(m);
    var qty = Number(m.qty || 0);
    return { code: m.code, name: m.name, cat: m.cat, drink: m.drink,
             qty: qty, hot: Number(m.hot || 0), ice: Number(m.ice || 0),
             price: of.p, amt: (of.p == null ? null : of.p * qty),
             kind: liveMenuKindOf(m) };
  });
  var st = liveMenuKindStats(list);
  var kind = S.liveMenuKind || 'all';
  var shownList = (kind === 'all') ? list : list.filter(function(m){ return m.kind === kind; });
  var byQty = (S.liveMenuSort || 'qty') === 'qty';
  shownList.sort(function(a, b){
    if(byQty) return b.qty - a.qty || (b.amt || 0) - (a.amt || 0);
    return (b.amt || 0) - (a.amt || 0) || b.qty - a.qty;
  });
  var limit = S.liveMenuMore ? shownList.length : 5;
  var shown = shownList.slice(0, limit);

  var h = '<div class="card lv-card lv-card-menu">'
    + '<div class="lv-head"><div class="t">메뉴별 판매</div>'
    +   '<div class="lv-seg">'
    +   '<button class="' + (byQty ? 'on' : '') + '" data-act="liveMenuSort" data-v="qty">수량</button>'
    +   '<button class="' + (byQty ? '' : 'on') + '" data-act="liveMenuSort" data-v="amt">금액</button>'
    +   '</div></div>'
    + '<div class="lv-chips lv-menu-kinds">'
    +   '<button class="lv-chip' + (kind === 'all' ? ' on' : '') + '" data-act="liveMenuKind" data-v="all">전체<em>' + st.all + '</em></button>'
    +   '<button class="lv-chip' + (kind === 'coffee' ? ' on' : '') + '" data-act="liveMenuKind" data-v="coffee">커피 음료<em>' + st.coffee + '</em></button>'
    +   '<button class="lv-chip' + (kind === 'dessert' ? ' on' : '') + '" data-act="liveMenuKind" data-v="dessert">디저트<em>' + st.dessert + '</em></button>'
    + '</div>';

  if(!shown.length){
    h += '<div class="lv-empty">아직 오늘 판매 기록이 없습니다.</div>';
  } else {
    shown.forEach(function(m, i){
      var hi = [];
      if(m.hot) hi.push('H' + m.hot);
      if(m.ice) hi.push('I' + m.ice);
      var amt = (m.amt == null) ? '—' : fmtWon(m.amt);
      h += '<div class="lv-mrow">'
        + '<div class="rk' + (i < 3 ? ' top' : '') + '">' + (i + 1) + '</div>'
        + '<div class="nm">' + esc(m.name) + (hi.length ? '<span>' + hi.join('·') + '</span>' : '') + '</div>'
        + '<div class="qt">' + fmtNum(m.qty) + '<i>' + liveMenuUnit(m.cat, m.name) + '</i></div>'
        + '<div class="am">' + amt + '</div>'
        + '</div>';
    });
    if(shownList.length > 5){
      h += '<button class="lv-more" data-act="liveMenuMore">' + (S.liveMenuMore ? '접기' : '전체 ' + shownList.length + '종 보기') + '</button>';
    }
    h += '<div class="lv-mtot">'
      + '<span>' + (kind === 'all' ? '전체' : (kind === 'coffee' ? '커피 음료' : '디저트')) + ' 합계</span>'
      + '<b>' + fmtNum(st.qty[kind]) + '개 · ' + fmtNum(st.amt[kind]) + '원</b></div>';
    h += '<div class="lv-note">수량은 하루 전체 메뉴통계 기준입니다(주문 20건 창과 무관). '
      + '금액은 웹앱 판매가 × 수량 <b>추정치</b>이고 할인·옵션·배달료는 빠집니다. '
      + '커피 음료/디저트 구분은 본사 메뉴 구분과 판매 탭 카테고리로 나눕니다.</div>';
  }
  h += '</div>';
  return h;
}

/** 오늘 주문 꼬리말 — 하루 전체 기준인지, 수집 창이 얼마나 되는지. */
function liveOrdersTail(allCount, shownCount){
  var s = (allCount === shownCount)
    ? '오늘 ' + allCount + '건 전부 표시됨 · 하루 전체 기준'
    : shownCount + '건 표시 중 (전체 ' + allCount + '건)';
  if(S.live && S.live.firstSeen) s += ' · 수집 ' + String(S.live.firstSeen).slice(11, 16) + '부터';
  if(allCount !== shownCount && S.live && S.live.windowFull) s += ' · 주문이 몰린 구간은 일부 누락될 수 있습니다';
  return s;
}


/* ===== v4.6 입고 예정 — 품목별 체크 후 반영 ================================
 * 발주 건을 펼치면 품목마다 체크박스가 있다(기본 체크).
 * 매장에 실제 도착한 품목만 체크하고 [선택 품목 입고 반영]을 누른다.
 * 체크하지 않은 품목은 아무 기록도 남기지 않는다 = 미도착으로 '입고 예정'에 남는다.
 * 서버는 예정일이 와도 자동으로 더하지 않는다(v4.6) — 이 화면의 체크가 유일한 입구다.
 * ==================================================================== */
S.ofChk = S.ofChk || {};     // 'kind:id:줄번호' → false (해제). 값이 없으면 체크된 것으로 본다.

function ofChkKey(kind, id, i){ return kind + ':' + id + ':' + i; }
function ofIsChecked(kind, id, i){
  var v = S.ofChk[ofChkKey(kind, id, i)];
  return (v === undefined) ? true : !!v;
}
function ofSetCheck(kind, id, i, on){ S.ofChk[ofChkKey(kind, id, i)] = !!on; }

/* 건의 품목 줄 — 화면·반영이 같은 자료를 쓰도록 한 곳에서 꺼낸다. */
function ofPendingLines(kind, id){
  var f = ofFlow();
  if(!f) return [];
  if(kind === 'manual'){
    var m = (f.manual || []).filter(function(x){ return String(x.id) === String(id); })[0];
    return m ? [{ name: m.name, qty: m.qty, unit: '', inbound: m.inbound }] : [];
  }
  var list = f.orders || [];
  for(var i = 0; i < list.length; i++){
    if(String(list[i].id) === String(id)) return list[i].lines || [];
  }
  return [];
}

/* 체크 집계 — 반영된 줄과 반영 중인 줄은 빼고 센다. */
function ofChkStats(lines, kind, id){
  var st = { all: 0, done: 0, left: 0, on: 0, off: 0, qty: 0, leftQty: 0 };
  (lines || []).forEach(function(l, i){
    st.all++;
    if(l.inbound || l.pending){ st.done++; return; }
    st.left++;
    st.leftQty += Number(l.qty) || 0;
    if(ofIsChecked(kind, id, i)){ st.on++; st.qty += Number(l.qty) || 0; }
    else st.off++;
  });
  st.qty = Math.round(st.qty * 1000) / 1000;
  st.leftQty = Math.round(st.leftQty * 1000) / 1000;
  return st;
}

function ofPendingCard(){
  var f = ofFlow();
  if(!f) return '';
  var pend = (f.orders || []).filter(function(o){ return o.due && !o.done; });
  var manualDue = (f.manual || []).filter(function(o){ return o.due; });
  var doneToday = (f.recent || []).filter(function(r){ return r.status === '반영' && String(r.at || '').slice(0,10) === f.today; });
  if(!pend.length && !manualDue.length){
    return '<div class="card of-pending none">'
      + '<div class="lv-head"><div class="t">📥 입고 예정</div><div class="c">없음</div></div>'
      + '<div class="of-empty">오늘 확인할 입고 건이 없습니다.'
      + (doneToday.length ? ' 오늘 ' + doneToday.length + '개 품목을 재고에 반영했습니다.' : '')
      + '</div></div>';
  }
  var html = '<div class="card of-pending">'
    + '<div class="lv-head"><div class="t">📥 입고 예정 · 확인</div><div class="c">' + (pend.length + manualDue.length) + '건</div></div>'
    + '<div class="of-help">발주 건을 펼쳐 <b>실제로 도착한 품목만 체크</b>하고 <b>선택 품목 입고 반영</b>을 누르세요. 체크하지 않은 품목은 <b>미도착</b>으로 남아 계속 이 목록에 있습니다.</div>';
  pend.forEach(function(o){
    html += ofPendingGroup(o.kind, o.id, o.at, o.eta, o.lines, o.amount);
  });
  manualDue.forEach(function(m){
    html += ofPendingGroup('manual', m.id, m.at, m.eta, [{ name: m.name, qty: m.qty, unit: '' }], m.qty * (m.price || 0));
  });
  html += '<div class="of-help">수량이 다르면 숫자를 고친 뒤 체크하세요. 잘못 넣었으면 발주 이력에서 <b>반영 취소</b>로 재고에서 다시 뺄 수 있습니다.</div>';
  html += '</div>';
  return html;
}

function ofPendingGroup(kind, id, at, eta, lines, amount){
  var key = kind + ':' + id;
  var open = !!S.ofOpen[key];
  var st = ofChkStats(lines, kind, id);
  var badge = st.done > 0
    ? '<span class="of-badge warn">일부 도착 ' + st.done + '/' + st.all + '</span>'
    : '<span class="of-badge ' + (kind === 'milk' ? 'warn' : 'mut') + '">' + (kind === 'manual' ? '수동' : (kind === 'milk' ? '우유' : '일반')) + '</span>';
  var html = '<div class="of-pend">'
    + '<div class="of-pend-h" data-act="ofTogglePend" data-key="' + esc(key) + '">'
    + '<div class="of-pend-t"><b>' + ofEtaLabel(eta) + '</b>'
    + '<span class="of-pend-m">' + ofAtLabel(at) + ' 발주 · ' + st.all + '품목 ' + fmtNum(st.leftQty) + '개' + (st.done ? ' 남음' : '') + '</span></div>'
    + badge
    + '<span class="of-ar">' + (open ? '▴' : '▾') + '</span>'
    + '</div>';
  if(open){
    html += '<div class="of-sel">'
      + '<span class="of-seln">도착한 품목 <b>' + st.on + '</b>/' + st.left + '</span>'
      + '<button class="of-cmdsm" data-act="ofChkAll" data-kind="' + esc(kind) + '" data-id="' + esc(String(id)) + '">전체 선택</button>'
      + '<button class="of-cmdsm" data-act="ofChkNone" data-kind="' + esc(kind) + '" data-id="' + esc(String(id)) + '">전체 해제</button>'
      + '</div>';
    html += '<div class="of-lines">';
    (lines || []).forEach(function(l, i){
      if(l.inbound){
        html += '<div class="of-line in">'
          + '<span class="of-cbi">✓</span>'
          + '<span class="of-ln">' + esc(l.name || '') + '</span>'
          + '<span class="of-inb-at">입고 ' + ofShort(String(l.inbound.at || '').slice(0,10)) + '</span>'
          + '</div>';
        return;
      }
      var on = ofIsChecked(kind, id, i);
      var lpk = packOf(l.name, l.unit || '');
      html += '<div class="of-line of-lchk' + (on ? '' : ' off') + '">'
        + '<button class="of-cb' + (on ? ' on' : '') + '" data-act="ofChk" data-kind="' + esc(kind) + '" data-id="' + esc(String(id)) + '" data-i="' + i + '"'
        + ' aria-label="' + esc(l.name || '') + ' 도착 체크" aria-pressed="' + (on ? 'true' : 'false') + '">' + (on ? '✓' : '') + '</button>'
        + '<span class="of-ln">' + esc(l.name || '') + '</span>'
        + '<span class="of-lq"><input type="text" inputmode="decimal" class="of-edit" data-kind="' + esc(kind) + '" data-id="' + esc(String(id)) + '" data-i="' + i + '" data-name="' + esc(l.name || '') + '" value="' + esc(String(l.qty)) + '"' + (on ? '' : ' disabled') + '></span>'
        + '<span class="of-lu">' + esc((l.unit || '') + (lpk ? '(' + lpk.n + lpk.u + ')' : '')) + '</span>'
        + '</div>';
    });
    html += '</div>';
  }
  html += '<div class="of-pend-a">'
    + '<span class="of-amt">' + ofWon(amount) + '원</span>';
  if(open && st.left > 0){
    html += '<button class="btn-line of-btn2" data-act="ofTogglePend" data-key="' + esc(key) + '">접기</button>'
      + '<button class="btn-primary of-btn2" data-act="ofApply" data-kind="' + esc(kind) + '" data-id="' + esc(String(id)) + '" data-key="' + esc(key) + '"'
      + (st.on > 0 ? '' : ' disabled') + '>'
      + (st.on === st.left ? st.on + '품목 전부 반영' : st.on + '품목만 반영') + '</button>';
  } else if(open){
    html += '<button class="btn-line of-btn2" data-act="ofTogglePend" data-key="' + esc(key) + '">접기</button>';
  } else {
    html += '<button class="btn-line of-btn2" data-act="ofTogglePend" data-key="' + esc(key) + '">도착 확인 · 체크</button>';
  }
  html += '</div></div>';
  return html;
}

/* 체크·전체선택 처리 → 나머지는 v4.5 처리기로 넘긴다. */
function ofFlowAct(act, el){
  if(act === 'ofChk'){
    var kKind = el.getAttribute('data-kind'), kId = el.getAttribute('data-id'), kI = Number(el.getAttribute('data-i'));
    ofSetCheck(kKind, kId, kI, !ofIsChecked(kKind, kId, kI));
    render();
    return true;
  }
  if(act === 'ofChkAll' || act === 'ofChkNone'){
    var aKind = el.getAttribute('data-kind'), aId = el.getAttribute('data-id');
    var on = (act === 'ofChkAll');
    ofPendingLines(aKind, aId).forEach(function(l, i){ if(!l.inbound) ofSetCheck(aKind, aId, i, on); });
    render();
    return true;
  }
  return ofFlowAct45(act, el);
}

/** 입고 반영 — 체크된 품목만. 화면에 고친 수량이 있으면 그 값으로. */
function ofApply(kind, id){
  var lines = ofPendingLines(kind, id);
  if(!lines.length){ toast('발주 품목을 찾지 못했습니다. 새로고침 후 다시 시도해 주세요', 'err'); return; }
  var pick = [];
  lines.forEach(function(l, i){
    if(l.inbound) return;
    if(!ofIsChecked(kind, id, i)) return;
    var inp = $('.of-edit[data-id="' + id + '"][data-kind="' + kind + '"][data-i="' + i + '"]');
    var q = num(inp && inp.value);
    if(q === null) q = num(l.qty) || 0;
    pick.push({ name: l.name, qty: q, unit: l.unit || '' });
  });
  if(!pick.length){
    toast('도착한 품목을 먼저 체크해 주세요', 'err');
    return;
  }
  var qtySum = 0;
  pick.forEach(function(p){ qtySum += Number(p.qty) || 0; });
  var off = lines.filter(function(l, i){ return !l.inbound && !ofIsChecked(kind, id, i); }).length;
  var msg = '도착한 ' + pick.length + '품목 ' + fmtNum(Math.round(qtySum * 1000) / 1000) + '개를 재고에 반영할까요?\n재고실사 현재고에 수량이 더해집니다.'
    + (off ? '\n체크하지 않은 ' + off + '품목은 미도착으로 남깁니다.' : '');
  if(!confirm(msg)) return;
  call('applyInbound', { kind: kind, id: String(id), author: S.author || '', lines: pick }).then(function(res){
    if(!res || !res.ok) throw new Error((res && res.error) || '반영 실패');
    var n = res.applied || 0;
    var left = Number(res.remaining || 0);
    var t = n ? (n + '개 품목 재고 반영' + (left ? ' · ' + left + '품목 미도착으로 남김' : ' · 전부 도착')) : '이미 반영된 건입니다';
    toast(t, n ? 'ok' : '');
    return loadOrderFlow(true);
  }).then(function(){ return loadBootstrap(true); }).catch(function(e){
    toast('반영 실패 — ' + errMsg(e), 'err');
  });
}

/* ===== v4.6 재고 3용어 — 오픈 · 사용 · 마감 ================================
 * [재고] 탭 품목마다 세 숫자를 나란히 보여 준다.
 *   오픈 = 그날 04:00 스냅샷(서버 '일별재고')  · 사용 = 오픈 + 입고 − 로스 − 마감
 *   마감 = 지금 재고실사 현재고
 * 값이 없는 칸은 '—'로 비운다. 서버 getBootstrap 이 items[].sd 로 내려 준다.
 * ==================================================================== */
S.sdOn = (S.sdOn === undefined) ? true : S.sdOn;

function sdVal(v){
  if(v === null || v === undefined || v === '') return null;
  var n = Number(v);
  if(!isFinite(n)) return null;
  return Math.round(n * 1000) / 1000;
}
function sdTxt(v){
  var n = sdVal(v);
  return n === null ? '—' : fmtNum(n);
}
function sdTxtPk(v, it){
  var n = sdVal(v);
  if(n === null) return '—';
  return qtyNum(n, it && it.n, (it && (it.u || it.spec)) || '');
}
function sdOpenAt(){
  var d = S.day || null;
  return (d && d.openAt) ? String(d.openAt) : '';
}
/* 품목 한 줄의 3용어 띠 */
function sdStrip(it){
  if(!S.sdOn || !S.ready) return '';
  var sd = (it && it.sd) || null;
  var open = sd ? sdVal(sd.o) : null;
  var use  = sd ? sdVal(sd.u) : null;
  var close = sd ? sdVal(sd.c) : sdVal(it && it.cur);
  if(close === null) close = sdVal(it && it.cur);
  var inb = sd ? (Number(sd.i) || 0) : 0;
  var loss = sd ? (Number(sd.l) || 0) : 0;
  /* v4.7.0 — 판매·레시피로 자동 산출한 사용량(일별사용량 탭). 있으면 이것을 보여 준다. */
  var auto = sd ? sdVal(sd.a) : null;
  var autoDay = sd ? String(sd.ad || '').slice(5) : '';
  var autoSrc = sd ? String(sd.as || '') : '';
  /* v4.8.0 — 마감이 현장 실사인지 판매·레시피 자동 차감인지(서버 이론재고) */
  var thSrc = sd ? String(sd.tt || '') : '';
  var manToday = sd ? (sd.tm !== undefined && sd.tm !== null) : false;
  var useVal = auto !== null ? auto : use;
  var useSrc = auto !== null ? ('자동' + (autoSrc ? '·' + autoSrc : '')) : '실사';
  if(useVal === null) useSrc = '';
  var at = sdOpenAt();
  var any = (open !== null || useVal !== null || close !== null || inb || loss);
  var tip = any ? ('오픈 = ' + (open === null ? '오늘 스냅샷 없음' : '오늘 시작 현재고' + (at ? ' (' + at + ')' : ''))
    + ' / 마감 = ' + (manToday ? '현장에서 세어 저장한 값'
        : (thSrc ? '판매·레시피 자동 차감 후 이론재고(기준 ' + (sd.tb === undefined || sd.tb === null ? '—' : fmtNum(sd.tb)) + ')' : '지금 재고실사 현재고'))
    + ' / 사용 = ' + (auto !== null
        ? '판매·레시피 자동 산출' + (autoDay ? ' (' + autoDay + ' 기준' + (autoSrc ? ' · ' + autoSrc : '') + ')' : '')
        : '실사로 센 오픈 + 입고 − 로스 − 마감')) : '';
  var h = '<div class="sd-strip"' + (tip ? ' title="' + esc(tip) + '"' : '') + '>'
    + '<span class="sd-c"><i>오픈</i><b>' + sdTxtPk(open, it) + '</b></span>'
    + '<span class="sd-c use' + (useVal !== null && useVal < 0 ? ' neg' : '') + (useVal === null ? ' nil' : '') + '"><i>사용</i><b>'
      + (useVal === null ? '—' : sdTxtPk(useVal, it)) + '</b>'
      + (useSrc ? '<em class="sd-src">' + esc(useSrc) + (auto !== null && autoDay ? ' ' + esc(autoDay) : '') + '</em>' : '')
      + '</span>'
    + '<span class="sd-c"><i>마감</i><b>' + sdTxtPk(close, it) + '</b>'
      + (close === null ? '' : (manToday ? '<em class="sd-src">현장</em>' : (thSrc ? '<em class="sd-src">자동</em>' : '')))
      + '</span>';
  var ex = [];
  if(inb) ex.push('+' + qtyNum(inb, it && it.n, (it && (it.u || it.spec)) || '') + ' 입고');
  if(loss) ex.push('−' + qtyNum(loss, it && it.n, (it && (it.u || it.spec)) || '') + ' 로스');
  if(ex.length) h += '<span class="sd-x">' + esc(ex.join(' · ')) + '</span>';
  h += '</div>';
  return h;
}
/* 재고 탭 맨 위 안내 — 세 용어의 뜻과 스냅샷 시각 */
function sdLegend(){
  var at = sdOpenAt();

/* ---------- v3.3 레시피 이미지 핀치 확대 · 이동 ---------- */
function initRZoom(el){
  if(!el || el._rz) return;
  var box = el.querySelector('.cbox');
  if(!box) return;
  el._rz = true;
  var s = 1, sBase = 1, tx = 0, ty = 0, s0 = 1, tx0 = 0, ty0 = 0, d0 = 0;
  var mx0 = 0, my0 = 0, x0 = 0, y0 = 0, n = 0, moved = false, lastTap = 0;
  box.style.transformOrigin = '0 0';
  box.style.willChange = 'transform';
  /* 잘라낸 이미지가 가로로 긴 한 줄이면(높이가 낮으면) 처음부터 읽을 수 있는 크기로 키워 둔다 */
  function startScale(){
    var w = el.clientWidth, h = el.clientHeight;
    if(!w || !h || w > 560) return;   /* 폰 폭에서만 자동 확대 (아이패드는 전체 줄이 다 보이게) */
    var target = Math.max(120, Math.round(w * 0.17));
    if(h >= target) return;
    sBase = Math.min(5, target / h);
    el.style.height = target + 'px';
    if(s <= 1.001){ s = sBase; tx = 0; ty = 0; bounds(); }
  }
  setTimeout(startScale, 30);
  var im0 = el.querySelector('img');
  if(im0 && im0.addEventListener) im0.addEventListener('load', function(){ setTimeout(startScale, 10); });
  function apply(){ box.style.transform = 'translate(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px) scale(' + s.toFixed(4) + ')'; }
  function bounds(){
    var w = el.clientWidth, h = el.clientHeight;
    var maxX = Math.max(0, w * s - w), maxY = Math.max(0, h * s - h);
    if(tx > 0) tx = 0;
    if(ty > 0) ty = 0;
    if(tx < -maxX) tx = -maxX;
    if(ty < -maxY) ty = -maxY;
    if(s <= 1.001){ s = 1; tx = 0; ty = 0; }
    else if(maxY <= 0){ ty = 0; }
    apply();
  }
  function local(cx, cy){
    var r = el.getBoundingClientRect(), k = (window.FITK || 1);
    return { x: (cx - r.left) / k, y: (cy - r.top) / k };
  }
  function dist(t){
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy) || 1;
  }
  el.addEventListener('touchstart', function(e){
    n = e.touches.length;
    if(n === 2){
      s0 = s; tx0 = tx; ty0 = ty;
      d0 = dist(e.touches);
      mx0 = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      my0 = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      moved = true;
    } else if(n === 1){
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      tx0 = tx; ty0 = ty; moved = false;
    }
  }, { passive: true });
  el.addEventListener('touchmove', function(e){
    var k = (window.FITK || 1);
    if(e.touches.length === 2 && d0 > 0){
      e.preventDefault();
      var ns = Math.min(6, Math.max(1, s0 * dist(e.touches) / d0));
      var p = local(mx0, my0);
      var r = ns / s0;
      tx = p.x - (p.x - tx0) * r;
      ty = p.y - (p.y - ty0) * r;
      s = ns;
      bounds();
    } else if(e.touches.length === 1 && s > 1.001){
      e.preventDefault();
      var dx = (e.touches[0].clientX - x0) / k;
      var dy = (e.touches[0].clientY - y0) / k;
      if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      tx = tx0 + dx; ty = ty0 + dy;
      bounds();
    }
  }, { passive: false });
  el.addEventListener('touchend', function(e){
    if(e.touches.length > 0) return;
    d0 = 0;
    if(!moved){
      var now = Date.now();
      if(now - lastTap < 330){
        lastTap = 0;
        if(s > sBase * 1.05){ s = sBase; tx = 0; ty = 0; bounds(); }
        else {
          var t = (e.changedTouches && e.changedTouches[0]) || null;
          var p = t ? local(t.clientX, t.clientY) : { x: el.clientWidth / 2, y: el.clientHeight / 2 };
          var ns2 = Math.min(6, Math.max(2.4, sBase * 2.2));
          tx = p.x - (p.x - tx) * (ns2 / s);
          ty = p.y - (p.y - ty) * (ns2 / s);
          s = ns2;
          bounds();
        }
      } else { lastTap = now; }
    }
    moved = false;
  }, { passive: true });
}

/* ====== v4.9.5 재고 3칸 — 기준 · 입고 · 사용량 · 실재고 ==================
 * 동환 님 지시(2026-11-15): "입고 재고와 사용량, 그다음에 실 재고, 이 세 가지가
 * 구분되어 있는 화면이 없어. 사용량은 네가 입력해주지만 내가 수동으로도 변경할 수 있게.
 * 그게 실 재고로 마무리가 되지 않겠어?"
 *   기준  = 전일 마감을 이월했거나(이론재고 기준수량) 오늘 04:00 오픈 스냅샷
 *   입고  = 오늘 [발주] 탭에서 입고 반영된 수량(발주_입고 '반영')
 *   사용량 = 일별사용량(판매·레시피 자동 계산) → 없으면 오픈+입고−로스−현재고(실사 기반)
 *   실재고 = 기준 + 입고 − 로스 − 사용량. 현장 실사가 그날 있으면 실사값이 우선.
 * 값이 없는 칸은 '—'로 두고 근거(근거 없음 · 지난값 등)를 아래에 적는다.
 * ==================================================================== */
function uR3(v){
  var n = num(v);
  if(n === null) return null;
  return Math.round(n * 1000) / 1000;
}
function uSrcLabel(s){
  s = String(s || '');
  if(!s) return '';
  if(s === '오픈') return '오늘 오픈';
  if(s === '이월') return '전일 마감';
  if(s === '첫적용') return '기준 재계산';
  if(s === '실사') return '현장 실사';
  return s;
}
function uModel(it){
  var sd = (it && it.sd) || {};
  var today = String(S.today || '');
  var base = uR3(sd.tb), baseSrc = String(sd.tt || '');
  if(base === null && sd.o !== undefined && sd.o !== null){ base = uR3(sd.o); baseSrc = '오픈'; }
  var inb = uR3(sd.i) === null ? 0 : uR3(sd.i);
  var loss = uR3(sd.l) === null ? 0 : uR3(sd.l);
  var auto = uR3(sd.a), autoDay = String(sd.ad || '').slice(0, 10), autoSrc = String(sd.as || '');
  var use = null, useSrc = '', useDay = '';
  if(auto !== null && autoDay === today){
    use = auto;
    useSrc = (autoSrc.indexOf('수동') >= 0) ? '수동' : '자동';
  } else if(auto !== null && autoDay){
    use = auto; useSrc = '지난값'; useDay = autoDay.slice(5);
  } else if(sd.u !== undefined && sd.u !== null){
    use = uR3(sd.u); useSrc = '실사기반';
  }
  var audit = (sd.tm !== undefined && sd.tm !== null) ? uR3(sd.tm) : null;
  var close = null, closeSrc = '';
  if(audit !== null){ close = audit; closeSrc = '현장'; }
  else if(base !== null && use !== null){
    close = Math.round((base + inb - loss - use) * 1000) / 1000;
    closeSrc = (useSrc === '수동') ? '수동' : (useSrc === '지난값' ? '지난값' : '자동');
  } else if(sd.c !== undefined && sd.c !== null){ close = uR3(sd.c); closeSrc = '현재고'; }
  var reason = '';
  if(base === null && close === null) reason = '재고 기록 없음 — 실사로 세어 저장하면 계산이 시작됩니다';
  else if(base === null) reason = '기준 없음 — 지금 현재고만 있습니다';
  else if(use === null) reason = '사용량 근거 없음 — 사용량 칸을 눌러 직접 넣어 주세요';
  /* 계산 실재고와 재고실사 현재고가 다를 때 — 숫자를 숨기지 않고 나란히 보여 준다. */
  var cur = (sd.c !== undefined && sd.c !== null) ? uR3(sd.c) : null;
  var mismatch = (audit === null && close !== null && cur !== null && Math.abs(close - cur) > 0.005);
  if(mismatch && !reason) reason = '계산 실재고와 재고실사 현재고가 다릅니다 — 사용량을 고쳐 저장하면 현재고가 같이 맞춰집니다';
  return { base: base, baseSrc: baseSrc, inb: inb, loss: loss,
           use: use, useSrc: useSrc, useDay: useDay, auto: auto, autoDay: autoDay, autoSrc: autoSrc,
           audit: audit, close: close, closeSrc: closeSrc, cur: cur, mismatch: mismatch, reason: reason };
}
/* 칸 안 숫자 — 좁으므로 박스는 '6.31박스'까지만(낱개 환산은 시트·풀이 문구에) */
function uQty1(v, it){
  if(v === null || v === undefined) return '—';
  return xQtyC(v, it);
}
function uQtyFull(v, it){
  if(v === null || v === undefined) return '—';
  return xQty(v, it);
}
function uInbTxt(v, it){
  if(!v) return '0';
  var k = unitKind(it && (it.u || it.spec));
  return '+' + fmtNum(v) + (k === 'box' || k === 'pk' ? UNIT_WORD[k] : (k === 'ea' ? ' EA' : ''));
}
function xDiffTag(th, v, it){
  var n = num(v);
  if(n === null || th === null || th === undefined) return '';
  var d = Math.round((n - th) * 1000) / 1000;
  if(d === 0) return '<em class="x-bg mut">차이 ±0</em>';
  var p = it ? packOfItem(it) : null;
  var txt = fmtNum(Math.abs(d));
  if(p){
    var each = Math.round(Math.abs(d) * p.n);
    txt = each > 0 ? (fmtNum(each) + p.u) : (fmtNum(Math.abs(d)) + p.label);
  }
  return '<em class="x-bg ' + (d < 0 ? 'bad' : 'ok') + '">차이 ' + (d < 0 ? '−' : '+') + txt + '</em>';
}
function xStockHead(it, low, m, filled, v){

/* v4.9.9 — 실사 입력칸. 포장 품목(입수를 아는 박스·팩)은 [박스/팩] [낱개] 두 칸,
 * 그 밖(EA·중량)은 지금처럼 한 칸. 두 칸의 합이 저장값(포장 소수)이 된다. */
function xAuditInp(it, filled, v){
  var p = packOfItem(it);
  /* 박스·팩만 두 칸으로 나눈다. EA(1EA)와 중량·용량 품목은 한 칸 그대로. */
  if(p && p.k === 'ea') p = null;
  var nm = esc(it.n);
  var attr = ' data-name="' + nm + '" data-r="' + it.r + '"';
  if(!p){
    return '<div class="u-in"><div class="u-split"><input class="x-qin q' + (filled ? ' has' : '') + '" type="text"'
      + ' inputmode="decimal" data-name="' + nm + '" data-r="' + it.r + '" value="' + esc(v) + '" placeholder="—"'
      + ' aria-label="' + nm + ' 현장 실사 수량"></div></div>';
  }
  var sp = filled ? qtySplit(v, p) : null;
  return '<div class="u-in"><div class="u-split">'
    + '<label class="u-f"><input class="x-qin x-qs q' + (filled ? ' has' : '') + '"' + attr + ' data-part="b"'
    + ' value="' + esc(sp ? sp.b : '') + '" placeholder="0" aria-label="' + nm + ' ' + esc(p.label) + ' 수">'
    + '<em>' + esc(p.label) + '</em></label>'
    + '<label class="u-f"><input class="x-qin x-qs q' + (filled ? ' has' : '') + '"' + attr + ' data-part="e"'
    + ' value="' + esc(sp ? sp.e : '') + '" placeholder="—" aria-label="' + nm + ' 낱개(' + esc(p.u) + ') 수">'
    + '<em>' + esc(p.u) + '</em></label>'
    + '</div></div>';
}
/* 저장 확인창에 쓸 수량 문구 — '0.7박스(7개)' */
function xAuditTxt(name, q){
  var it = itemByName(name);
  var p = it ? packOfItem(it) : null;
  if(!p) return fmtNum(q);
  return fmtNum(q) + p.label + '(' + pkgTxt(q, p) + ')';
}
/* 두 칸 입력 → 저장값(포장 소수). 낱개에 입수 이상을 넣어도 그대로 더한다. */
function xQtyPartInput(el){
  var nm = el.getAttribute('data-name');
  var it = itemByName(nm);
  if(!it) return;
  /* 수량 칸이므로 숫자와 소수점만 남긴다 */
  var clean = String(el.value || '').replace(/[^0-9.]/g, '');
  var dot = clean.indexOf('.');
  if(dot >= 0) clean = clean.slice(0, dot + 1) + clean.slice(dot + 1).replace(/\./g, '');
  if(clean !== el.value){
    el.value = clean;
    try{ el.setSelectionRange(clean.length, clean.length); }catch(e){}
  }
  var p = packOfItem(it);
  if(!p){ setQty(nm, clean); return; }
  var row = el.closest ? el.closest('.x-row') : null;
  var bEl = row ? $('[data-part="b"]', row) : null;
  var eEl = row ? $('[data-part="e"]', row) : null;
  var bs = bEl ? String(bEl.value || '').trim() : '';
  var es = eEl ? String(eEl.value || '').trim() : '';
  if(bs === '' && es === ''){
    delete S.cur[nm];
    delete S.touched[nm];
    if(row){
      row.classList.remove('done');
      $$('.x-qin', row).forEach(function(inp){ inp.classList.remove('has'); });
    }
    updateProgress();
    return;
  }
  var b = num(bs), e = num(es);
  var q = (b === null ? 0 : b) + ((e === null ? 0 : e) / p.n);
  q = Math.round(q * 1000) / 1000;
  S.cur[nm] = String(q);
  S.touched[nm] = true;
  if(row){
    row.classList.add('done');
    $$('.x-qin', row).forEach(function(inp){
      inp.classList.toggle('has', String(inp.value || '').trim() !== '');
    });
  }
  updateProgress();
}
function xStockRow(it){
  var m = uModel(it);
  var filled = touchedQty(it.n) !== null;
  var v = filled ? valueOf(it) : '';
  var sf = num(it.sf);
  var low = (m.close !== null && sf !== null && sf > 0 && m.close < sf);
  var auditInp = xAuditInp(it, filled, v);
  /* 한 번도 세지 않은 품목은 네 칸이 모두 비므로 줄을 늘이지 않는다. */
  var empty = (m.base === null && m.use === null && m.close === null && !m.inb && !m.loss);
  if(empty){
    return '<div class="x-row u-row slim' + (filled ? ' done' : '') + '" id="row-' + it.r + '" data-name="' + esc(it.n) + '" data-th="">'
      + '<div class="u-top">' + xStockHead(it, false, m, filled, v) + auditInp + '</div>'
      + dcItemTag(it.n)
      + '<div class="u-note">재고 기록 없음 — 실사로 세어 저장하면 기준·사용량 계산이 시작됩니다</div></div>';
  }
  var sfTxt = (m.close !== null && sf !== null && sf > 0) ? '안전 ' + xQtyC(sf, it) : '';
  /* v4.11.0 — 시각 계층 정리: 품목명 → 실재고 큰 숫자 → 근거 칸(기준·입고·사용량).
   * 값의 원천(전일 마감·자동·현장 실사…)은 지우지 않고 작은 글씨로 남긴다. */
  var closeSrcTxt = (m.close === null) ? '기록 없음'
    : (m.mismatch ? '현재고 ' + uQty1(m.cur, it)
                  : (m.closeSrc === '현장' ? '현장 실사' : (m.closeSrc === '현재고' ? '현재고' : '계산')));
  var h = '<div class="x-row u-row' + (filled ? ' done' : '') + '" id="row-' + it.r + '" data-name="' + esc(it.n) + '" data-th="' + (m.close === null ? '' : m.close) + '">'
    + '<div class="u-top">' + xStockHead(it, low, m, filled, v) + auditInp + '</div>'
    + dcItemTag(it.n)
    + '<div class="u-now' + (low ? ' low' : '') + '">'
    + '<em class="k">실재고</em>'
    + '<b class="v' + (m.close === null ? ' na' : '') + '" title="' + esc('실재고 ' + uQtyFull(m.close, it) + (sfTxt ? ' · ' + sfTxt : '')) + '">' + esc(uQtyFull(m.close, it)) + '</b>'
    + '<em class="s' + (m.mismatch ? ' warn' : '') + '">' + esc(closeSrcTxt) + '</em>'
    + '</div>'
    + '<div class="u-g">'
    /* 기준 — 전일 마감을 이월했거나 오늘 오픈 스냅샷 */
    + '<span class="u-c"><i class="k">기준</i>'
    + '<b class="v' + (m.base === null ? ' na' : '') + '" title="' + esc(m.base === null ? '기준 없음' : uQtyFull(m.base, it)) + '">' + esc(uQty1(m.base, it)) + '</b>'

/* ================================================================ 발주 */
/* v4.9.1 — 동환 님 지시(2026-11-14): "발주 수량은 내가 알아서 선택해서 할게 그게 맞는거 같은데
 * 실재고 부족한 부분만 미리 알려줘 참고 할 수 있게".
 * 그래서 추천값을 입력칸에 미리 채우지 않는다(누르기만 해도 큰 금액이 발주되던 위험 제거).
 * 앱이 하는 일은 품목마다 '이론재고 · 안전 · 부족'을 작게 적어 참고만 시키는 것이다. */
function xPrefillOrder(){ S.ordPrefilled = true; }
/* 참고 표기에만 쓰는 반올림 — 입력칸 기본값에는 적용하지 않는다. */
function xWhole(v){
  var n = num(v);
  if(n === null || n <= 0) return 0;
  var r = Math.round(n);
  return r < 1 ? 1 : r;
}
/* 참고 수량 표기 — 박스 품목은 '0.4박스(6개)'처럼 낱개를 함께, 그 밖은 숫자+단위. */
function xRefQ(v, r){
  var n = num(v);
  if(n === null) return '—';
  var u = r.u || r.spec || '';
  if(!unitKind(u)) return fmtNum(n) + (u ? ' ' + u : '');
  return qtyNum(n, r.n, u);
}
/* 부족 = 안전재고에 모자란 양. 안전재고가 걸리지 않은 품목은 비운다. */
function xSafeLack(r){
  if(r.cur === null || r.cur === undefined) return 0;
  if(r.sf === null || r.sf === undefined || !(r.sf > 0)) return 0;
  return Math.round(Math.max(0, r.sf - r.cur) * 1000) / 1000;
}
/* 목표까지 = 목표재고(주간소진 × 1.2, 약 8일분)에 모자란 양 */
function xRecGap(r){
  if(r.cur === null || r.cur === undefined) return 0;
  return r.rec > 0 ? r.rec : 0;
}
function xOrdNewHead(g){
  var tbd = 0;
  (g || []).forEach(function(r){ if(r.price === null) tbd++; });
  return '신규 품목 ' + (g || []).length + '개 · 발주 이력 없음' + (tbd ? ' (단가 미확인 ' + tbd + ')' : '');
}
function xOrdGroup(r){
  /* v4.12.9 — 신규 품목은 단가가 확정될 때까지 '재고 충분'으로 보이면 안 된다(재고 기록도 아직 없다). */
  if(isNewOrd(r.n)) return 'new';
  if(xSafeLack(r) > 0) return 'need';
  if(xRecGap(r) > 0) return 'near';
  return 'rest';
}
function xOrdRefLine(r){
  var p = ['이론재고 ' + (r.cur === null ? '미확인' : xRefQ(r.cur, r))];
  if(r.sf !== null && r.sf > 0) p.push('안전 ' + xRefQ(r.sf, r));
  var lack = xSafeLack(r);
  if(lack > 0) p.push('<b>부족 ' + xRefQ(lack, r) + '</b>');
  else if(xRecGap(r) > 0) p.push('목표까지 ' + xRefQ(xRecGap(r), r));
  else if(r.cur !== null) p.push('충분');
  return p.join(' · ');
}
function renderOrder(){
  xPrefillOrder();
  var h = '';
  if(S.xLastOrder){
    h += '<div class="x-hint ok">' + ic('check') + '<div><b>발주 신청 완료</b>'

  }

    + '</div></div>';
  h += '<div id="xOrdBody">' + xOrderListBody() + '</div>';
  h += '<div class="x-note">부족은 안전재고에 모자란 양입니다. 목표재고는 주간소진 × 1.2(약 8일분)이고 안전재고가 더 크면 그 값이 하한입니다. '
    + '발주불가 ' + blockedCount() + '종은 목록에서 제외했습니다. 금액은 부가세 포함입니다.'
    + (PRICE_TBD.length ? ' 단가 미확인 ' + PRICE_TBD.length + '품목(' + PRICE_TBD.join('·') + ')은 본사 출고가가 아직 공개되지 않아 금액을 비워 두었습니다.' : '') + '</div>';
  return h;
}

function xInboundCard(){

function xOrderList(){
  return xOrderListBody();
}
/* v4.9.1 — 부족한 품목을 위에, 나머지 발주 가능 품목은 아래에. 목록에서 숨기는 품목은 없다.
 * 수량 기본값은 전부 0이고, 직원이 스테퍼·직접 입력으로 정한다.
 * 부족(안전재고 미달) → 목표 미달(약 8일분 목표) → 그 외 순으로 놓는다. */
function xOrderListBody(){
  var rows = orderRows();
  if(!rows.length){
    return '<div class="x-card"><div class="x-empty"><b>발주 가능 품목 없음</b>발주 가능한 품목이 없습니다</div></div>';
  }
  var q = String(S.xOrdQ || '').trim().toLowerCase();
  var groups = { new: [], need: [], near: [], rest: [] };
  rows.forEach(function(r){
    if(q && String(r.n || '').toLowerCase().indexOf(q) < 0) return;
    groups[xOrdGroup(r)].push(r);
  });
  groups.need.sort(function(a, b){
    var sa = (a.sf && a.sf > 0) ? a.sf : 1;
    var sb = (b.sf && b.sf > 0) ? b.sf : 1;
    return (xSafeLack(b) / sb) - (xSafeLack(a) / sa);
  });
  groups.near.sort(function(a, b){ return xRecGap(b) - xRecGap(a); });
  var h = '<div class="x-card"><div class="x-ch"><span class="x-ct">발주 품목</span>'
    + '<span class="x-cn' + (groups.need.length ? ' bad' : '') + '">부족 ' + groups.need.length + '품목</span></div>';
  var heads = [
    ['new', xOrdNewHead(groups.new)],
    ['need', '부족 ' + groups.need.length + '품목 — 안전재고 미달'],
    ['near', '목표 미달 ' + groups.near.length + '품목 — 약 8일분 목표에 모자람'],
    ['rest', '그 외 ' + groups.rest.length + '개 — 재고 충분']
  ];
  heads.forEach(function(hd){
    var list = groups[hd[0]];
    if(!list.length) return;
    h += '<div class="x-sub" data-sec="' + hd[0] + '">' + hd[1] + '</div>';
    list.forEach(function(r){ h += xOrderRow(r); });
  });
  if(!groups.new.length && !groups.need.length && !groups.near.length){
    h += '<div class="x-note" style="padding:10px 14px">'
      + (q ? '검색 결과에 부족 품목이 없습니다.' : '부족 품목이 없습니다. 필요하면 아래 목록에서 골라 발주하세요.')
      + '</div>';
  }
  h += '<div class="x-note" style="padding:9px 14px 11px">수량은 0에서 시작합니다. 위 참고를 보고 필요한 만큼만 넣으면 그 품목만 신청됩니다. '
    + '포장 품목은 박스·팩 단위로 입력합니다(예: 0.5 = 반 박스, 1 = 한 박스).</div>';
  return h + '</div>';
}
function xOrderRow(r){
  var q = S.ord.hasOwnProperty(r.n) ? num(S.ord[r.n]) : 0;
  if(q === null) q = 0;
  var pk = packOf(r.n, r.u || r.spec);
  var meta = [];
  if(pk) meta.push('1' + pk.label + ' = ' + perLabel(pk));
  else if(r.u || r.spec) meta.push(r.u || r.spec);
  if(r.price !== null) meta.push(fmtNum(r.price) + '원');
  var amt = (r.price === null || q <= 0) ? null : Math.round(q * r.price);
  var sec = xOrdGroup(r);
  return '<div class="x-ol" data-name="' + esc(r.n) + '" data-sec="' + sec + '">'
    + '<div class="x-ol-l"><div class="x-ol-n">' + esc(r.n) + '</div>'
    + '<div class="x-ol-m">' + esc(meta.join(' · ')) + '</div>'
    + dcItemTag(r.n) + '</div>'
    + '<div class="x-stepper">'
    + '<button data-act="ordStep" data-name="' + esc(r.n) + '" data-d="-1" aria-label="' + esc(r.n) + ' 줄이기">' + ic('minus') + '</button>'
    + '<input class="oqin" inputmode="decimal" data-name="' + esc(r.n) + '" data-i="' + r.i + '" value="' + esc(q) + '" aria-label="' + esc(r.n) + ' 발주 수량">'
    + '<button data-act="ordStep" data-name="' + esc(r.n) + '" data-d="1" aria-label="' + esc(r.n) + ' 늘리기">' + ic('plus') + '</button>'
    + '</div>'
    + '<div class="x-amt' + (amt === null ? ' nil' : '') + '" data-amt="' + r.i + '" data-name="' + esc(r.n) + '">'
    + (amt === null ? (r.price === null ? '단가 없음' : '') : fmtNum(amt) + '원') + '</div>'
    + '<div class="x-ol-ref">' + xOrdRefLine(r) + '</div>'
    + '</div>';
}

    + uCalcRow('− 사용량', '<span id="uCalcUse">' + uQtyFull(m.use, it) + '</span>', m.use === null ? '근거 없음' : m.useSrc)

    + '<button class="x-btn" id="uSaveBtn" style="width:100%" data-act="xUSave" data-name="' + esc(nm) + '">'

function uOpen(name){
  var it = itemByName(name);
  if(!it){ toast('품목을 찾지 못했습니다', 'err'); return; }
  var m = uModel(it);
  S.uName = it.n;
  S.uQty = (m.use === null) ? '' : String(m.use);
  S.uSaving = false;
  S.xSheet = 'uEdit';
  render();
}
function uSaveUsage(name, raw){
  if(S.uSaving) return;
  var it = itemByName(name);
  if(!it){ toast('품목을 찾지 못했습니다', 'err'); return; }
  var q = num(raw);
  if(q === null || q < 0){ toast('사용량은 0 이상의 숫자로 넣어 주세요', 'err'); return; }
  /* 작성자 — 실사 저장과 같은 방식으로 한 번만 묻고 기기에 기억한다. */
  var author = String(S.author || '').trim();
  if(!author){
    author = String(xAsk('이름을 입력해 주세요 (사용량 수정 기록)', '') || '').trim();
    if(!author){ toast('저장하려면 이름이 필요합니다', 'err'); return; }
    S.author = author;
    try{ hostSet(LS_AUTHOR, author); }catch(e){}
  }
  S.uSaving = true;
  var btn = $('#uSaveBtn');
  if(btn){ btn.disabled = true; }
  call('saveUsage', { date: S.today || '', name: it.n, qty: q, author: author }).then(function(res){
    if(!res || res.ok === false) throw new Error((res && res.error) || '저장 실패');
    var sd = it.sd || (it.sd = {});
    var use = (res.use === undefined || res.use === null) ? q : num(res.use);
    sd.a = use; sd.ad = String(S.today || ''); sd.as = '수동';
    if(res.base !== undefined) sd.tb = res.base;
    if(res.inb !== undefined) sd.i = res.inb;
    if(res.loss !== undefined) sd.l = res.loss;
    if(res.close !== undefined && res.close !== null){
      sd.c = num(res.close);
      it.cur = sd.c;
      if(sd.o !== undefined && sd.o !== null){
        sd.u = Math.round(((num(sd.o) || 0) + (num(res.inb) || 0) - (num(res.loss) || 0) - sd.c) * 1000) / 1000;
      }
    }
    S.uSaving = false; S.uName = ''; S.xSheet = null;
    try{ render(); }catch(e){}
    toast('사용량 ' + xQty(use, it) + ' 저장 · 실재고 '
      + (sd.c === null || sd.c === undefined ? '계산 불가' : xQty(sd.c, it)), 'ok');
  }).catch(function(e){
    S.uSaving = false;
    var b = $('#uSaveBtn');
    if(b) b.disabled = false;
    toast('사용량 저장 실패 — ' + errMsg(e), 'err');
  });
}

/* ---------------------------------------------------------- 입고 검수 시트 */
function xInboundSheet(){
  var f = S.flow;
  if(!f) return '<div class="x-empty"><b>불러오는 중…</b>발주 자료를 기다리고 있습니다</div>';
  var pend = (f.orders || []).filter(function(o){ return o.due && !o.done; });
  var man = (f.manual || []).filter(function(o){ return o.due; });
  /* v4.12.27 — 오늘 반영된 것 중 재고 이름이 맞지 않은 품목(서버 needsToday) */
  var needToday = (f.needsToday && f.needsToday.count) ? f.needsToday : null;
  if(!pend.length && !man.length){
    var doneToday = (f.recent || []).filter(function(r){ return r.status === '반영' && String(r.at || '').slice(0,10) === f.today; }).length;
    return xApplyMsg()
      + (needToday ? xNeedCard((needToday.names || []).map(function(n){ return { name: n }; })) : '')
      + '<div class="x-empty"><b>입고 예정 없음</b>지금 확인할 입고 건이 없습니다'
      + (doneToday ? '<div style="margin-top:6px">오늘 ' + doneToday + '품목을 재고에 반영했습니다.</div>' : '')
      + '</div>';
  }
  var h = xApplyMsg();
  if(needToday) h += xNeedCard((needToday.names || []).map(function(n){ return { name: n }; }));
  if(pend.length + man.length > 1){
    h += '<div class="x-card" style="padding:11px 14px;display:flex;align-items:center;gap:10px">'
      + '<div style="flex:1;font-size:12.5px;font-weight:700;color:var(--x-muted);line-height:1.4">'
      + (pend.length + man.length) + '건 도착 예정<br>체크한 품목을 한 번에 반영할 수 있습니다</div>'
      + '<button class="x-btn" style="width:auto;padding:0 15px;flex:0 0 auto" data-act="xApplyAll"'
      + (S.xApplying ? ' disabled' : '') + '>' + ic('check') + (S.xApplying ? '반영 중…' : '전체 반영') + '</button></div>';
  }
  pend.forEach(function(o){ h += xInboundGroup(o.kind, o.id, o.at, o.eta, o.lines, o.amount); });
  man.forEach(function(m){
    h += xInboundGroup('manual', m.id, m.at, m.eta,
      [{ name: m.name, qty: m.qty, unit: '', inbound: m.inbound || null, pending: !!m._pend }], m.qty * (m.price || 0));
  });
  h += '<div class="x-note">도착하지 않은 품목은 체크를 풀어 두세요. 그 품목은 입고 대기로 남습니다.</div>';
  return h;
}

/* v4.12.27 — 재고 이름이 맞지 않아 수량을 넣지 못한 품목. 버리지 않고 화면에 남긴다. */

  return '<div class="x-card" style="padding:11px 14px;border:1.5px solid #F0D4A8;background:#FFFBF2;margin-top:8px">'
    + '<b style="font-size:13px;color:#8A5A12">재고 이름 확인 필요 ' + list.length + '품목</b>'
    + '<div style="margin-top:4px;font-size:12.5px;line-height:1.45;word-break:break-all">' + names + more + '</div>'
    + '<div style="margin-top:5px;font-size:12px;color:var(--x-muted)">입고는 확인됐지만 재고실사 품목명과 달라 수량을 넣지 못했습니다. 재고실사 이름을 확인해 주세요.</div></div>';
}

    + '<button class="x-btn" style="flex:1;height:44px" data-act="xApply" data-kind="' + esc(kind) + '" data-id="' + esc(String(id)) + '"'

/* ---------------------------------------------- v4.12.22 입고 반영(배치·낙관적)
 * 예전: 버튼 → applyInbound(3.1초) → getOrderFlow(3.9초) → getBootstrap(1.3초) 왕복 3회.
 *       성공하면 시트를 닫고, 시트가 코드로 닫히면 뒤로가기 훅이 history.back() 을 불러
 *       앱 프레임의 문서가 넘어갔다(= 화면이 튕겨 나감).
 * 지금: 버튼 → applyInbound 1회(여러 건 묶음). 응답에 바뀐 현재고·처리 결과가 들어 있어
 *       따라 부르는 조회가 없다. 누른 즉시 '반영 중'으로 바꿔 값이 바로 보이게 하고,
 *       성공하면 같은 화면에서 확정, 실패하면 되돌리고 이유를 한 줄로 남긴다.
 * ------------------------------------------------------------------------- */
function xOrderRef(kind, id){
  var f = S.flow || {};
  if(kind === 'manual'){
    var m = (f.manual || []).filter(function(x){ return String(x.id) === String(id); })[0];
    return m || null;
  }
  var list = f.orders || [];
  for(var i = 0; i < list.length; i++){ if(String(list[i].id) === String(id)) return list[i]; }
  return null;
}
/* 체크된 줄과 입력 수량을 모은다. */
function xApplyPick(kind, id){
  var lines = ofPendingLines(kind, id);
  var st = ofChkStats(lines, kind, id);
  var pick = [], edited = false;
  lines.forEach(function(l, i){
    if(l.inbound || l.pending) return;
    if(!ofIsChecked(kind, id, i)) return;
    var inp = $('.of-edit[data-id="' + id + '"][data-kind="' + kind + '"][data-i="' + i + '"]');
    var q = inp ? num(inp.value) : null;
    if(q === null) q = num(l.qty) || 0;
    if(q !== (num(l.qty) || 0)) edited = true;
    pick.push({ name: l.name, qty: q, unit: l.unit || '' });
  });
  return { pick: pick, st: st, edited: edited };
}
function xApplyIn(kind, id){
  if(S.xApplying) return;
  var p = xApplyPick(kind, id);
  if(!p.pick.length){ toast('도착한 품목을 체크해 주세요', 'err'); return; }
  var diff = (p.st.off > 0) || p.edited;
  if(diff){
    var msg = '도착한 ' + p.pick.length + '품목만 입고 반영할까요?'
      + (p.st.off ? '\n체크하지 않은 ' + p.st.off + '품목은 입고 대기로 남깁니다.' : '');
    if(!confirm(msg)) return;
  }
  xApplySend([{ kind: kind, id: String(id), lines: p.pick }], kind + ':' + String(id));
}
/* 여러 건을 한 번의 요청으로 — 체크한 품목만 모아 보낸다. */
function xApplyAll(){
  if(S.xApplying) return;
  var f = S.flow || {};
  var targets = [];
  (f.orders || []).forEach(function(o){ if(o.due && !o.done) targets.push({ kind: o.kind, id: String(o.id) }); });
  (f.manual || []).forEach(function(m){ if(m.due) targets.push({ kind: 'manual', id: String(m.id) }); });
  var reqs = [], n = 0, off = 0, edited = false;
  targets.forEach(function(t){
    var p = xApplyPick(t.kind, t.id);
    if(!p.pick.length){ off += p.st.left; return; }
    reqs.push({ kind: t.kind, id: t.id, lines: p.pick });
    n += p.pick.length; off += p.st.off; edited = edited || p.edited;
  });
  if(!reqs.length){ toast('도착한 품목을 체크해 주세요', 'err'); return; }
  var msg = '체크한 ' + n + '품목을 입고 반영할까요?'
    + (off ? '\n체크하지 않은 ' + off + '품목은 입고 대기로 남깁니다.' : '')
    + (reqs.length > 1 ? '\n(' + reqs.length + '건을 한 번에 처리합니다)' : '');
  if(!confirm(msg)) return;
  xApplySend(reqs, 'all');
}
/* 되돌리기용 스냅숏 — 건드리는 건의 줄 상태와 영향 품목의 현재고만 담는다. */
function xApplySnapshot(reqs){
  var stock = {}, rows = [];
  reqs.forEach(function(r){
    var ord = xOrderRef(r.kind, r.id);
    rows.push({ kind: r.kind, id: String(r.id), inb: (ord && ord.inbound) ? ord.inbound : null,
      lines: (r.kind === 'manual' || !ord) ? [] : (ord.lines || []).map(function(l){ return { inbound: l.inbound || null }; }) });
    r.lines.forEach(function(p){
      if(stock[p.name] !== undefined) return;
      var it = itemByName(p.name);
      if(it) stock[p.name] = { cur: (it.cur === undefined ? null : it.cur),
                               sd: it.sd ? JSON.parse(JSON.stringify(it.sd)) : null };
    });
  });
  return { rows: rows, stock: stock };
}
function xApplyRestore(){
  var sn = S.xApplySnap;
  if(!sn) return;
  sn.rows.forEach(function(s){
    var ord = xOrderRef(s.kind, s.id);
    if(!ord) return;
    if(s.kind === 'manual'){ ord.inbound = s.inb; delete ord._pend; }
    else {
      (ord.lines || []).forEach(function(l, i){
        var sv = s.lines[i];
        if(!sv) return;
        if(sv.inbound) l.inbound = sv.inbound; else delete l.inbound;
        delete l.pending;
      });
    }
  });
  for(var nm in sn.stock){
    var it = itemByName(nm);
    if(!it) continue;
    if(sn.stock[nm].cur !== null) it.cur = sn.stock[nm].cur;
    if(sn.stock[nm].sd) it.sd = sn.stock[nm].sd;
  }
}
/* 서버가 돌려준 결과로 줄 상태를 확정한다. */
function xApplyPatch(kind, id, res){
  var ord = xOrderRef(kind, id);
  if(!ord) return;
  var marks = {};
  (res.lines || []).forEach(function(x){ marks[x.name] = x; });
  var at = res.at || '';
  var by = S.author || '';
  if(kind === 'manual'){
    delete ord._pend;
    if(marks[ord.name]) ord.inbound = { at: at, by: by, qty: marks[ord.name].qty, key: marks[ord.name].key || '' };
  } else {
    (ord.lines || []).forEach(function(l){
      delete l.pending;
      if(l.inbound) return;
      if(marks[l.name]) l.inbound = { at: at, by: by, qty: marks[l.name].qty, key: marks[l.name].key || '' };
    });
  }
  if(ord.recordOnly) return;
  var done = 0, all = 0;
  if(kind === 'manual'){ all = 1; done = dirCountOne(ord.inbound); }
  else { all = (ord.lines || []).length; (ord.lines || []).forEach(function(l){ if(l.inbound) done++; }); }
  ord.applied = done;
  ord.done = !!(all && done >= all);
}
function dirCountOne(v){ return v ? 1 : 0; }
function xApplyCounts(){
  try{
    var f = S.flow || {}, pend = 0, done = 0;
    (f.orders || []).forEach(function(o){
      if(o.done) done++;
      else if(o.due && !o.recordOnly) pend++;
    });
    (f.manual || []).forEach(function(m){ if(m.inbound) done++; else if(m.due) pend++; });
    f.counts = f.counts || {};
    f.counts.pending = pend;
    f.counts.done = done;
  }catch(e){}
}
function xSec(ms){
  if(!(ms >= 0)) return '';
  return (ms < 1000) ? (Math.round(ms) + 'ms') : ((ms / 1000).toFixed(1) + '초');
}
function xApplySend(reqs, target){
  if(S.xApplying || !reqs.length) return;
  var t0 = Date.now();
  S.xApplySnap = xApplySnapshot(reqs);
  S.xApplyErr = ''; S.xApplyOk = '';
  S.xApplying = true; S.xApplyTarget = target || (reqs[0].kind + ':' + reqs[0].id);
  /* 낙관적 표시 — 누른 즉시: 줄은 '반영 중', 재고 숫자는 미리 올린다 */
  reqs.forEach(function(r){
    var byName = {};
    r.lines.forEach(function(p){ byName[p.name] = (byName[p.name] || 0) + (num(p.qty) || 0); });
    var ord = xOrderRef(r.kind, r.id);
    if(ord){
      if(r.kind === 'manual'){ ord._pend = true; }
      else (ord.lines || []).forEach(function(l){
        if(l.inbound) return;
        if(byName[l.name] !== undefined) l.pending = true;
      });
    }
    for(var nm in byName){
      var it = itemByName(nm);
      if(it && it.cur !== null && it.cur !== undefined){
        it.cur = Math.round(((num(it.cur) || 0) + byName[nm]) * 1000) / 1000;
      }
    }
  });
  render();
  call('applyInbound', { items: reqs, author: S.author || '' }).then(function(res){
    if(!res || res.ok === false) throw new Error((res && res.error) || '반영 실패');
    var ms = Date.now() - t0;
    xApplyRestore();                       /* 먼저 눌리기 전으로 되돌린 뒤 서버 값으로 확정 */
    var applied = 0, bad = [], badMsg = [];
    var needs = res.needs || [];
    S.xApplyNeeds = needs;
    (res.results || []).forEach(function(r){
      if(!r || r.ok === false){
        bad.push(r || {});
        if(r && r.error) badMsg.push(String(r.error));
        return;
      }
      applied += (r.applied || 0);
      xApplyPatch(r.kind, r.id, r);
    });
    var stock = res.stock || {};
    for(var nm in stock){
      var it = itemByName(nm);
      if(it && stock[nm] !== null && stock[nm] !== undefined) it.cur = num(stock[nm]);
    }
    xApplyCounts();
    delete S.xApplySnap;
    S.xApplying = false; S.xApplyTarget = '';
    var at = res.at || '';
    var stockN = (res.stockApplied === undefined) ? applied : (res.stockApplied || 0);
    if(bad.length){
      S.xApplyErr = applied
        ? (applied + '품목은 반영했습니다. ' + bad.length + '건은 실패했습니다' + (badMsg.length ? ' — ' + badMsg[0] : ''))
        : ('반영하지 못했습니다' + (badMsg.length ? ' — ' + badMsg[0] : ''));
      S.xApplyOk = '';
    } else {
      S.xApplyOk = stockN + '품목 입고 반영 완료 · ' + xSec(ms) + (at ? ' · ' + String(at).slice(11, 16) : '')
        + (needs.length ? ' · 재고 이름 확인 필요 ' + needs.length + '품목' : '');
      S.xApplyErr = '';
    }
    render();                              /* 같은 자리에서 갱신 — 탭 이동 없음, 시트 유지 */
    toast(bad.length ? '입고 반영 일부 실패 — ' + (badMsg[0] || '이유 미상')
                     : (stockN + '품목 입고 반영 완료' + (needs.length ? ' · 확인 필요 ' + needs.length : '')),
          bad.length ? 'err' : 'ok');
  }).catch(function(e){
    xApplyRestore();
    delete S.xApplySnap;
    S.xApplying = false; S.xApplyTarget = '';
    S.xApplyOk = '';
    S.xApplyErr = errMsg(e);
    render();
    toast('입고 반영 실패 — ' + S.xApplyErr, 'err');
  });
}

/* v4.9.8 — 공지 본문 블록(문단·알약 제목·표·이미지)을 원문 순서대로 그린다.
   이미지는 지연 로딩이고, 누르면 화면을 덮는 확대 보기(xImgZoom)가 열린다. */
function renderDocBlocks(blocks){
  var h = '';
  for(var i = 0; i < blocks.length; i++){
    var b = blocks[i];
    if(!b || !b.length) continue;
    var t = b[0], v = b[1];
    if(t === 'i'){
      h += '<div style="margin:10px 0"><img src="' + esc(v) + '" alt="공지 본문 이미지" loading="lazy" decoding="async"'
        + ' data-act="zoomImg" data-u="' + esc(v) + '"'
        + ' style="display:block;width:100%;border-radius:10px;border:1px solid #eee;cursor:zoom-in"></div>';
    } else if(t === 'h'){
      h += '<div style="margin:16px 0 8px"><span style="display:inline-block;background:#F48184;color:#fff;font-weight:800;font-size:14px;padding:7px 16px;border-radius:999px;letter-spacing:-0.2px">' + esc(v) + '</span></div>';
    } else if(t === 't'){
      var rows = v || [];
      if(!rows.length) continue;
      var kv = rows[0].length === 2;
      h += '<div style="margin:8px 0;overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px;color:#333">';
      for(var ri = 0; ri < rows.length; ri++){
        var r = rows[ri] || [], head = (ri === 0 && !kv);
        h += '<tr>';
        for(var ci = 0; ci < r.length; ci++){
          var st = 'border:1px solid #e6ded6;padding:6px 8px;vertical-align:top;line-height:1.45;';
          if(head) st += 'background:#f7efe9;font-weight:800;text-align:center;';
          else if(kv && ci === 0) st += 'background:#fbf7f3;font-weight:700;white-space:nowrap;width:30%;';
          h += '<td style="' + st + '">' + esc(r[ci]).replace(/\n/g, '<br>') + '</td>';
        }
        h += '</tr>';
      }
      h += '</table></div>';
    } else {
      h += '<div style="margin-top:8px;font-size:14px;line-height:1.6;color:#444;white-space:pre-wrap">' + esc(v) + '</div>';
    }
  }
  return h;
}

    if(m.size) meta.push(m.size);
    /* v4.9.2 — v4.8.3 카드의 썸네일·설명을 행으로 되살린다. 이미지가 없으면 영역 자체를 그리지 않고,
       깨진 이미지는 onerror 로 지워 텍스트가 밀리지 않는다. 지연 로딩이라 60행을 그려도 부담이 없다.
       열량·알레르기(m.kh/ki/al)는 지금 데이터에 값이 없어 행에 넣지 않는다(레시피 시트가 담당). */
    return '<div class="x-mrow">'
      + (m.img ? '<img class="x-mthumb" src="' + esc(m.img) + '" alt="" loading="lazy" decoding="async" onerror="this.remove()">' : '')
      + '<div class="x-mrow-l"><div class="x-mrow-n"><i>' + esc(m.n) + '</i>'
      + (m.isNew ? '<em class="x-bg new">NEW</em>' : '') + '</div>'
      + '<div class="x-mrow-m">' + esc(meta.join(' · ')) + '</div>'
      + (m.d ? '<div class="x-mrow-d">' + esc(m.d) + '</div>' : '')
      + dcMenuTag(m.n) + '</div>'
      + '<div class="x-price">' + fmtWon(m.p) + '</div>'
      + (hasRecipe(m.n) ? '<button class="x-btn2" style="height:34px;padding:0 10px;font-size:12px" data-act="recipe" data-name="' + esc(m.n) + '">레시피</button>' : '')
      + '</div>';
  }).join('');
  if(list.length > lim){
    h += '<div style="padding:10px 14px"><button class="x-btn2" style="width:100%" data-act="xMoreMenu">더 보기 ('
      + (list.length - lim) + '개)</button></div>';
  }
  return h;
}

/* ================================================================ 화면 조립 */

    main.innerHTML = S.loadErr
      ? '<div class="x-card"><div class="x-empty"><b>데이터를 불러오지 못했습니다</b>' + esc(S.loadErr)
        + '<div style="margin-top:12px"><button class="x-btn2" data-act="reload">다시 시도</button></div></div></div>'
      : renderSkel();
    xPaintSheet();
    xSync();
    return;
  }
  var html;
  if(S.tab === 'stock') html = renderStock();
  else if(S.tab === 'order') html = renderOrder();
  else if(S.tab === 'resources') html = renderResources();

  xSync();

  xSaveBar();
  try { postAppBadge(); } catch(e){}     /* v4.12.17 — 화면이 갱신될 때마다 아이콘 숫자도 다시 센다 */

function syncChrome(){ xSync(); }
function updateProgress(){
  var q = auditItems();
  var done = 0;
  q.forEach(function(it){ if(touchedQty(it.n) !== null) done++; });
  var extra = 0;
  (S.extra || []).forEach(function(n){ if(touchedQty(n) !== null) extra++; });
  var total = q.length + (S.extra || []).length;
  var pct = total ? Math.round((done + extra) / total * 100) : 0;
  var bar = $('#progressBar');
  if(bar) bar.style.width = pct + '%';
  var txt = $('#progressText');
  if(txt) txt.textContent = total ? ((done + extra) + '/' + total + ' 입력') : '실사 품목 없음';
  $$('.x-row[data-name]').forEach(function(row){
    var nm = row.getAttribute('data-name');
    var it = itemByName(nm);
    if(!it) return;
    var th = num(row.getAttribute('data-th'));
    var v = S.touched[nm] ? S.cur[nm] : '';
    var m = $('.x-row-m', row);
    if(m){
      m.innerHTML = '이론 <b>' + (th === null ? '—' : xQty(th, it)) + '</b> · 차이 ' + xDiffTxt(th, v);
    }
    /* v4.9.5 — 입력하는 대로 품목 이름 옆 '차이' 배지를 다시 쨀다. */
    var dt = $('.u-diff', row);
    if(dt) dt.innerHTML = (S.touched[nm] && touchedQty(nm) !== null) ? xDiffTag(th, v, it) : '';
    var tg = $('.u-m', row);
    if(tg) tg.textContent = xTagTxt(it, S.touched[nm] ? v : null);
  });
  xSaveBar();
}
function resetOrderQty(){ S.ord = {}; S.ordPrefilled = false; S.xOrdQ = ''; }
/* v4.9.3 — 공지/매뉴얼 시트를 닫으면 검색어를 비운다. 남아 있으면 다음에 열 때
 * 1건만 보여 '공지가 사라졌다'로 오해한다(전수점검 실측). */
function xSheetCloseState(){
  if(S.xSheet === 'notice' || S.xSheet === 'docs') S.noticeQ = '';

function setTab(t){
  var mapSheet = { notice: 'notice', menu: 'menu', live: 'today' };
  var mapTab = { notice: 'resources', menu: 'resources', live: 'home', history: 'home', loss: 'stock', settings: 'home' };
  var sheet = mapSheet[t] || null;
  if(mapTab[t]) t = mapTab[t];
  if(S.xSheet === 'notice' || S.xSheet === 'docs') S.noticeQ = '';
  if(S.tab === t && !sheet){
    S.xSheet = null;
    scrollMainTop();
    render();
    return;
  }
  S.tab = t;
  S.xSheet = sheet;
  if(t === 'order') resetOrderQty();
  scrollMainTop();
  if(t === 'order' && S.ready){ refreshOrders(true); loadOrderFlow(true); }
  if(t === 'resources'){ try{ ensureDocs(); }catch(e){} loadNotices(); ensureRecipes(); }   /* v4.12.25 — 레시피 자료는 이때 받는다 */
  if(t === 'home' || sheet === 'today'){
    livePollStart();
    loadLive(true);
    if(!S.flow && S.ready) loadOrderFlow(true);   /* 홈의 발주 마감 줄 */
  }
  else livePollStop();
  render();
}
/* 앱이 준비된 뒤: 공지·마감 팝업 + 매출·발주일정 한 번씩 읽기 */
function liveAfterBoot(){
  try { loadNotices(); updateNoticeBadge(); } catch(e){}
  try { maybeNoticePopup(); } catch(e){}
  try { oapCheck(); } catch(e){}
  /* v4.12.25 — 시작할 때 이미 매출을 불러왔으면 또 부르지 않는다(20초 안). */
  if(!S.liveAt || (Date.now() - S.liveAt) > 20000) loadLive(true);
  try { if(!S.flow) loadOrderFlow(true); } catch(e){}
  try { postAppBadge(true); askBadgeState(); } catch(e){}   /* v4.12.17 — 아이콘 숫자·권한 상태 */

}
function loadOrderFlow(silent){
  if(S.flowLoading) return Promise.resolve(false);
  S.flowLoading = true;
  return call('getOrderFlow').then(function(res){
    S.flowLoading = false;
    if(!res || res.ok === false) throw new Error((res && res.error) || '발주 자료를 받지 못했습니다');
    S.flow = res; S.flowAt = Date.now();
    S.flowErr = '';
    if(S.tab === 'order' || S.tab === 'home') render();
    else syncChrome();
    if(!silent) toast('발주 현황을 새로 읽었습니다', 'ok');
    return true;
  }).catch(function(e){
    S.flowLoading = false;
    S.flowErr = errMsg(e);
    if(S.tab === 'order' || S.tab === 'home') render();
    if(!silent) toast('발주 현황 실패 — ' + S.flowErr, 'err');
    return false;
  });
}
function livePollStart(){
  livePollStop();
  liveTimer = setInterval(function(){
    if(document.hidden) return;
    if(S.tab === 'home' || S.xSheet === 'today') loadLive(true);
  }, LIVE_POLL_MS);
}
function loadLive(silent){
  if(S.liveLoading) return;
  S.liveLoading = true;
  S.liveErr = null;
  call('getLive').then(function(res){
    if(!res || res.ok === false) throw new Error((res && (res.error || res.reason)) || '자료를 받지 못했습니다');
    var prev = {}, had = !!(S.live && S.live.orders && S.live.orders.length);
    if(had){ (S.live.orders || []).forEach(function(o){ prev[o.id] = 1; }); }
    var fresh = {};
    if(had){ (res.orders || []).forEach(function(o){ if(!prev[o.id]) fresh[o.id] = 1; }); }
    S.liveNewIds = fresh;
    var before = S.liveSig;
    S.liveSig = liveSig(res);
    S.live = res;
    S.liveLoading = false;
    if(S.xSheet === 'today'){
      if(before && before === S.liveSig) liveTouchStrip(); else render();
    } else if(S.tab === 'home'){
      if(before && before === S.liveSig) syncChrome(); else render();
    } else syncChrome();
  }).catch(function(e){
    S.liveLoading = false;
    S.liveErr = errMsg(e);
    if(S.xSheet === 'today' || S.tab === 'home') render(); else syncChrome();
    if(!silent) toast('매출 갱신 실패 — ' + S.liveErr, 'err');
  });
}

  if(!rows.length){ toast('수량을 입력한 품목이 없습니다 — 발주할 품목의 수량을 먼저 넣어 주세요', 'err'); return; }

    S.xOrdQ = ev.target.value;

  if(id === 'uQty'){
    /* 사용량을 치는 대로 실재고 미리보기를 다시 센다(저장 전 확인용). */
    S.uQty = ev.target.value;

      var s1 = (lockRor(W[i - 2], 17) ^ lockRor(W[i - 2], 19) ^ (W[i - 2] >>> 10)) >>> 0;
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0;

    for(i = 0; i < 64; i++){
