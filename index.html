<html lang="ko">
<head>

  <!-- v4.12.24 — 앱(script.google.com) 연결을 미리 열어 둔다(앱 문서 요청이 조금 일찍 시작된다) -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FAFAFA;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #app-frame {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: none;
      display: block;
    }

    /* v4.12.17 — 아이콘 알림 숫자(배지) 켜기 안내 바. 앱 화면을 가리지 않게 iframe 아래 칸으로 둔다. */
    #badgeTip {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
      background: #111214;
      color: #FFFFFF;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    #badgeTip[hidden] { display: none; }
    #badgeTip .bt-ic {
      width: 30px; height: 30px; flex: 0 0 30px; border-radius: 10px;
      background: rgba(226,78,107,.18); color: #FF8FA3;
      display: flex; align-items: center; justify-content: center;
    }
    #badgeTip .bt-ic svg { width: 16px; height: 16px; }
    #badgeTip .bt-tx { flex: 1; min-width: 0; }
    #badgeTip .bt-tx b {
      display: block; font-size: 13px; font-weight: 800; letter-spacing: -.2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #badgeTip .bt-tx span {
      display: block; font-size: 10.5px; font-weight: 600; color: #A7ACB3; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #badgeTipOn {
      flex: 0 0 auto; height: 32px; padding: 0 14px; border: 0; border-radius: 999px;
      background: #E24E6B; color: #FFF; font-size: 12.5px; font-weight: 800; font-family: inherit;
    }
    #badgeTipOn[hidden] { display: none; }
    #badgeTipX {
      flex: 0 0 auto; width: 28px; height: 28px; border: 0; border-radius: 50%;
      background: none; color: #7C828A; font-size: 14px; line-height: 1; font-family: inherit;
    }

    /* v4.12.32 — 앱이 뜨기 전(1.5~2초)을 브랜드 스플래시 대신 '앱과 같은 첫 화면 모양'(스켈레톤)으로 채운다.
       상단 바·오늘 매출 카드·할 일 카드·하단 탭을 앱과 같은 자리·같은 색으로 먼저 그려 두고,
       앱이 첫 화면을 그렸다는 신호(okgil-paint)나 iframe load 를 받으면 0.28초에 걸쳐 사라진다.
       값(매출·재고)은 앱이 도착하는 대로 채운다 — 여기서는 숫자를 지어내지 않는다. */
    #boot {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column;
      background: #FAFAFA; color: #111214; overflow: hidden;
      transition: opacity .28s;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    .bk-wrap {
      flex: 1 1 auto; min-height: 0; width: 100%; max-width: 640px; margin: 0 auto;
      display: flex; flex-direction: column; background: #FAFAFA;
    }
    .bk-bar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
      background: linear-gradient(180deg, #E1455F 0%, #D0384F 100%);
      border-bottom: 0; padding: calc(9px + env(safe-area-inset-top)) 14px 11px;
    }
    .bk-title { flex: 1; min-width: 0; padding-left: 2px; }
    .bk-title b { display: block; font-size: 16px; line-height: 1.25; font-weight: 700; letter-spacing: -.3px; color: #FFF; }
    .bk-title span { display: block; font-size: 11px; line-height: 1.3; color: rgba(255,255,255,.9); margin-top: 2px; }
    .bk-ib {
      width: 44px; height: 44px; flex: 0 0 44px; border: 0; border-radius: 13px;
      background: rgba(255,255,255,.2); color: #FFF;
      display: flex; align-items: center; justify-content: center;
    }
    .bk-ib svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .bk-main { flex: 1 1 auto; min-height: 0; overflow: hidden; }
    .bk-hero {
      background: linear-gradient(168deg, #EF5F7C 0%, #E24E6B 58%, #D84561 100%);
      color: #FFF; padding: 4px 18px 16px; border-radius: 0 0 26px 26px;
    }
    .bk-hero .l { font-size: 12px; font-weight: 800; letter-spacing: -.1px; opacity: .94; }
    .bk-sec { padding: 10px 14px 0; display: flex; flex-direction: column; gap: 10px; }
    .bk-task {
      display: flex; align-items: center; gap: 12px; background: #FFF; border-radius: 18px;
      padding: 11px 13px; box-shadow: 0 1px 3px rgba(60,32,24,.06);
    }
    .sk { display: block; border-radius: 7px; background: #EDE8E4; animation: skp 1.25s ease-in-out infinite; }
    .sk-v { background: rgba(255,255,255,.52); border-radius: 10px; margin-top: 12px; }
    .sk-w { background: rgba(255,255,255,.34); height: 10px; margin-top: 9px; }
    .sk-ic { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 12px; }
    .sk-tx { flex: 1; min-width: 0; }
    .sk-t { height: 12px; border-radius: 6px; }
    .sk-t.sm { height: 9px; margin-top: 7px; }
    .bk-tabs {
      flex: 0 0 auto; display: flex; background: #FFF; border-top: 1px solid #E9E9E7;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bk-tab {
      flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 3px; color: #8A9099; font-size: 11px; font-weight: 750; letter-spacing: -.2px;
    }
    .bk-tab.on { color: #CE3B54; }
    .bk-tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes skp { 0%, 100% { opacity: 1; } 50% { opacity: .48; } }
  </style>
</head>
<body>

        <div class="bk-tab"><svg viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>자료</div>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbxLARknNh7EdhMHr73c8M1UW5KeMzrVJw_t4B-zQbpcrVKVEIz_CEghKGiz-bChC0X3/exec?v=4157"
    allow="clipboard-read; clipboard-write; camera"
  ></iframe>

  <div id="badgeTip" hidden>
    <div class="bt-ic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.268 21a2 2 0 0 0 3.464 0"/>
        <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>
      </svg>
    </div>
    <div class="bt-tx">
      <b id="badgeTipT">아이콘 알림 숫자 켜기</b>
      <span id="badgeTipS">홈 화면 아이콘에 처리할 일 숫자가 보입니다</span>
    </div>
    <button id="badgeTipOn" type="button">켜기</button>
    <button id="badgeTipX" type="button" aria-label="닫기">✕</button>
  </div>

  <script>
  /* ============================================================
   * v4.12.17 — 홈 화면 아이콘 알림 숫자(배지) · 바깥 런처 담당
   * ------------------------------------------------------------
   * 앱(iframe, script.google.com)은 숫자만 세어 postMessage 로 넘긴다.
   * iOS 16.4+ 의 navigator.setAppBadge()는 cross-origin iframe 안에서 부르면
   * 무시되므로, 실제 배지 호출과 알림 권한 요청은 이 top-level 문서가 한다.
   *   · 권한 요청은 반드시 사용자가 이 문서의 버튼을 직접 누를 때만 한다(제스처).
   *   · 앱 → 런처 : { type:'okgil-badge', count, parts } · { type:'okgil-badge-hello' } · { type:'okgil-badge-ask' }
   *   · 런처 → 앱 : { type:'okgil-badge-state', permission, supported, standalone }
   * 닫기를 누르면 7일 뒤에 다시 안내한다. 앱 카드의 '켜는 방법'으로도 다시 띄운다.
   * ============================================================ */
  (function () {
    var frame = document.getElementById('app-frame');
    var tip = document.getElementById('badgeTip');
    var tipT = document.getElementById('badgeTipT');
    var tipS = document.getElementById('badgeTipS');
    var tipOn = document.getElementById('badgeTipOn');
    var tipX = document.getElementById('badgeTipX');
    var TIP_KEY = 'okgil.badgeTip.v1';
    var RECHECK_MS = 7 * 24 * 60 * 60 * 1000;

    /* ---------- v4.12.24 시작 화면 걷기 ----------
     * 앱(iframe)이 첫 화면을 그리면 { type:'okgil-paint' } 를 보낸다 → 그때 바로 걷는다.
     * 신호가 없으면(옛 앱 버전 등) iframe load 뒤 300ms, 마지막으로 3.5초 뒤에 걷는다.
     * 걷은 뒤에는 누르는 것을 막지 않는다(pointer-events:none + DOM 제거). */
    var bootEl = document.getElementById('boot');
    var bootOff = false;
    function bootHide(){
      if (bootOff || !bootEl) return;
      bootOff = true;
      try { bootEl.classList.add('hide'); } catch (e) {}
      setTimeout(function(){ try { bootEl.parentNode.removeChild(bootEl); } catch (e) {} }, 320);
    }
    try { frame.addEventListener('load', function(){ setTimeout(bootHide, 300); }); } catch (e) {}
    setTimeout(bootHide, 3500);

    var lastCount = 0;
    var lastParts = null;
    var lastOrigin = '';
    var lastSource = null;
    var asking = false;

    /* 검증용 창구(화면에는 아무 영향 없음) */
    var dbg = window.__okgilBadge = {
      count: 0, parts: null, permission: '', supported: false,
      standalone: false, apply: null, tip: 'hidden', log: []
    };
    function dlog(entry) {
      try { if (dbg.log.length < 20) dbg.log.push(entry); } catch (e) {}
    }

    function isAppOrigin(origin) {
      if (!origin) return false;
      if (origin === 'https://script.google.com') return true;
      return /^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/i.test(origin);
    }
    function badgeSupported() {
      try { return typeof navigator.setAppBadge === 'function'; } catch (e) { return false; }
    }
    function permission() {
      try {
        if (typeof Notification === 'undefined') return 'unsupported';
        return Notification.permission || 'default';
      } catch (e) { return 'unsupported'; }
    }
    function isStandalone() {
      try {
        if (window.navigator.standalone === true) return true;
        if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
      } catch (e) {}
      return false;
    }
    function applyBadge(n) {
      var num = Number(n) || 0;
      if (!badgeSupported()) { dbg.apply = { n: num, ok: false, err: 'unsupported' }; return; }
      try {
        if (num > 0) navigator.setAppBadge(num); else navigator.clearAppBadge();
        dbg.apply = { n: num, ok: true, err: '' };
      } catch (e) {
        dbg.apply = { n: num, ok: false, err: String((e && e.message) || e) };
      }
    }

    /* ---------- 안내 바 ---------- */
    function tipShow(mode) {
      if (!tip) return;
      if (mode === 'denied') {
        tipT.textContent = '아이콘 알림이 꺼져 있습니다';
        tipS.textContent = '아이폰 [설정 > 바나프레소 옥길점 > 알림]에서 켤 수 있어요';
        if (tipOn) tipOn.hidden = true;
      } else {
        tipT.textContent = '아이콘 알림 숫자 켜기';
        tipS.textContent = '홈 화면 아이콘에 처리할 일 숫자가 보입니다';
        if (tipOn) tipOn.hidden = false;
      }
      tip.hidden = false;
      dbg.tip = mode;
    }
    function tipHide() {
      if (tip) tip.hidden = true;
      dbg.tip = 'hidden';
    }
    function tipDismissedAt() {
      try { return parseInt(localStorage.getItem(TIP_KEY) || '0', 10) || 0; } catch (e) { return 0; }
    }
    function refreshTip(force) {
      var p = permission();
      /* 아이콘 숫자는 홈 화면에 설치한 앱에서만 보이므로, 설치 화면(standalone)에서만 안내한다. */
      if (p === 'granted' || !badgeSupported() || !isStandalone()) { tipHide(); return; }
      if (p === 'denied' && !force) { tipHide(); return; }
      if (!force) {
        var at = tipDismissedAt();
        if (at && (Date.now() - at) < RECHECK_MS) { tipHide(); return; }
      }
      tipShow(p === 'denied' ? 'denied' : 'ask');
    }

    /* ---------- 앱에 권한 상태 알리기 ----------
     * Apps Script 는 사용자 HTML 을 껍데기 안 sandbox iframe 에 한 겹 더 넣어 서빙한다.
     * 그래서 앱 창은 frame.contentWindow 가 아니라 그 안쪽 창이다 — 받은 메시지의 source 로 답한다. */
    function sendState(source, origin) {
      var win = source || lastSource;
      if (!win) return;
      try {
        win.postMessage({
          type: 'okgil-badge-state',
          permission: permission(),
          supported: badgeSupported(),
          standalone: isStandalone(),
          count: lastCount
        }, origin || lastOrigin || '*');
      } catch (e) {}
    }

    /* ---------- 권한 요청(사용자 탭에서만) ---------- */
    function askPermission() {
      if (asking) return;
      if (permission() === 'unsupported') return;
      asking = true;
      var settled = false;
      function done(p) {
        if (settled) return;
        settled = true;
        asking = false;
        if (p === 'granted') {
          try { localStorage.removeItem(TIP_KEY); } catch (e) {}
          tipHide();
          applyBadge(lastCount);
        } else if (p === 'denied') {
          tipShow('denied');
        } else {
          /* default — 사용자가 그냥 닫았다. 안내는 남겨 둔다. */
        }
        sendState(lastSource, lastOrigin);
      }
      try {
        var r = Notification.requestPermission(function (p) { done(p); });
        if (r && typeof r.then === 'function') r.then(function (p) { done(p); });
      } catch (e) {
        asking = false;
      }
    }

    if (tipOn) {
      tipOn.addEventListener('click', function () { askPermission(); });
    }
    if (tipX) {
      tipX.addEventListener('click', function () {
        try { localStorage.setItem(TIP_KEY, String(Date.now())); } catch (e) {}
        tipHide();
      });
    }

    /* ---------- 앱에서 오는 메시지 ---------- */
    window.addEventListener('message', function (ev) {
      dlog([String(ev.origin), String((ev.data && ev.data.type) || typeof ev.data),
            String((ev.data && ev.data.count))]);
      /* 중간 껍데기 프레임 때문에 source 는 frame.contentWindow 와 같지 않다.
       * 앱 오리진에서 온 okgil-* 메시지만 받는다(그 밖의 값은 배지·안내 상태만 바꾼다). */
      if (!isAppOrigin(ev.origin)) return;
      var d = ev.data;
      if (!d || typeof d !== 'object') return;
      lastOrigin = ev.origin;
      lastSource = ev.source || lastSource;

      if (d.type === 'okgil-paint') {
        bootHide();
        return;
      }
      if (d.type === 'okgil-badge') {
        var n = parseInt(d.count, 10);
        if (!isFinite(n) || n < 0) n = 0;
        lastCount = Math.min(n, 9999);
        lastParts = d.parts || null;
        dbg.count = lastCount;
        dbg.parts = lastParts;
        if (permission() === 'granted') applyBadge(lastCount);
      } else if (d.type === 'okgil-badge-hello') {
        sendState(ev.source, ev.origin);
        refreshTip(false);
      } else if (d.type === 'okgil-badge-ask') {
        refreshTip(true);
        sendState(ev.source, ev.origin);
      }
    });

    /* ---------- 앱이 다시 보이면(설정에서 알림을 켜고 돌아온 경우 포함) ---------- */
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      dbg.permission = permission();
      dbg.supported = badgeSupported();
      dbg.standalone = isStandalone();
      if (permission() === 'granted') applyBadge(lastCount);
      refreshTip(false);
      sendState(lastSource, lastOrigin);
    });

    dbg.permission = permission();
    dbg.supported = badgeSupported();
    dbg.standalone = isStandalone();
