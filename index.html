      try {
        if (/iPhone|iPad|iPod/i.test(String(navigator.userAgent || ''))) return true;

      standalone: false, apply: null, tip: 'hidden', log: []
    };
    function dlog(entry) {
      try { if (dbg.log.length < 20) dbg.log.push(entry); } catch (e) {}
    }

    function isAppOrigin(origin) {
      if (!origin) return false;
      /* v4.12.42 — 앱이 같은 오리진(깃허브 페이지)에서 돈다. */
      if (origin === location.origin) return true;
      if (origin === 'https://script.google.com') return true;
      return /^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/i.test(origin);
    }
    function badgeSupported() {
      try { return typeof navigator.setAppBadge === 'function'; } catch (e) { return false; }
    }
    function permission() {
      try {
        if (typeof Notification === 'undefined') return 'unsupported';
        return Notification.permission || 'default';
      } catch (e) { return 'unsupported'; }
    }
    function isStandalone() {
      try {
        if (window.navigator.standalone === true) return true;
        if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
      } catch (e) {}
      return false;
    }
    function applyBadge(n) {
      var num = Number(n) || 0;
      if (!badgeSupported()) { dbg.apply = { n: num, ok: false, err: 'unsupported' }; return; }
      try {
        /* v4.12.44 — setAppBadge 는 Promise 다. 거부가 나도 처리되지 않은 약속 오류가
           콘솔에 남지 않게 받아 둔다(권한이 꺼지는 순간 등). */
        var r = (num > 0) ? navigator.setAppBadge(num) : navigator.clearAppBadge();
        if (r && typeof r.then === 'function') {
          r.then(null, function (e) {
            dbg.apply = { n: num, ok: false, err: String((e && e.message) || e) };
          });
        }
        dbg.apply = { n: num, ok: true, err: '' };
      } catch (e) {
        dbg.apply = { n: num, ok: false, err: String((e && e.message) || e) };
      }
    }

    /* ---------- 안내 바 ----------
     * v4.12.43 — 안드로이드(갤럭시)에서 [켜기]를 눌러도 아무 반응이 없던 문제.
     * 권한 창이 아예 뜨지 않거나(차단) 거부되면, 아이폰 설정 경로만 알려 주던 것을
     * 기기(안드로이드·아이폰)에 맞는 설정 경로로 바꿔 안내한다. */
    function isAndroidUA() {
      try { return /Android/i.test(String(navigator.userAgent || '')); } catch (e) { return false; }
    }
    function isIOSUA() {
      try {
        if (/iPhone|iPad|iPod/i.test(String(navigator.userAgent || ''))) return true;
        /* 아이패드 사파리는 데스크톱 UA 로 온다 */
        if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
        return false;
      } catch (e) { return false; }
    }
    /* v4.12.44 — 앱 화면이 기기별 안내를 고를 수 있게 플랫폼을 함께 보낸다. */
    function devicePlatform() {
      if (isIOSUA()) return 'ios';
      if (isAndroidUA()) return 'android';
      return 'other';
    }
    function deviceHint() {
      if (isAndroidUA()) return '기기의 [설정 > 애플리케이션 > 사용 중인 브라우저(또는 옥길점 앱) > 알림] 또는 브라우저 설정에서 알림을 켜 주세요';
      if (isIOSUA()) return '아이폰 [설정 > 바나프레소·바나커피 옥길점 > 알림]에서 켤 수 있어요';
      return '브라우저 주소창의 자물쇠 > 알림 에서 알림을 허용해 주세요';
    }
    function setOnButton(label, busy) {
      if (!tipOn) return;
      tipOn.textContent = label;
      try { tipOn.disabled = !!busy; } catch (e) {}
    }
    function tipShow(mode) {
      if (!tip) return;
      if (mode === 'denied') {
        tipT.textContent = '아이콘 알림이 꺼져 있습니다';
        tipS.textContent = deviceHint();
        if (tipOn) tipOn.hidden = true;
      } else if (mode === 'blocked') {
        tipT.textContent = '알림 창이 열리지 않았습니다';
        tipS.textContent = deviceHint();
        /* v4.12.44 — 차단 상태에서 [켜기]를 또 보여 주면 같은 일이 반복된다(눌러도 창이 안 뜬다).
           버튼을 숨기고 설정 경로만 남긴다. 설정에서 켜고 돌아오면 visibilitychange 가 상태를 다시 읽는다. */
        if (tipOn) { tipOn.hidden = true; setOnButton('켜기', false); }
      } else {
        tipT.textContent = '아이콘 알림 숫자 켜기';
        tipS.textContent = '홈 화면 아이콘에 처리할 일 숫자가 보입니다';
        if (tipOn) { tipOn.hidden = false; setOnButton('켜기', false); }
      }
      try { tip.setAttribute('data-mode', mode); } catch (e) {}
      tip.hidden = false;
      dbg.tip = mode;
      lastTipMode = mode;
    }
    function tipHide() {
      if (tip) tip.hidden = true;
      dbg.tip = 'hidden';
      lastTipMode = 'hidden';
    }
    function tipDismissedAt() {
      try { return parseInt(localStorage.getItem(TIP_KEY) || '0', 10) || 0; } catch (e) { return 0; }
    }
    function refreshTip(force) {
      var p = permission();
      /* 아이콘 숫자는 홈 화면에 설치한 앱에서만 보이므로, 설치 화면(standalone)에서만 안내한다. */
      if (p === 'granted' || !badgeSupported() || !isStandalone()) { tipHide(); return; }
      if (p === 'denied' && !force) { tipHide(); return; }
      if (!force) {
        var at = tipDismissedAt();
        if (at && (Date.now() - at) < RECHECK_MS) { tipHide(); return; }
      }
      /* v4.12.44 — 이미 차단 안내가 떠 있으면 '켜기' 안내로 되돌리지 않는다. */
      if (p === 'denied') { tipShow('denied'); return; }
      if (lastTipMode === 'blocked') { tipShow('blocked'); return; }
      tipShow('ask');
    }

    /* ---------- 앱에 권한 상태 알리기 ----------
     * Apps Script 는 사용자 HTML 을 껍데기 안 sandbox iframe 에 한 겹 더 넣어 서빙한다.
     * 그래서 앱 창은 frame.contentWindow 가 아니라 그 안쪽 창이다 — 받은 메시지의 source 로 답한다. */
    function sendState(source, origin) {
      var win = source || lastSource;
      if (!win) return;
      try {
        win.postMessage({
          type: 'okgil-badge-state',
          permission: permission(),
          supported: badgeSupported(),
          standalone: isStandalone(),
          platform: devicePlatform(),
          count: lastCount
        }, origin || lastOrigin || '*');
      } catch (e) {}
    }

    /* ---------- 권한 요청(사용자 탭에서만) ----------
     * v4.12.43 — 안드로이드에서 [켜기]가 먹통이던 원인 세 가지를 함께 고친다.
     *   ① 누르면 바로 '확인 중…' 으로 바꿔 눌린 것이 보이게 한다.
     *   ② 표준 호출(인자 없음) 결과가 Promise 면 .then(done, fail) 만 쓴다. 구형 콜백은
     *      Promise 가 아닐 때만 쓴다(둘을 같이 부르면 done 이 두 번 불리거나 팝업이 막힌다).
     *   ③ 결과가 default(차단)이거나 예외·4초 무응답이면 조용히 끝내지 않고 안내로 바꾸고,
     *      asking 잠금과 버튼을 반드시 되돌린다(그래야 다시 누를 수 있다).
     */
    function askPermission() {
      if (asking) return;
      if (permission() === 'unsupported') return;
      asking = true;
      setOnButton('확인 중…', true);
      var answered = false, locked = true, timer = null;

      function unlock() {
        if (!locked) return;
        locked = false;
        asking = false;
        if (tipOn) tipOn.hidden = false;
        setOnButton('켜기', false);
      }
      function answer(p) {
        if (answered) return;
        answered = true;
        if (timer) { clearTimeout(timer); timer = null; }
        unlock();
        var q = p === 'granted' || p === 'denied' ? p : 'default';
        if (q === 'granted') {
          try { localStorage.removeItem(TIP_KEY); } catch (e) {}
          tipHide();
          applyBadge(lastCount);
        } else if (q === 'denied') {
          tipShow('denied');
        } else {
          /* default — 브라우저/OS 가 권한 창을 띄우지 않고 막았다. 안내로 바꾼다. */
          tipShow('blocked');
        }
        dbg.permission = permission();
        sendState(lastSource, lastOrigin);
      }
      /* 4초 안에 아무 대답이 없으면 화면부터 되돌린다(잠금이 남지 않게).
       * 단, 이때도 권한 창은 열려 있을 수 있으므로 대답이 늦게 오면 그대로 반영한다. */
      timer = setTimeout(function () {
        timer = null;
        if (answered) return;
        unlock();
        var live = permission();
        if (live === 'granted') { answered = true; tipHide(); applyBadge(lastCount); }
        else if (live === 'denied') { answered = true; tipShow('denied'); }
        else tipShow('blocked');
        dbg.permission = live;
        sendState(lastSource, lastOrigin);
      }, 4000);

      try {
        var r = null, threw = false;
        try { r = Notification.requestPermission(); } catch (e1) { threw = true; }
        if (r && typeof r.then === 'function') {
          r.then(function (p) { answer(p); }, function () { answer('error'); });
          return;
        }
        if (threw || r === undefined || r === null) {
          /* 구형 브라우저만 콜백 폴백(인자 없는 호출이 안 되는 경우) */
          try {
            Notification.requestPermission(function (p) { answer(p); });
          } catch (e2) {
            answer('error');
          }
          return;
        }
        /* 드물게 문자열을 바로 돌려주는 구현 */
        answer(typeof r === 'string' ? r : 'default');
      } catch (e) {
        answer('error');
      }
    }

    if (tipOn) {
      tipOn.addEventListener('click', function () {
        if (asking || tipOn.disabled) return;
        askPermission();
      });
    }
    if (tipX) {
      tipX.addEventListener('click', function () {
        try { localStorage.setItem(TIP_KEY, String(Date.now())); } catch (e) {}
        tipHide();
      });
    }

    /* ---------- v4.12.42 저장(쓰기) 다리 중계 ----------
     * 앱(같은 오리진 정적 페이지)에는 google.script.run 이 없다. 앱이 보낸 저장 요청을
     * 다리 iframe(앱스크립트 ?task=bridge)으로 넘기고, 그 응답을 앱으로 돌려준다.
     *   앱 → 여기 → 다리 / 다리 → 여기 → 앱
     * 다리 창은 구글 껍데기 안쪽이라 자식 창을 직접 잡을 수 없다 — 다리가 먼저 hello 를
     * 보내 오면 그 source 를 기억해 두고 그 창으로 보낸다(오리진 검사 포함). */
    var bridgeWin = null, appWin = null;
    var RPC_IN = { 'okgil-rpc': 1, 'okgil-migrate-req': 1 };
    var RPC_OUT = { 'okgil-bridge-ready': 1, 'okgil-rpc-res': 1, 'okgil-migrate-res': 1 };
    var rpcQueue = [];
    function appWindow() {
      try { if (!appWin) appWin = frame.contentWindow; } catch (e) {}
      return appWin;
    }
    function isBridgeOrigin(origin) {
      if (!origin) return false;
      if (origin === 'https://script.google.com') return true;
      return /^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/i.test(origin);
    }

    /* ---------- 앱에서 오는 메시지 ---------- */
    window.addEventListener('message', function (ev) {
      var dd = ev.data;
      /* 다리 → 앱 (같은 오리진인 앱 창으로 그대로 넘긴다) */
      if (dd && typeof dd === 'object' && RPC_OUT[dd.type]) {
        if (dd.type === 'okgil-bridge-ready' && isBridgeOrigin(ev.origin)) {
          bridgeWin = ev.source;
          while (rpcQueue.length) {
            try { bridgeWin.postMessage(rpcQueue.shift(), '*'); } catch (e) { break; }
          }
        }
        var aw = appWindow();
        if (aw) { try { aw.postMessage(dd, location.origin); } catch (e) {} }
        return;
      }
      /* 앱 → 다리 (같은 오리진 앱 창이 보낸 것만 넘긴다) */
      if (dd && typeof dd === 'object' && RPC_IN[dd.type] && ev.origin === location.origin) {
        if (bridgeWin) { try { bridgeWin.postMessage(dd, '*'); } catch (e) {} }
        else if (rpcQueue.length < 40) { rpcQueue.push(dd); }
        return;
      }
      dlog([String(ev.origin), String((ev.data && ev.data.type) || typeof ev.data),
            String((ev.data && ev.data.count))]);
      /* 중간 껍데기 프레임 때문에 source 는 frame.contentWindow 와 같지 않다.
       * 앱 오리진에서 온 okgil-* 메시지만 받는다(그 밖의 값은 배지·안내 상태만 바꾼다). */
      if (!isAppOrigin(ev.origin)) return;
      var d = ev.data;
      if (!d || typeof d !== 'object') return;
      lastOrigin = ev.origin;
      lastSource = ev.source || lastSource;

      if (d.type === 'okgil-paint') {
        bootHide();
        return;
      }
      if (d.type === 'okgil-badge') {
        var n = parseInt(d.count, 10);
        if (!isFinite(n) || n < 0) n = 0;
        lastCount = Math.min(n, 9999);
        lastParts = d.parts || null;
        dbg.count = lastCount;
        dbg.parts = lastParts;
        if (permission() === 'granted') applyBadge(lastCount);
      } else if (d.type === 'okgil-badge-hello') {
        sendState(ev.source, ev.origin);
        refreshTip(false);
      } else if (d.type === 'okgil-badge-ask') {
        refreshTip(true);
        sendState(ev.source, ev.origin);
      }
    });

    /* ---------- 앱이 다시 보이면(설정에서 알림을 켜고 돌아온 경우 포함) ---------- */
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      dbg.permission = permission();
      dbg.supported = badgeSupported();
      dbg.standalone = isStandalone();
      if (permission() === 'granted') applyBadge(lastCount);
      refreshTip(false);
      sendState(lastSource, lastOrigin);
    });

    dbg.permission = permission();
    dbg.supported = badgeSupported();
    dbg.standalone = isStandalone();
    refreshTip(false);
  })();
  </script>
</body>
</html>
